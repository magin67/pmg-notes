<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" role="img" aria-labelledby="title desc">
<title id="title">Балграф перестановки без петель</title><desc id="desc">На пяти вершинах изображены непересекающиеся орциклы a-b-a и c-d-e-c. У каждой вершины ровно одна входящая и одна исходящая дуга веса 1; петли отсутствуют.</desc>
