<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Переназначение двух связей</title><desc id="desc">Два единичных 2-орцикла a-c-a и b-d-b превращаются в орцикл a-d-b-c-a после обмена получателями у a и b. Оранжевым выделены изменяемые дуги. Остовной коэффициент при частичном обмене равен t.</desc>
