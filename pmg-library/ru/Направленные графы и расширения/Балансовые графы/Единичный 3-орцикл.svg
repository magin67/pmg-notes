<svg xmlns="http://www.w3.org/2000/svg" width="560" height="315" viewBox="0 0 560 315" role="img" aria-labelledby="title desc">
<title id="title">Единичный 3-орцикл</title>
<desc id="desc">Три дуги веса 1: a в b, b в c и c в a. У каждой вершины входящий и исходящий веса равны 1. Обратных дуг нет.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="560" height="315" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#285f87"/></marker></defs>
<line x1="296.26" y1="88.26" x2="432.32" y2="224.32" stroke="#285f87" stroke-width="3" marker-end="url(#arrow)"/>
<text x="386" y="143" font-size="19" fill="#285f87" font-weight="400" text-anchor="middle">1</text>
<line x1="427.00" y1="242.00" x2="135.00" y2="242.00" stroke="#285f87" stroke-width="3" marker-end="url(#arrow)"/>
<text x="280" y="270" font-size="19" fill="#285f87" font-weight="400" text-anchor="middle">1</text>
<line x1="126.26" y1="225.74" x2="262.32" y2="89.68" stroke="#285f87" stroke-width="3" marker-end="url(#arrow)"/>
<text x="174" y="143" font-size="19" fill="#285f87" font-weight="400" text-anchor="middle">1</text>
<circle cx="280" cy="72" r="20" fill="white" stroke="#344054" stroke-width="2"/>
<text x="280" y="79" font-size="23" fill="#1d2939" font-weight="400" text-anchor="middle">a</text>
<circle cx="450" cy="242" r="20" fill="white" stroke="#344054" stroke-width="2"/>
<text x="450" y="249" font-size="23" fill="#1d2939" font-weight="400" text-anchor="middle">b</text>
<circle cx="110" cy="242" r="20" fill="white" stroke="#344054" stroke-width="2"/>
<text x="110" y="249" font-size="23" fill="#1d2939" font-weight="400" text-anchor="middle">c</text>
<text x="280" y="306" font-size="18" fill="#1d2939" font-weight="400" text-anchor="middle">Входящий вес = исходящий вес = 1</text>
</svg>
