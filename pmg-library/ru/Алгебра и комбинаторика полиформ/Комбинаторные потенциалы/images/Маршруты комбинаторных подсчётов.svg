<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title"><title id="title">Маршруты комбинаторных подсчётов</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="650" fill="white"/>
<rect x="290" y="25" width="540" height="100" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="560" y="65" font-size="24" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Разбиения заданного типа</text>
<text x="560" y="94" font-size="24" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Потенциал второго рода</text>
<path d="M560 125 V155 H190 V190" fill="none" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M560 125 V155 H560 V190" fill="none" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M560 125 V155 H930 V190" fill="none" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="20" y="200" width="340" height="110" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="190" y="245" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Приложение к СПФ</text>
<text x="190" y="274" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Тип → сумма → леса</text>
<rect x="390" y="200" width="340" height="110" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="560" y="245" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Соединение компонент</text>
<text x="560" y="274" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Теорема Кэли</text>
<rect x="760" y="200" width="340" height="110" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="930" y="245" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Циклические разбиения</text>
<text x="930" y="274" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Потенциал первого рода</text>
<line x1="190" y1="315" x2="190" y2="365" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="560" y1="315" x2="560" y2="365" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="930" y1="315" x2="930" y2="365" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="20" y="375" width="340" height="115" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="190" y="420" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Размер представления</text>
<text x="190" y="449" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">и коэффициент тождества</text>
<rect x="390" y="375" width="340" height="115" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="560" y="420" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Корневые леса</text>
<text x="560" y="449" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Код → r-числа Стирлинга</text>
<rect x="760" y="375" width="340" height="115" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="930" y="420" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Пути и циклы</text>
<text x="930" y="449" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Графы → истории</text>
<text x="560" y="555" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">Что помечено? Что уже выбрано?</text>
<text x="560" y="584" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">Какие записи обозначают один объект?</text>
</svg>
