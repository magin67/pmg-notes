<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title"><title id="title">Два шага устранения повторений</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="500" fill="white"/>
<text x="560" y="40" font-size="26" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Один тип [2, 2]: три уровня подсчёта</text>
<rect x="20" y="80" width="320" height="330" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<rect x="400" y="80" width="320" height="330" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<rect x="780" y="80" width="320" height="330" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="180" y="125" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Упорядоченные записи</text>
<text x="180" y="154" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">по позициям 2 + 2</text>
<text x="180" y="215" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">ab | cd</text>
<text x="180" y="252" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">ba | cd</text>
<text x="180" y="289" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">ab | dc</text>
<text x="180" y="326" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">ba | dc</text>
<text x="180" y="355" font-size="17" fill="#647481" style="fill:#647481" font-weight="400" text-anchor="middle">Показаны 4 из 24 записей</text>
<text x="180" y="385" font-size="30" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">24</text>
<text x="560" y="125" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Порядок внутри</text>
<text x="560" y="154" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">каждой пары забыт</text>
<text x="560" y="230" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">{a,b} | {c,d}</text>
<text x="560" y="295" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">{c,d} | {a,b}</text>
<text x="560" y="355" font-size="17" fill="#647481" style="fill:#647481" font-weight="400" text-anchor="middle">Показаны 2 из 6 размещений</text>
<text x="560" y="385" font-size="30" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">6</text>
<text x="940" y="125" font-size="21" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Порядок одинаковых</text>
<text x="940" y="154" font-size="21" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">по размеру блоков забыт</text>
<text x="940" y="230" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">ab | cd</text>
<text x="940" y="273" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">ac | bd</text>
<text x="940" y="316" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">ad | bc</text>
<text x="940" y="385" font-size="30" fill="#30765e" style="fill:#30765e" font-weight="600" text-anchor="middle">3</text>
<line x1="345" y1="280" x2="395" y2="280" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="370" y="255" font-size="17" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">÷ (2! × 2!)</text>
<line x1="725" y1="280" x2="775" y2="280" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="750" y="255" font-size="17" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">÷ 2!</text>
<text x="560" y="465" font-size="28" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">4! / (2! × 2! × 2!) = 3</text>
</svg>
