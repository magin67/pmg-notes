<text x="235" y="220" font-size="25" fill="#aa5d12" style="fill:#aa5d12" font-weight="600" text-anchor="middle">2</text>
<line x1="83.0" y1="390.0" x2="167.0" y2="390.0" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="193.0" y1="390.0" x2="277.0" y2="390.0" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="70" cy="390" r="10" fill="white" stroke="#203344" stroke-width="2"/>
