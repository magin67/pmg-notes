<text xml:space="preserve" x="790" y="165" font-size="24" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Леса × вес × выборы корней</text>
<text xml:space="preserve" x="752.0" y="235" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">p</text>
<text xml:space="preserve" x="768.0" y="241.38" font-size="20" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">0</text>
<text xml:space="preserve" x="779.0" y="235" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> = 1</text>
<text xml:space="preserve" x="659.5" y="310" font-size="28" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">p</text>
<text xml:space="preserve" x="675.5" y="316.16" font-size="20" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">1</text>
<text xml:space="preserve" x="686.5" y="310" font-size="28" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> = 3 × (1/3) × 2 = 2</text>
<text xml:space="preserve" x="659.5" y="385" font-size="28" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">p</text>
<text xml:space="preserve" x="675.5" y="391.16" font-size="20" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">2</text>
<text xml:space="preserve" x="686.5" y="385" font-size="28" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> = 3 × (1/9) × 3 = 1</text>
<text xml:space="preserve" x="560" y="505" font-size="32" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">P(t) = 1 + 2t + t² = (1 + t)²</text>
<text xml:space="preserve" x="560" y="565" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Спектр лапласиана: 0, 1, 1</text>
