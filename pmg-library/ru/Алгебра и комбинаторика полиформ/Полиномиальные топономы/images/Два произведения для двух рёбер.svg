<text xml:space="preserve" x="115" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a</text>
<circle cx="220" cy="385" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="220" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">b</text>
<circle cx="325" cy="385" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="325" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">c</text>
<circle cx="430" cy="385" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="430" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">d</text>
<text xml:space="preserve" x="275" y="465" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Только две отдельные компоненты</text>
<text xml:space="preserve" x="845" y="290" font-size="25" fill="#aa5d12" style="fill:#aa5d12" font-weight="600" text-anchor="middle">(1 + (1)) * (1 + (1))</text>
