<line x1="776" y1="385" x2="809" y2="385" stroke="#24628a" stroke-width="4"/>
<circle cx="630" cy="385" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="630" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a</text>
<circle cx="695" cy="385" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="695" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">b</text>
<circle cx="760" cy="385" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="760" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">c</text>
<circle cx="825" cy="385" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="825" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">d</text>
<text xml:space="preserve" x="870" y="395" font-size="34" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">+</text>
<line x1="936" y1="385" x2="969" y2="385" stroke="#24628a" stroke-width="4"/>
<line x1="1001" y1="385" x2="1034" y2="385" stroke="#24628a" stroke-width="4"/>
<circle cx="920" cy="385" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="920" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a</text>
<circle cx="985" cy="385" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="985" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">b</text>
<circle cx="1050" cy="385" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="1050" y="392" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">c</text>
<text xml:space="preserve" x="845" y="465" font-size="26" fill="#aa5d12" style="fill:#aa5d12" font-weight="600" text-anchor="middle">1 + 2(1) + (1²) + (2)</text>
<text xml:space="preserve" x="275" y="535" font-size="25" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">Множители есть</text>
<text xml:space="preserve" x="845" y="535" font-size="24" fill="#aa5d12" style="fill:#aa5d12" font-weight="600" text-anchor="middle">Получен другой топоном</text>
<text xml:space="preserve" x="560" y="620" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Сопоставление добавляет тип (2), отсутствующий у двух независимых рёбер</text>
</svg>
