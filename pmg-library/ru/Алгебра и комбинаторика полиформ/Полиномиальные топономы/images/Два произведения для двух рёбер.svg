<text xml:space="preserve" x="275" y="225" font-size="26" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Обычное произведение</text>
<text xml:space="preserve" x="845" y="225" font-size="25" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Произведение второго рода</text>
<text xml:space="preserve" x="144.0" y="290" font-size="25" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start">(1 + x</text>
<text xml:space="preserve" x="209.0" y="295.5" font-size="18" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start">1</text>
<text xml:space="preserve" x="219.0" y="290" font-size="25" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start">)² = 1 + 2x</text>
<text xml:space="preserve" x="335.0" y="295.5" font-size="18" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start">1</text>
<text xml:space="preserve" x="345.0" y="290" font-size="25" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start"> + x</text>
<text xml:space="preserve" x="388.0" y="295.5" font-size="18" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start">1</text>
<text xml:space="preserve" x="398.0" y="290" font-size="25" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start">²</text>
<line x1="131" y1="385" x2="204" y2="385" stroke="#24628a" stroke-width="4"/>
