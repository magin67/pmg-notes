<text x="190" y="618" font-size="18" font-weight="400" text-anchor="middle" fill="#18313c">b | acd</text>
<text x="190" y="649" font-size="22" font-weight="700" text-anchor="middle" fill="#18313c">1 × 3 = 3</text>
<rect x="380" y="416" width="340" height="253" rx="12" fill="#f5f9fa" stroke="#dce7eb"/>
<text x="398" y="444" font-size="18" font-weight="700" text-anchor="start" fill="#18313c">Удалена ac</text>
