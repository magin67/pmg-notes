<text x="24" y="704" font-size="20" font-weight="700" text-anchor="start" fill="#18313c">Звезда: p₂ = 3 + 3 + 3 = 9;   τ = 1;   Kf = 9.</text>
<text x="24" y="748" font-size="17" font-weight="400" text-anchor="start" fill="#526c7b">Пунктир: удалённое ребро. Цвета вершин выделяют две компоненты оставшегося леса.</text>
