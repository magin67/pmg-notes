<text x="550" y="302" font-size="22" font-weight="700" text-anchor="middle" fill="#18313c">2 × 2 = 4</text>
<rect x="740" y="124" width="340" height="198" rx="12" fill="#f5f9fa" stroke="#dce7eb"/>
