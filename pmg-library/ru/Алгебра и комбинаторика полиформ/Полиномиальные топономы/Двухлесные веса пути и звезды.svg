<text x="910" y="302" font-size="22" font-weight="700" text-anchor="middle" fill="#18313c">3 × 1 = 3</text>
<text x="24" y="355" font-size="20" font-weight="700" text-anchor="start" fill="#18313c">Путь: p₂ = 3 + 4 + 3 = 10;   τ = 1;   Kf = 10.</text>
