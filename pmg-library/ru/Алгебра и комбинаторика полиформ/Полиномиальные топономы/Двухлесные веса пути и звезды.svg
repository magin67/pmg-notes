<text x="76" y="200" font-size="16" font-weight="400" text-anchor="middle" fill="#18313c">a</text>
<circle cx="152" cy="214" r="8" fill="#b66520" stroke="white" stroke-width="2"/>
<text x="152" y="200" font-size="16" font-weight="400" text-anchor="middle" fill="#18313c">b</text>
<circle cx="228" cy="214" r="8" fill="#b66520" stroke="white" stroke-width="2"/>
<text x="228" y="200" font-size="16" font-weight="400" text-anchor="middle" fill="#18313c">c</text>
<circle cx="304" cy="214" r="8" fill="#b66520" stroke="white" stroke-width="2"/>
<text x="304" y="200" font-size="16" font-weight="400" text-anchor="middle" fill="#18313c">d</text>
<text x="190" y="271" font-size="18" font-weight="400" text-anchor="middle" fill="#18313c">a | bcd</text>
<text x="190" y="302" font-size="22" font-weight="700" text-anchor="middle" fill="#18313c">1 × 3 = 3</text>
<rect x="380" y="124" width="340" height="198" rx="12" fill="#f5f9fa" stroke="#dce7eb"/>
<text x="398" y="152" font-size="18" font-weight="700" text-anchor="start" fill="#18313c">Удалена bc</text>
