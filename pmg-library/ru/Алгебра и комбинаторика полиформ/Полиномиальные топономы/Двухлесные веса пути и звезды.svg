<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="785" viewBox="0 0 1100 785" role="img" aria-labelledby="title desc">
<title id="title">Двухлесные веса пути и звезды</title>
<desc id="desc">Удаление каждого ребра единичного пути P4 даёт произведения размеров компонент 3,4,3; для звезды K1,3 получаются 3,3,3. Индексы Кирхгофа равны 10 и 9.</desc>
<rect width="1100" height="785" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="24" y="38" font-size="26" font-weight="700" text-anchor="start" fill="#18313c">Удаление ребра: какие пары вершин разделены</text>
<text x="24" y="70" font-size="18" font-weight="400" text-anchor="start" fill="#18313c">Один 2-лес учитывает все пары из разных компонент: их число равно |A| · |B|.</text>
<text x="24" y="108" font-size="21" font-weight="700" text-anchor="start" fill="#18313c">Путь P₄</text>
<rect x="20" y="124" width="340" height="198" rx="12" fill="#f5f9fa" stroke="#dce7eb"/>
<text x="38" y="152" font-size="18" font-weight="700" text-anchor="start" fill="#18313c">Удалена ab</text>
