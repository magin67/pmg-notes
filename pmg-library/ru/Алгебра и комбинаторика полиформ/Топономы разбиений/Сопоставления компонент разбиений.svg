<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
<title id="title">Семь сопоставлений в произведении (1²)*(1²)</title>
<desc id="desc">Каждый множитель содержит две части веса один. В левом столбце одно пустое сопоставление, дающее тип (1⁴). В среднем столбце четыре сопоставления одной пары, каждое даёт (2,1²). В правом столбце две биекции между парами частей, каждая даёт (2²). Синие кружки относятся к первому множителю, оранжевые ко второму; линии означают только сопоставления.</desc>
<rect width="960" height="820" fill="#ffffff"/>
<style>text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#172b4d} .heading{font-size:21px;font-weight:600} .small{font-size:15px;fill:#46566c} .result{font-size:24px;font-weight:600}</style>

<text x="480" y="36" text-anchor="middle" class="heading">Произведение (1²) * (1²)</text>
<text x="480" y="63" text-anchor="middle" class="small">Части первого множителя - синие, второго - оранжевые</text>
<rect x="20" y="84" width="280" height="698" rx="14" fill="#f7f9fc" stroke="#d9e1ed"/>
<text x="160" y="114" text-anchor="middle" class="heading">Без пар</text>
<text x="160" y="148" text-anchor="middle" class="result">1 · (1⁴)</text>
<rect x="340" y="84" width="280" height="698" rx="14" fill="#f7f9fc" stroke="#d9e1ed"/>
<text x="480" y="114" text-anchor="middle" class="heading">Одна пара</text>
<text x="480" y="148" text-anchor="middle" class="result">4 · (2,1²)</text>
<rect x="660" y="84" width="280" height="698" rx="14" fill="#f7f9fc" stroke="#d9e1ed"/>
<text x="800" y="114" text-anchor="middle" class="heading">Две пары</text>
<text x="800" y="148" text-anchor="middle" class="result">2 · (2²)</text>
