<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
<title id="title">Одна связь соединяет две компоненты</title>
<desc id="desc">Синий множитель состоит из рёбер ab и cd и имеет тип (1²). Оранжевый множитель является связью bc типа (1). Их обычное произведение даёт путь abcd типа (3). Вершины b и c уже общие у множителей, дополнительные отождествления не выполняются.</desc>
<rect width="960" height="270" fill="#fff"/>
<style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#172b4d}.heading{font-size:21px;font-weight:600}.small{font-size:15px;fill:#46566c}.result{font-size:24px;font-weight:600}.node{font-size:20px;font-weight:600}.classes{font-size:19px}</style>
<text x="480" y="35" text-anchor="middle" class="heading">Обычное произведение: связь между двумя компонентами</text>
<rect x="20" y="68" width="280" height="166" rx="10" fill="#f7f9fc" stroke="#ccd6e4"/>
<text x="160.0" y="100" text-anchor="middle" class="heading">Две компоненты</text>
<text x="160.0" y="215" text-anchor="middle" class="result">(1²)</text>
<rect x="360" y="68" width="220" height="166" rx="10" fill="#f7f9fc" stroke="#ccd6e4"/>
<text x="470.0" y="100" text-anchor="middle" class="heading">Одна связь</text>
<text x="470.0" y="215" text-anchor="middle" class="result">(1)</text>
<rect x="640" y="68" width="300" height="166" rx="10" fill="#f7f9fc" stroke="#ccd6e4"/>
<text x="790.0" y="100" text-anchor="middle" class="heading">Одна компонента</text>
<text x="790.0" y="215" text-anchor="middle" class="result">(3)</text>
<line x1="60" y1="146" x2="120" y2="146" stroke="#2166a4" stroke-width="3.2"/>
<line x1="200" y1="146" x2="260" y2="146" stroke="#2166a4" stroke-width="3.2"/>
<line x1="410" y1="146" x2="530" y2="146" stroke="#b05b13" stroke-width="3.2"/>
<line x1="675" y1="146" x2="750" y2="146" stroke="#2166a4" stroke-width="3.2"/>
<line x1="750" y1="146" x2="825" y2="146" stroke="#b05b13" stroke-width="3.2"/>
<line x1="825" y1="146" x2="900" y2="146" stroke="#2166a4" stroke-width="3.2"/>
<circle cx="60" cy="146" r="7.5" fill="#fff" stroke="#172b4d" stroke-width="1.8"/>
<text x="60" y="171" text-anchor="middle" font-size="16">a</text>
<circle cx="120" cy="146" r="7.5" fill="#fff" stroke="#172b4d" stroke-width="1.8"/>
<text x="120" y="171" text-anchor="middle" font-size="16">b</text>
<circle cx="200" cy="146" r="7.5" fill="#fff" stroke="#172b4d" stroke-width="1.8"/>
<text x="200" y="171" text-anchor="middle" font-size="16">c</text>
<circle cx="260" cy="146" r="7.5" fill="#fff" stroke="#172b4d" stroke-width="1.8"/>
<text x="260" y="171" text-anchor="middle" font-size="16">d</text>
<circle cx="410" cy="146" r="7.5" fill="#fff" stroke="#172b4d" stroke-width="1.8"/>
<text x="410" y="171" text-anchor="middle" font-size="16">b</text>
<circle cx="530" cy="146" r="7.5" fill="#fff" stroke="#172b4d" stroke-width="1.8"/>
<text x="530" y="171" text-anchor="middle" font-size="16">c</text>
<circle cx="675" cy="146" r="7.5" fill="#fff" stroke="#172b4d" stroke-width="1.8"/>
<text x="675" y="171" text-anchor="middle" font-size="16">a</text>
<circle cx="750" cy="146" r="7.5" fill="#fff" stroke="#172b4d" stroke-width="1.8"/>
<text x="750" y="171" text-anchor="middle" font-size="16">b</text>
<circle cx="825" cy="146" r="7.5" fill="#fff" stroke="#172b4d" stroke-width="1.8"/>
<text x="825" y="171" text-anchor="middle" font-size="16">c</text>
<circle cx="900" cy="146" r="7.5" fill="#fff" stroke="#172b4d" stroke-width="1.8"/>
<text x="900" y="171" text-anchor="middle" font-size="16">d</text>
<text x="330" y="155" text-anchor="middle" class="result">×</text>
<text x="610" y="155" text-anchor="middle" class="result">=</text>
<text x="480" y="259" text-anchor="middle" class="small">Все панели используют один набор вершин; связь bc пересекает обе синие компоненты.</text>
</svg>