<svg xmlns="http://www.w3.org/2000/svg" width="960" height="910" viewBox="0 0 960 910" role="img" aria-labelledby="title desc">
<title id="title">Семь склеек граничных компонент</title>
<desc id="desc">Первый множитель состоит из синих рёбер p1a1 и p2a2, второй из оранжевых q1b1 и q2b2. Слева одна схема без склеек. В центре все четыре отождествления одной пары корней pi=qj. Справа два полных сопоставления корней. Их типы дают (1⁴)+4(2,1²)+2(2²). Освободившиеся метки qj как изолированные вершины не показаны.</desc>
<rect width="960" height="910" fill="#fff"/>
<style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#172b4d}.heading{font-size:21px;font-weight:600}.small{font-size:15px;fill:#46566c}.result{font-size:24px;font-weight:600}.node{font-size:20px;font-weight:600}.classes{font-size:19px}</style>
<text x="480" y="35" text-anchor="middle" class="result">(1²) * (1²) = (1⁴) + 4(2,1²) + 2(2²)</text>
<text x="480" y="63" text-anchor="middle" class="small">Синие связи pᵢaᵢ, оранжевые qⱼbⱼ; двойной круг обозначает корень</text>
<rect x="20" y="84" width="280" height="782" rx="14" fill="#f7f9fc" stroke="#d9e1ed"/>
<text x="160" y="114" text-anchor="middle" class="heading">Без склеек</text>
<text x="160" y="148" text-anchor="middle" class="result">1 · (1⁴)</text>
