<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
<title id="title">Два дерева с одинаковой коэффициентной таблицей</title>
<desc id="desc">Деревья T1 и T2 на десяти вершинах. У T1 центральное ребро ab, при a ветви a-c-g-i-j и a-d-h, при b рёбра be и bf. У T2 центральное ребро ab, при a ветви a-c-g-i и a-d, при b ветви b-e-h-j и b-f. Диаметры 6 и 7. Все веса рёбер равны единице.</desc>
