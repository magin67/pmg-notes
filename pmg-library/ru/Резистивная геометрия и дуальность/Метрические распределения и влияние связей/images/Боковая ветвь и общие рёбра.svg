<text xml:space="preserve" x="560" y="45" font-size="29" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Боковая ветвь не входит ни в один путь</text>
<text xml:space="preserve" x="560" y="98" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">v = (ad),   u = (be),   c = 1</text>
