<text xml:space="preserve" x="560" y="466" font-size="29" fill="#b56414" style="fill:#b56414" font-weight="600" text-anchor="middle">v · u = 1 + 1 = 2</text>
<text xml:space="preserve" x="560" y="515" font-size="23" fill="#647481" style="fill:#647481" font-weight="400" text-anchor="middle">Углы на рисунке показывают только устройство дерева</text>
