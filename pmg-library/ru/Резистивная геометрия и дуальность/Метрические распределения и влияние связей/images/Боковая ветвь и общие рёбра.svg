<text xml:space="preserve" x="340" y="232" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">b</text>
<circle cx="550" cy="225" r="20" fill="white" stroke="#203344" stroke-width="2"/>
