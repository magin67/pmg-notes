    <dc:description>Единичный треугольник и его детализация новой вершиной d на связи ac. Старый вклад ac 4/9 делится на ad 2/9 и cd 2/9; вклады ab и bc остаются 1/9. Резистенс ac остаётся 2/3.</dc:description>
