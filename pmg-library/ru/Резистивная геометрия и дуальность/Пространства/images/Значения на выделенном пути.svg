<svg xmlns="http://www.w3.org/2000/svg" width="890" height="250" viewBox="0 0 890 250" role="img" aria-labelledby="title desc">
<title id="title">Задача Дирихле на взвешенном пути</title>
<desc id="desc">Путь a-x-y-b. Величины связей ax, xy, yb равны 2, 1, 3. Заданы f(a)=0 и f(b)=11. Найдены f(x)=3 и f(y)=9. Положение вершин схематическое.</desc>
<rect width="100%" height="100%" rx="12" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="445.000" y="35.000" text-anchor="middle" font-size="23" fill="#24364b">Заданные и найденные значения</text><path d="M122.000,120.000 L308.000,120.000" fill="none" stroke="#60758b" stroke-width="3"/><text x="215.000" y="100.000" text-anchor="middle" font-size="22" fill="#24364b">2</text><path d="M352.000,120.000 L538.000,120.000" fill="none" stroke="#60758b" stroke-width="3"/><text x="445.000" y="100.000" text-anchor="middle" font-size="22" fill="#24364b">1</text><path d="M582.000,120.000 L768.000,120.000" fill="none" stroke="#60758b" stroke-width="3"/><text x="675.000" y="100.000" text-anchor="middle" font-size="22" fill="#24364b">3</text><circle cx="100" cy="120" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="100.000" y="127.000" text-anchor="middle" font-size="23" fill="#2563a6">a</text><text x="100.000" y="180.000" text-anchor="middle" font-size="23" fill="#2563a6">f<tspan baseline-shift="sub" font-size="16.099999999999998">a</tspan> = 0</text><text x="100.000" y="216.000" text-anchor="middle" font-size="17" fill="#2563a6">задано</text><circle cx="330" cy="120" r="22" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="330.000" y="127.000" text-anchor="middle" font-size="23" fill="#ad4937">x</text><text x="330.000" y="180.000" text-anchor="middle" font-size="23" fill="#ad4937">f<tspan baseline-shift="sub" font-size="16.099999999999998">x</tspan> = 3</text><text x="330.000" y="216.000" text-anchor="middle" font-size="17" fill="#ad4937">найдено</text><circle cx="560" cy="120" r="22" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="560.000" y="127.000" text-anchor="middle" font-size="23" fill="#ad4937">y</text><text x="560.000" y="180.000" text-anchor="middle" font-size="23" fill="#ad4937">f<tspan baseline-shift="sub" font-size="16.099999999999998">y</tspan> = 9</text><text x="560.000" y="216.000" text-anchor="middle" font-size="17" fill="#ad4937">найдено</text><circle cx="790" cy="120" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="790.000" y="127.000" text-anchor="middle" font-size="23" fill="#2563a6">b</text><text x="790.000" y="180.000" text-anchor="middle" font-size="23" fill="#2563a6">f<tspan baseline-shift="sub" font-size="16.099999999999998">b</tspan> = 11</text><text x="790.000" y="216.000" text-anchor="middle" font-size="17" fill="#2563a6">задано</text></g>
</svg>