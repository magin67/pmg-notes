<svg xmlns="http://www.w3.org/2000/svg" width="830" height="470" viewBox="0 0 830 470" role="img" aria-labelledby="title desc">
<title id="title">Стягивание концов пути как ортогональная проекция</title><desc id="desc">Слева точная резистивная реализация единичного пути a-b-c: прямой угол при b, стороны ab и bc единичные. Проекция на прямую bo, перпендикулярную ac, сливает a и c в середине o. Справа граф с одной связью величины 2.</desc>
<rect width="100%" height="100%" fill="white" rx="12"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="238" y="37" text-anchor="middle" font-size="22" fill="#24364b">Стягивание как проекция</text><path d="M95 345 H375 V65 Z" fill="#f3f7fb"/><path d="M95 345 L375 345" fill="none" stroke="#50657b" stroke-width="3"/><path d="M375 345 L375 65" fill="none" stroke="#50657b" stroke-width="3"/><path d="M95 345 L375 65" fill="none" stroke="#b85a46" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M155 125 L420 390" fill="none" stroke="#2563a6" stroke-width="2"/><path d="M235 205 L375 345" fill="none" stroke="#2563a6" stroke-width="5"/><path d="M355 345 V325 H375" fill="none" stroke="#50657b" stroke-width="1.5"/><path d="M249 191 L263 205 L249 219" fill="none" stroke="#2563a6" stroke-width="1.5"/><circle cx="95" cy="345" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="80" y="375" text-anchor="middle" font-size="22" fill="#24364b">a</text><circle cx="375" cy="345" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="397" y="363" text-anchor="middle" font-size="22" fill="#24364b">b</text><circle cx="375" cy="65" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="397" y="71" text-anchor="middle" font-size="22" fill="#24364b">c</text><circle cx="235" cy="205" r="7" fill="#fff" stroke="#2563a6" stroke-width="2.5"/><text x="211" y="197" text-anchor="middle" font-size="22" fill="#2563a6">o</text><text x="230" y="379" text-anchor="middle" font-size="20" fill="#24364b">1</text><text x="399" y="205" text-anchor="middle" font-size="20" fill="#24364b">1</text><text x="127" y="230" text-anchor="middle" font-size="19" fill="#b85a46">d = c − a</text><text x="333" y="250" text-anchor="middle" font-size="22" fill="#2563a6">S<tspan baseline-shift="super" font-size="15.399999999999999">⊥</tspan></text><text x="235" y="432" text-anchor="middle" font-size="21" fill="#2563a6">o = (a + c)/2</text><path d="M460 45 L460 445" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><text x="640" y="80" text-anchor="middle" font-size="23" fill="#24364b">После стягивания</text><path d="M545 230 L735 230" fill="none" stroke="#50657b" stroke-width="3"/><circle cx="545" cy="230" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="545" y="262" text-anchor="middle" font-size="22" fill="#24364b">o</text><circle cx="735" cy="230" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="735" y="262" text-anchor="middle" font-size="22" fill="#24364b">b</text><text x="640" y="212" text-anchor="middle" font-size="21" fill="#24364b">2</text><text x="640" y="320" text-anchor="middle" font-size="25" fill="#2563a6">R<tspan baseline-shift="sub" font-size="17.5">ob</tspan> = 1/2</text><text x="640" y="360" text-anchor="middle" font-size="22" fill="#24364b">τ = 2</text><text x="640" y="406" text-anchor="middle" font-size="17" fill="#64748b">Число над связью:</text><text x="640" y="431" text-anchor="middle" font-size="17" fill="#64748b">величина связи</text></g></svg>