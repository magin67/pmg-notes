<svg xmlns="http://www.w3.org/2000/svg" width="980" height="405" viewBox="0 0 980 405" role="img" aria-labelledby="title desc">
<title id="title">Исключение центра звезды</title>
<desc id="desc">Слева звезда с центром x и листьями a,b,c. Все три величины связей равны 1. Справа треугольник на a,b,c, все три величины связей равны 1/3. В обоих графах резистенс каждой пары сохраняемых вершин равен 2. Схема связей, не метрическая реализация.</desc>
<rect width="100%" height="100%" rx="12" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="230" y="34" text-anchor="middle" font-size="23" fill="#24364b">Единичная звезда</text><text x="750" y="34" text-anchor="middle" font-size="23" fill="#24364b">Граф на a, b, c</text><path d="M90,300 L230,210" stroke="#60758b" stroke-width="3" fill="none"/><path d="M370,300 L230,210" stroke="#60758b" stroke-width="3" fill="none"/><path d="M230,90 L230,210" stroke="#60758b" stroke-width="3" fill="none"/><text x="143" y="247" text-anchor="middle" font-size="22" fill="#24364b">1</text><text x="317" y="247" text-anchor="middle" font-size="22" fill="#24364b">1</text><text x="252" y="155" text-anchor="middle" font-size="22" fill="#24364b">1</text><path d="M610,300 L890,300" stroke="#2563a6" stroke-width="3" fill="none"/><path d="M610,300 L750,90" stroke="#2563a6" stroke-width="3" fill="none"/><path d="M890,300 L750,90" stroke="#2563a6" stroke-width="3" fill="none"/><text x="750" y="282" text-anchor="middle" font-size="23" fill="#2563a6">1/3</text><text x="650" y="190" text-anchor="middle" font-size="23" fill="#2563a6">1/3</text><text x="850" y="190" text-anchor="middle" font-size="23" fill="#2563a6">1/3</text><circle cx="90" cy="300" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="90" y="307" text-anchor="middle" font-size="23" fill="#2563a6">a</text><circle cx="370" cy="300" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="370" y="307" text-anchor="middle" font-size="23" fill="#2563a6">b</text><circle cx="230" cy="90" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="230" y="97" text-anchor="middle" font-size="23" fill="#2563a6">c</text><circle cx="610" cy="300" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="610" y="307" text-anchor="middle" font-size="23" fill="#2563a6">a</text><circle cx="890" cy="300" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="890" y="307" text-anchor="middle" font-size="23" fill="#2563a6">b</text><circle cx="750" cy="90" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="750" y="97" text-anchor="middle" font-size="23" fill="#2563a6">c</text><circle cx="230" cy="210" r="20" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="230" y="217" text-anchor="middle" font-size="23" fill="#ad4937">x</text><path d="M447,210 L535,210" stroke="#60758b" stroke-width="3" fill="none"/><path d="M524,203 L535,210" stroke="#60758b" stroke-width="3" fill="none"/><path d="M524,217 L535,210" stroke="#60758b" stroke-width="3" fill="none"/><text x="491" y="178" text-anchor="middle" font-size="18" fill="#24364b">исключить x</text><text x="490" y="370" text-anchor="middle" font-size="22" fill="#24364b">Резистенс каждой пары сохраняемых вершин: 2</text></g>
</svg>