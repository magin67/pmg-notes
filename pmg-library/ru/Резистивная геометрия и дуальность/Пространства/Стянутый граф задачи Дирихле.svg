<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
<title id="title">Стянутый граф задачи Дирихле</title>
<desc id="desc">После стягивания a,b в o взвешенный путь становится треугольником o,x,y с величинами связей ox=2, xy=1, oy=3. Остовной коэффициент равен 11. Положение вершин схематическое, не в масштабе резистивных длин.</desc>
<rect width="100%" height="100%" rx="12" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="300.000" y="32.000" text-anchor="middle" font-size="22" fill="#24364b">После отождествления a и b</text><path d="M300.000,85.000 L150.000,280.000" fill="none" stroke="#60758b" stroke-width="2.5"/><path d="M300.000,85.000 L450.000,280.000" fill="none" stroke="#60758b" stroke-width="2.5"/><path d="M150.000,280.000 L450.000,280.000" fill="none" stroke="#60758b" stroke-width="2.5"/><text x="200.000" y="180.000" text-anchor="middle" font-size="23" fill="#24364b">2</text><text x="400.000" y="180.000" text-anchor="middle" font-size="23" fill="#24364b">3</text><text x="300.000" y="266.000" text-anchor="middle" font-size="23" fill="#24364b">1</text><circle cx="300.000" cy="85.000" r="10" stroke="#2563a6" stroke-width="2.5" fill="#edf4fb"/><text x="300.000" y="68.000" text-anchor="middle" font-size="22" fill="#2563a6">o</text><circle cx="150.000" cy="280.000" r="6" stroke="#24364b" stroke-width="2.5" fill="white"/><text x="130.000" y="312.000" text-anchor="middle" font-size="22" fill="#24364b">x</text><circle cx="450.000" cy="280.000" r="6" stroke="#24364b" stroke-width="2.5" fill="white"/><text x="470.000" y="312.000" text-anchor="middle" font-size="22" fill="#24364b">y</text><text x="300.000" y="358.000" text-anchor="middle" font-size="22" fill="#24364b">v<tspan baseline-shift="sub" font-size="15.399999999999999">x</tspan> = x − o,   v<tspan baseline-shift="sub" font-size="15.399999999999999">y</tspan> = y − o</text><text x="300.000" y="400.000" text-anchor="middle" font-size="19" fill="#24364b">Остовной коэффициент: 2·1 + 2·3 + 1·3 = 11</text></g>
</svg>