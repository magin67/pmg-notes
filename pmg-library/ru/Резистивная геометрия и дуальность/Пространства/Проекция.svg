<svg xmlns="http://www.w3.org/2000/svg" width="990" height="485" viewBox="0 0 990 485" role="img" aria-labelledby="title desc">
<title id="title">Проекция вершины пути на прямую через крайние вершины</title><desc id="desc">Слева путь a-b-c с единичными связями. Справа вершины a, b, c образуют прямоугольный равнобедренный треугольник с прямым углом при b. Проекция b на прямую ac есть её середина q. Квадрат длины отклонения b-q равен одной второй.</desc>
<defs>
 <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker>
 <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#b8463d"/></marker>
 <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff" rx="12"/>
<g font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#1e293b" stroke-linecap="round" stroke-linejoin="round">
<text x="215" y="42" text-anchor="middle" font-size="24">Исходный граф</text>
<text x="725" y="42" text-anchor="middle" font-size="24">Резистивная геометрия</text>
<path d="M425 65 V420" stroke="#e2e8f0" stroke-width="2"/>
<path d="M75 220 H350" fill="none" stroke="#64748b" stroke-width="4"/>
<g fill="#fff" stroke="#334155" stroke-width="3"><circle cx="75" cy="220" r="10"/><circle cx="212.5" cy="220" r="10"/><circle cx="350" cy="220" r="10"/></g>
<text x="75" y="263" text-anchor="middle" font-style="italic">a</text><text x="212.5" y="263" text-anchor="middle" font-style="italic">b</text><text x="350" y="263" text-anchor="middle" font-style="italic">c</text>
<text x="144" y="202" text-anchor="middle">1</text><text x="281" y="202" text-anchor="middle">1</text>
<text x="212" y="323" text-anchor="middle" fill="#64748b" font-size="18">Числа над связями:</text>
<text x="212" y="349" text-anchor="middle" fill="#64748b" font-size="18">величины связей</text>
<path d="M550 375 H845 V80 Z" fill="#eff6fc"/>
<path d="M550 375 H845 V80" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M530 395 L865 60" stroke="#2563a6" stroke-width="3"/>
<path d="M697.5 227.5 L845 375" stroke="#b8463d" stroke-width="3"/>
<path d="M828 375 V358 H845" fill="none" stroke="#64748b" stroke-width="1.6"/>
<path d="M708.1 216.9 L718.7 227.5 L708.1 238.1" fill="none" stroke="#b8463d" stroke-width="1.6"/>
<g fill="#fff" stroke="#334155" stroke-width="2.7"><circle cx="550" cy="375" r="7"/><circle cx="845" cy="375" r="7"/><circle cx="845" cy="80" r="7"/></g>
<circle cx="697.5" cy="227.5" r="6" fill="#2563a6" stroke="#fff" stroke-width="2"/>
<text x="535" y="410" font-style="italic">a</text><text x="852" y="409" font-style="italic">b</text><text x="864" y="86" font-style="italic">c</text>
<text x="663" y="220" font-style="italic" fill="#2563a6">q</text>
<text x="697" y="410" text-anchor="middle">u</text><text x="868" y="235">v</text>
<text x="645" y="331" fill="#b8463d">r² = 1/2</text>
<text x="625" y="270" fill="#2563a6" text-anchor="middle" transform="rotate(-45 625 270)">w = c − a</text>
<text x="710" y="453" text-anchor="middle" font-size="19">q = (a + c)/2,   u² = v² = 1,   u · v = 0</text>
</g></svg>