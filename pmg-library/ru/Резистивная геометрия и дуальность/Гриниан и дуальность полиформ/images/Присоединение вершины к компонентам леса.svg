<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title"><title id="title">Присоединение вершины к компонентам леса</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="650" fill="white"/>
<text xml:space="preserve" x="560" y="43" font-size="28" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">По одному присоединению к каждой компоненте</text>
<rect x="25" y="100" width="330" height="155" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<rect x="395" y="100" width="330" height="155" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<rect x="765" y="100" width="330" height="155" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<line x1="85" y1="180" x2="560" y2="450" stroke="#a9b6c0" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="290" y1="180" x2="560" y2="450" stroke="#24628a" stroke-width="4"/>
<line x1="455" y1="180" x2="560" y2="450" stroke="#24628a" stroke-width="4"/>
<line x1="660" y1="180" x2="560" y2="450" stroke="#a9b6c0" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="930" y1="180" x2="560" y2="450" stroke="#24628a" stroke-width="4"/>
<line x1="107.0" y1="180.0" x2="268.0" y2="180.0" stroke="#aa5d12" stroke-width="3"/>
<line x1="477.0" y1="180.0" x2="638.0" y2="180.0" stroke="#aa5d12" stroke-width="3"/>
<circle cx="85" cy="180" r="19" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="85" y="187" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a</text>
<circle cx="290" cy="180" r="19" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="290" y="187" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">b</text>
<circle cx="455" cy="180" r="19" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="455" y="187" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">c</text>
<circle cx="660" cy="180" r="19" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="660" y="187" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">d</text>
<circle cx="930" cy="180" r="19" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="930" y="187" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">e</text>
<circle cx="560" cy="450" r="24" fill="#fff1da" stroke="#aa5d12" stroke-width="2"/>
<text xml:space="preserve" x="560" y="457" font-size="21" fill="#aa5d12" style="fill:#aa5d12" font-weight="400" text-anchor="middle">p</text>
<text xml:space="preserve" x="190" y="135" font-size="23" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">2 места</text>
<text xml:space="preserve" x="560" y="135" font-size="23" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">2 места</text>
<text xml:space="preserve" x="930" y="135" font-size="23" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">1 место</text>
<text xml:space="preserve" x="560" y="515" font-size="25" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">Показан один выбор: b, c, e</text>
<text xml:space="preserve" x="560" y="565" font-size="27" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Всего 2 × 2 × 1 = 4 способа</text>
<text xml:space="preserve" x="560" y="615" font-size="24" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">При разных проводимостях складываются веса вариантов</text>
</svg>
