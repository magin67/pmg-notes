    <text x="190" y="130" font-size="16" fill="#126654" font-weight="600">c</text>
    <circle cx="122" cy="125" r="12" fill="white" stroke="#53666f" stroke-width="2"/>
    <text x="122" y="130" font-size="16" fill="#53666f" font-weight="600">d</text>
    <path d="M 431 102 Q 479 54 527 102" stroke="#135977" stroke-width="3" fill="none"/>
    <text x="479" y="72" font-size="15" fill="#135977">ad</text>
