    <line x1="190" y1="368" x2="122" y2="368" stroke="#9d4b20" stroke-width="3"/>
    <circle cx="122" cy="322" r="12" fill="#e6f4ec" stroke="#126654" stroke-width="2"/>
    <text x="122" y="327" font-size="16" fill="#126654" font-weight="600">a</text>
    <circle cx="190" cy="322" r="12" fill="#e6f4ec" stroke="#126654" stroke-width="2"/>
