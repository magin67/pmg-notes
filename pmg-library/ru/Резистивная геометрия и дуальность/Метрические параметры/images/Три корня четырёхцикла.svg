<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ru" viewBox="0 0 630 403" width="630" height="403" role="img" aria-labelledby="title desc">
  <title id="title">Три выделенные вершины четырёхцикла</title>
  <desc id="desc">Два допустимых однорёберных леса содержат ad или cd. После стягивания им отвечают два помеченных однорёберных дерева между s и d.</desc>
