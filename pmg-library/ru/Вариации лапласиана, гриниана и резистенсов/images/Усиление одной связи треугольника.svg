<svg xmlns="http://www.w3.org/2000/svg" width="900" height="328" viewBox="0 0 900 328" role="img" aria-labelledby="title desc"><title id="title">Усиление одной связи треугольника</title><desc id="desc">Слева все три проводимости равны 1 и остовной коэффициент равен 3. Справа проводимость связи 12 равна 2, остальные равны 1, остовной коэффициент равен 5. Вершины обозначены кругами.</desc><style>text{font-family:Arial,DejaVu Sans,sans-serif;fill:#17263a}.heading{font-size:21px;font-weight:600}.weight{font-size:22px}.vertex{font-size:18px}.result{font-size:22px;font-weight:600}</style><g transform="translate(0 0)"><rect x="12" y="12" width="416" height="302" rx="14" fill="#f7f9fc" stroke="#d8e1ed"/><text x="220" y="45" text-anchor="middle" class="heading">Исходный граф</text><path d="M95 228 L220 98 L345 228 Z" fill="none" stroke="#64748b" stroke-width="4"/><path d="M95 228 H345" stroke="#64748b" stroke-width="4" fill="none"/><g class="weight"><text x="143" y="153">1</text><text x="297" y="153">1</text><text x="220" y="218" text-anchor="middle" fill="#334155">1</text></g><g fill="white" stroke="#334155" stroke-width="2"><circle cx="95" cy="228" r="19"/><circle cx="345" cy="228" r="19"/><circle cx="220" cy="98" r="19"/></g><g class="vertex" text-anchor="middle"><text x="95" y="234">1</text><text x="345" y="234">2</text><text x="220" y="104">3</text></g><text x="220" y="285" text-anchor="middle" class="result">τ = 3</text></g><g transform="translate(460 0)"><rect x="12" y="12" width="416" height="302" rx="14" fill="#f7f9fc" stroke="#d8e1ed"/><text x="220" y="45" text-anchor="middle" class="heading">После усиления связи 12</text><path d="M95 228 L220 98 L345 228 Z" fill="none" stroke="#64748b" stroke-width="4"/><path d="M95 228 H345" stroke="#c2410c" stroke-width="7" fill="none"/><g class="weight"><text x="143" y="153">1</text><text x="297" y="153">1</text><text x="220" y="218" text-anchor="middle" fill="#b93815">2</text></g><g fill="white" stroke="#334155" stroke-width="2"><circle cx="95" cy="228" r="19"/><circle cx="345" cy="228" r="19"/><circle cx="220" cy="98" r="19"/></g><g class="vertex" text-anchor="middle"><text x="95" y="234">1</text><text x="345" y="234">2</text><text x="220" y="104">3</text></g><text x="220" y="285" text-anchor="middle" class="result">τ = 5</text></g></svg>
