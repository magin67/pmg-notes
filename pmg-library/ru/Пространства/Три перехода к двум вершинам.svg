<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="340" viewBox="0 0 1160 340" role="img" aria-labelledby="title desc">
<title id="title">Выбор подпространства, удаление и стягивание</title><desc id="desc">Единичный треугольник: выбор прямой ab сохраняет резистенс 2/3; удаление c даёт резистенс 1; стягивание b и c даёт связь величины 2 и резистенс 1/2. Линии графов нарисованы схематически, а не в масштабе резистивных длин.</desc>
<rect width="100%" height="100%" fill="white" rx="12"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M290 24 L290 315" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><path d="M580 24 L580 315" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><path d="M870 24 L870 315" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><text x="145" y="38" text-anchor="middle" font-size="21" fill="#24364b">Исходный граф</text><text x="435" y="38" text-anchor="middle" font-size="21" fill="#24364b">Выбор прямой</text><text x="725" y="38" text-anchor="middle" font-size="21" fill="#24364b">Удаление c</text><text x="1015" y="38" text-anchor="middle" font-size="21" fill="#24364b">Стягивание b, c</text><path d="M65 208 L225 208" fill="none" stroke="#50657b" stroke-width="3"/><path d="M65 208 L145 95" fill="none" stroke="#50657b" stroke-width="3"/><path d="M145 95 L225 208" fill="none" stroke="#50657b" stroke-width="3"/><circle cx="65" cy="208" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="65" y="240" text-anchor="middle" font-size="22" fill="#24364b">a</text><circle cx="225" cy="208" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="225" y="240" text-anchor="middle" font-size="22" fill="#24364b">b</text><circle cx="145" cy="95" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="145" y="75" text-anchor="middle" font-size="22" fill="#24364b">c</text><text x="96" y="146" text-anchor="middle" font-size="18" fill="#24364b">1</text><text x="192" y="146" text-anchor="middle" font-size="18" fill="#24364b">1</text><text x="145" y="197" text-anchor="middle" font-size="18" fill="#24364b">1</text><text x="145" y="290" text-anchor="middle" font-size="23" fill="#2563a6">R<tspan baseline-shift="sub" font-size="16.099999999999998">ab</tspan> = 2/3</text><path d="M355 208 L515 208" fill="none" stroke="#d7dee6" stroke-width="3"/><path d="M355 208 L435 95" fill="none" stroke="#d7dee6" stroke-width="3"/><path d="M435 95 L515 208" fill="none" stroke="#d7dee6" stroke-width="3"/><path d="M318 208 L550 208" fill="none" stroke="#2563a6" stroke-width="3" stroke-dasharray="7 6"/><circle cx="355" cy="208" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="355" y="240" text-anchor="middle" font-size="22" fill="#24364b">a</text><circle cx="515" cy="208" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="515" y="240" text-anchor="middle" font-size="22" fill="#24364b">b</text><circle cx="435" cy="95" r="7" fill="#fff" stroke="#d7dee6" stroke-width="2.5"/><text x="435" y="75" text-anchor="middle" font-size="22" fill="#d7dee6">c</text><text x="435" y="290" text-anchor="middle" font-size="23" fill="#2563a6">R<tspan baseline-shift="sub" font-size="16.099999999999998">ab</tspan> = 2/3</text><path d="M645 208 L805 208" fill="none" stroke="#50657b" stroke-width="3"/><circle cx="645" cy="208" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="645" y="240" text-anchor="middle" font-size="22" fill="#24364b">a</text><circle cx="805" cy="208" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="805" y="240" text-anchor="middle" font-size="22" fill="#24364b">b</text><text x="725" y="191" text-anchor="middle" font-size="19" fill="#24364b">1</text><text x="725" y="290" text-anchor="middle" font-size="23" fill="#2563a6">R<tspan baseline-shift="sub" font-size="16.099999999999998">ab</tspan> = 1</text><path d="M935 208 L1095 208" fill="none" stroke="#50657b" stroke-width="3"/><circle cx="935" cy="208" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="935" y="240" text-anchor="middle" font-size="22" fill="#24364b">a</text><circle cx="1095" cy="208" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="1095" y="240" text-anchor="middle" font-size="22" fill="#24364b">o</text><text x="1015" y="191" text-anchor="middle" font-size="19" fill="#24364b">2</text><text x="1015" y="290" text-anchor="middle" font-size="23" fill="#2563a6">R<tspan baseline-shift="sub" font-size="16.099999999999998">ao</tspan> = 1/2</text></g></svg>