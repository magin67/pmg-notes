<svg xmlns="http://www.w3.org/2000/svg" width="920" height="468" viewBox="0 0 920 468" role="img" aria-labelledby="title desc">
<title id="title">Сочленение двух отрезков и сложение масс</title><desc id="desc">Независимые единичные связи сочленены в вершине o. Справа точная резистивная реализация: oa и ob перпендикулярны, имеют единичную длину; h1 и h2 их середины, h центр окружности через o,a,b. Масса равна 1/2.</desc>
<rect width="100%" height="100%" fill="white" rx="12"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="178" y="28" text-anchor="middle" font-size="22" fill="#24364b">Две независимые связи</text><text x="692" y="28" text-anchor="middle" font-size="22" fill="#24364b">Общее резистивное пространство</text><path d="M60 170 L285 170" fill="none" stroke="#2563a6" stroke-width="3"/><circle cx="60" cy="170" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="60" y="202" text-anchor="middle" font-size="22" fill="#24364b">a</text><circle cx="285" cy="170" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="285" y="202" text-anchor="middle" font-size="22" fill="#24364b">o₁</text><text x="175" y="153" text-anchor="middle" font-size="20" fill="#24364b">1</text><path d="M60 290 L285 290" fill="none" stroke="#b85a46" stroke-width="3"/><circle cx="60" cy="290" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="60" y="322" text-anchor="middle" font-size="22" fill="#24364b">o₂</text><circle cx="285" cy="290" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="285" y="322" text-anchor="middle" font-size="22" fill="#24364b">b</text><text x="175" y="274" text-anchor="middle" font-size="20" fill="#24364b">1</text><text x="176" y="365" text-anchor="middle" font-size="23" fill="#24364b">ρ₁ = ρ₂ = 1/4</text><text x="380" y="226" text-anchor="middle" font-size="21" fill="#24364b">o₁ = o₂</text><path d="M330 247 L430 247" fill="none" stroke="#64748b" stroke-width="2"/><path d="M420 240 L432 247 L420 254" fill="none" stroke="#64748b" stroke-width="2"/><circle cx="660" cy="220" r="183.84776310850236" fill="#f7f9fc" stroke="#a4b1c0" stroke-width="2"/><path d="M530 350 L790 350" fill="none" stroke="#2563a6" stroke-width="3.5"/><path d="M530 350 L530 90" fill="none" stroke="#b85a46" stroke-width="3.5"/><path d="M660 350 L660 220" fill="none" stroke="#b85a46" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M530 220 L660 220" fill="none" stroke="#2563a6" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M530 350 L660 220" fill="none" stroke="#596a7b" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M530 330 H550 V350" fill="none" stroke="#596a7b" stroke-width="1.5"/><circle cx="530" cy="350" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="512" y="378" text-anchor="middle" font-size="22" fill="#24364b">o</text><circle cx="790" cy="350" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="812" y="365" text-anchor="middle" font-size="22" fill="#24364b">a</text><circle cx="530" cy="90" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="507" y="95" text-anchor="middle" font-size="22" fill="#24364b">b</text><circle cx="660" cy="350" r="7" fill="#fff" stroke="#2563a6" stroke-width="2.5"/><text x="660" y="380" text-anchor="middle" font-size="22" fill="#2563a6">h₁</text><circle cx="530" cy="220" r="7" fill="#fff" stroke="#b85a46" stroke-width="2.5"/><text x="500" y="225" text-anchor="middle" font-size="22" fill="#b85a46">h₂</text><circle cx="660" cy="220" r="7" fill="#fff" stroke="#24364b" stroke-width="2.5"/><text x="678" y="207" text-anchor="middle" font-size="22" fill="#24364b">h</text><text x="747" y="379" text-anchor="middle" font-size="18" fill="#2563a6">1</text><text x="505" y="150" text-anchor="middle" font-size="18" fill="#b85a46">1</text><text x="665" y="440" text-anchor="middle" font-size="23" fill="#24364b">ρ = 1/4 + 1/4 = 1/2</text></g></svg>