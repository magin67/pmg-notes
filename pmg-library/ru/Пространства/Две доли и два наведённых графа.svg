<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="468" viewBox="0 0 1110 468" role="img" aria-labelledby="title desc">
<title id="title">Две доли и два наведённых графа</title>
<desc id="desc">Сверху путь b-x-a-y со связями величин 2,1,1. Вершины a,b принадлежат доле сотрудников, x,y доле документов. После исключения x,y связь ab равна 2/3. После исключения a,b связь xy равна 1/2. Резистивные радиусы двух полученных графов равны 3/8 и 1/2 соответственно; общий остовной параметр J(G) равен 2/3. Схематическое положение вершин.</desc>
<rect width="100%" height="100%" rx="12" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="555" y="38" text-anchor="middle" font-size="24" fill="#24364b">Один исходный двудольный граф</text><path d="M135,120 L415,120" stroke="#60758b" stroke-width="3" fill="none"/><text x="275.0" y="100" text-anchor="middle" font-size="23" fill="#24364b">2</text><path d="M415,120 L695,120" stroke="#60758b" stroke-width="3" fill="none"/><text x="555.0" y="100" text-anchor="middle" font-size="23" fill="#24364b">1</text><path d="M695,120 L975,120" stroke="#60758b" stroke-width="3" fill="none"/><text x="835.0" y="100" text-anchor="middle" font-size="23" fill="#24364b">1</text><circle cx="135" cy="120" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="135" y="127" text-anchor="middle" font-size="22" fill="#2563a6">b</text><circle cx="415" cy="120" r="22" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="415" y="127" text-anchor="middle" font-size="22" fill="#ad4937">x</text><circle cx="695" cy="120" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="695" y="127" text-anchor="middle" font-size="22" fill="#2563a6">a</text><circle cx="975" cy="120" r="22" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="975" y="127" text-anchor="middle" font-size="22" fill="#ad4937">y</text><text x="280" y="235" text-anchor="middle" font-size="21" fill="#24364b">Исключим документы x, y</text><text x="830" y="235" text-anchor="middle" font-size="21" fill="#24364b">Исключим сотрудников a, b</text><path d="M390,170 L280,193" stroke="#60758b" stroke-width="3" fill="none"/><path d="M289.33449885071747,183.89686146398097 L280,193 L292.1998073635211,197.60051087304188" stroke="#60758b" stroke-width="3" fill="none"/><path d="M720,170 L830,193" stroke="#60758b" stroke-width="3" fill="none"/><path d="M817.8001926364789,197.60051087304188 L830,193 L820.6655011492826,183.89686146398097" stroke="#60758b" stroke-width="3" fill="none"/><path d="M125,315 L435,315" stroke="#2563a6" stroke-width="3" fill="none"/><text x="280" y="296" text-anchor="middle" font-size="24" fill="#2563a6">2/3</text><circle cx="125" cy="315" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="125" y="322" text-anchor="middle" font-size="22" fill="#2563a6">a</text><circle cx="435" cy="315" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="435" y="322" text-anchor="middle" font-size="22" fill="#2563a6">b</text><path d="M675,315 L985,315" stroke="#ad4937" stroke-width="3" fill="none"/><text x="830" y="296" text-anchor="middle" font-size="24" fill="#ad4937">1/2</text><circle cx="675" cy="315" r="22" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="675" y="322" text-anchor="middle" font-size="22" fill="#ad4937">x</text><circle cx="985" cy="315" r="22" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="985" y="322" text-anchor="middle" font-size="22" fill="#ad4937">y</text><text x="280" y="370" text-anchor="middle" font-size="21" fill="#24364b">R<tspan baseline-shift="sub" font-size="70%">ab</tspan> = 3/2;  ρ = 3/8</text><text x="830" y="370" text-anchor="middle" font-size="21" fill="#24364b">R<tspan baseline-shift="sub" font-size="70%">xy</tspan> = 2;  ρ = 1/2</text><text x="555" y="433" text-anchor="middle" font-size="22" fill="#24364b">Общий параметр исходного графа: J(G) = 2/3</text></g>
</svg>
