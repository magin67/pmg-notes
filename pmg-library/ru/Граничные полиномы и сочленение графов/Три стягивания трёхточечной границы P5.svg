<circle cx="120.0" cy="151" r="13" fill="white" stroke="#b97716" stroke-width="2.6"/>
<circle cx="120.0" cy="151" r="7" fill="white" stroke="#203444" stroke-width="2"/>
<text x="120.0" y="131" font-size="18" fill="#203444" text-anchor="middle" font-weight="400">a</text>
<circle cx="300.0" cy="151" r="7" fill="white" stroke="#203444" stroke-width="2"/>
<text x="300.0" y="131" font-size="18" fill="#203444" text-anchor="middle" font-weight="400">b</text>
<circle cx="480.0" cy="151" r="13" fill="white" stroke="#b97716" stroke-width="2.6"/>
<circle cx="480.0" cy="151" r="7" fill="white" stroke="#203444" stroke-width="2"/>
<text x="480.0" y="131" font-size="18" fill="#203444" text-anchor="middle" font-weight="400">c</text>
<circle cx="660.0" cy="151" r="7" fill="white" stroke="#203444" stroke-width="2"/>
<text x="660.0" y="131" font-size="18" fill="#203444" text-anchor="middle" font-weight="400">d</text>
<circle cx="840.0" cy="151" r="13" fill="white" stroke="#b97716" stroke-width="2.6"/>
<circle cx="840.0" cy="151" r="7" fill="white" stroke="#203444" stroke-width="2"/>
<text x="840.0" y="131" font-size="18" fill="#203444" text-anchor="middle" font-weight="400">e</text>
<rect x="24" y="210" width="288" height="348" rx="12" fill="#f3f6f9"/>
<rect x="336" y="210" width="288" height="348" rx="12" fill="#f3f6f9"/>
<rect x="648" y="210" width="288" height="348" rx="12" fill="#f3f6f9"/>
<text x="168" y="250" font-size="24" fill="#203444" text-anchor="middle" font-weight="700">a = c</text>
<text x="480" y="250" font-size="24" fill="#203444" text-anchor="middle" font-weight="700">a = e</text>
<text x="792" y="250" font-size="24" fill="#203444" text-anchor="middle" font-weight="700">a = c = e</text>
<line x1="68" y1="374" x2="135" y2="374" stroke="#167f77" stroke-width="4" stroke-linecap="round"/>
<line x1="135" y1="374" x2="202" y2="374" stroke="#167f77" stroke-width="4" stroke-linecap="round"/>
