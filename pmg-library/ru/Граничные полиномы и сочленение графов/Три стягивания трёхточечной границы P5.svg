<svg xmlns="http://www.w3.org/2000/svg" width="960" height="645" viewBox="0 0 960 645" role="img" aria-labelledby="title desc">
<title id="title">Три стягивания границы пути P₅</title>
<desc id="desc">Путь a-b-c-d-e имеет границу a,c,e и единичные веса. После a=c получаются связь h-b веса 2 и путь h-d-e; после a=e получается цикл C4; после a=c=e получаются связи h-b и h-d веса 2. Полиномы соответственно (1+2t)(1+t)^2, (1+t)^4-t^4 и (1+2t)^2.</desc>
<rect width="960" height="645" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="28" y="40" font-size="27" fill="#203444" text-anchor="start" font-weight="700">Три стягивания границы пути P₅</text>
<text x="28" y="73" font-size="17" fill="#566b7b" text-anchor="start" font-weight="400">B = {a, c, e}; исходные проводимости равны 1. Граничные вершины отмечены золотом.</text>
<line x1="120.0" y1="151" x2="300.0" y2="151" stroke="#167f77" stroke-width="3.5" stroke-linecap="round"/>
<line x1="300.0" y1="151" x2="480.0" y2="151" stroke="#167f77" stroke-width="3.5" stroke-linecap="round"/>
