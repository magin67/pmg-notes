<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="495" viewBox="0 0 1080 495" role="img" aria-labelledby="title desc"><title id="title">Одинаковые K и V резистенсов - разные радиусы</title><desc id="desc">Два полных графа на четырёх вершинах с положительными проводимостями. Их K- и V-компоненты резистенсов совпадают. Индекс Кирхгофа равен 12, диагональ Грина равна (7,5,5,7)/8. Радиусы равны 49/64 и 37/48; би-координаты центров различаются. Числа на рёбрах обозначают проводимости.</desc><rect width="1080" height="495" fill="#f4f7fa"/><text x="20" y="32" font-family="Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#243b53">Одинаковые K и V резистенсов, разные радиусы</text><g transform="translate(20,57)"><rect width="510" height="388" rx="12" fill="white" stroke="#cbd5e1"/><text x="255" y="33" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#243b53">Граф 0: R<tspan baseline-shift="sub" font-size="75%">P</tspan> = 0</text><path d="M 129.00 118.00 L 371.00 118.00" stroke="#64859e" stroke-width="2.5" fill="none"/><path d="M 126.57 127.29 L 373.43 265.71" stroke="#64859e" stroke-width="2.5" fill="none"/><path d="M 110.00 137.00 L 110.00 256.00" stroke="#64859e" stroke-width="2.5" fill="none"/><path d="M 390.00 137.00 L 390.00 256.00" stroke="#64859e" stroke-width="2.5" fill="none"/><path d="M 373.43 127.29 L 126.57 265.71" stroke="#64859e" stroke-width="2.5" fill="none"/><path d="M 371.00 275.00 L 129.00 275.00" stroke="#64859e" stroke-width="2.5" fill="none"/><circle cx="110" cy="118" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="110" y="124" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">a</text><circle cx="390" cy="118" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="390" y="124" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">b</text><circle cx="390" cy="275" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="390" y="281" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">c</text><circle cx="110" cy="275" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="110" y="281" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">d</text><rect x="230.0" y="80" width="40" height="28" rx="4" fill="white"/><text x="250" y="101" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">1/4</text><rect x="185.0" y="151" width="40" height="28" rx="4" fill="white"/><text x="205" y="172" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">1/4</text><rect x="51.0" y="182" width="48" height="28" rx="4" fill="white"/><text x="75" y="203" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">3/20</text><rect x="401.0" y="182" width="48" height="28" rx="4" fill="white"/><text x="425" y="203" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">5/12</text><rect x="275.0" y="151" width="40" height="28" rx="4" fill="white"/><text x="295" y="172" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">1/4</text><rect x="230.0" y="284" width="40" height="28" rx="4" fill="white"/><text x="250" y="305" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">1/4</text><text x="255" y="342" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#243b53">ρ = 49/64; τ = 4/15</text><text x="255" y="371" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#243b53">α = (5, 3, 3, 5) / 16</text></g><g transform="translate(550,57)"><rect width="510" height="388"