<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">Баланс лесных коэффициентов P-компоненты</title><desc id="desc">К паросочетанию ab, cd добавляется ребро из свободной вершины. Если второй конец свободен, получается три независимых ребра. Если второй конец занят, получается трёхвершинная компонента и отдельное ребро. При суммировании первый тип учитывается шесть раз, второй дважды. Сумма равна нулю по нулевым строковым суммам P.</desc><rect width="1080" height="500" fill="#f4f7fa"/><text x="25" y="35" font-family="Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#243b53">Баланс третьего грейда P-топонома</text><g transform="translate(20,60)"><rect width="510" height="330" rx="12" fill="white" stroke="#cbd5e1"/><text x="255" y="32" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#243b53">Соединение двух свободных вершин</text><path d="M92.00,100.00 L163.00,100.00" stroke="#27678e" stroke-width="4" fill="none"/><path d="M327.00,100.00 L398.00,100.00" stroke="#27678e" stroke-width="4" fill="none"/><path d="M187.00,205.00 L303.00,205.00" stroke="#ad531f" stroke-width="4" fill="none"/><circle cx="75" cy="100" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="75" y="106" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">a</text><circle cx="180" cy="100" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="180" y="106" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">b</text><circle cx="310" cy="100" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="310" y="106" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">c</text><circle cx="415" cy="100" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="415" y="106" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">d</text><circle cx="170" cy="205" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="170" y="211" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">e</text><circle cx="320" cy="205" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="320" y="211" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">f</text><text x="255" y="269" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#243b53">Тип (1, 1, 1)</text><text x="255" y="304" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#243b53">Кратность 2 × 3 = 6</text></g><g transform="translate(550,60)"><rect width="510" height="330" rx="12" fill="white" stroke="#cbd5e1"/><text x="255" y="32" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#243b53">Присоединение свободной вершины</text><path d="M92.00,100.00 L163.00,100.00" stroke="#27678e" stroke-width="4" fill="none"/><path d="M327.00,100.00 L398.00,100.00" stroke="#27678e" stroke-width="4" fill="none"/><path d="M399.37,106.70 L185.63,198.30" stroke="#ad531f" stroke-width="4" fill="none"/><circle cx="75" cy="100" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="75" y="106" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">a</text><circle cx="180" cy="100" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="180" y="106" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">b</text><circle cx="310" cy="100" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="310" y="106" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">c</text><circle cx="415" cy="100" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="415" y="106" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">d</text><circle cx="170" cy="205" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="170" y="211" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">e</text><circle cx="320" cy="205" r="17" fill="white" stroke="#476581" stroke-width="2"/><text x="320" y="211" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">f</text><text x="255" y="269" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#243b53">Тип (2, 1)</text><text x="255" y="304" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#243b53">Кратность 2</text></g><path d="M80,421 L125,421" stroke="#27678e" stroke-width="4"/><text x="140" y="427" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#243b53">Исходное паросочетание</text><path d="M615,421 L660,421" stroke="#ad531f" stroke-width="4"/><text x="675" y="427" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" fill="#243b53">Добавляемое ребро</text><text x="540" y="476" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#243b53">6 A₁₁₁ + 2 A₂₁ = 0; следовательно, A₂₁ = −3 A₁₁₁</text></svg>