<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="title desc">
<title id="title">Призма с ограничениями на связи</title>
<desc id="desc">Внешние вершины 1, 2, 3 образуют фиксированную единичную грань P. Внутренний треугольник 4, 5, 6 и три соединяющих ребра разрешено менять. Слева все проводимости равны 1. Справа проводимости 14, 25 и 36 равны 7, связь 45 нулевая, связи 46 и 56 равны 7/20. Резистенс 12 стал равен 3/5, резистенсы 13 и 23 сохранились равными 8/15.</desc>
