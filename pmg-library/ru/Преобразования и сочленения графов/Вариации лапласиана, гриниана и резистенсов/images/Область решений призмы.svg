<text xml:space="preserve" x="560" y="534" font-size="22" fill="#647481" style="fill:#647481" font-weight="400" text-anchor="middle">Масштаб увеличен; точка 9/8 лежит внутри интервала</text>
<text xml:space="preserve" x="560" y="620" font-size="24" fill="#b56414" style="fill:#b56414" font-weight="600" text-anchor="middle">Если все переменные c &gt; 0, нижний конец тоже исключён</text>
