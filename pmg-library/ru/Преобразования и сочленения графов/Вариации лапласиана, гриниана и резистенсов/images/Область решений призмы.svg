<circle cx="620.0911887803013" cy="235" r="8" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="850" y="187" font-size="24" fill="#b33e39" style="fill:#b33e39" font-weight="400" text-anchor="middle">недопустимо</text>
<text xml:space="preserve" x="390" y="176" font-size="23" fill="#24628a" style="fill:#24628a" font-weight="400" text-anchor="middle">неотрицательные c</text>
