<text xml:space="preserve" x="380.5" y="101.21" font-size="18" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">max</text>
<text xml:space="preserve" x="414.5" y="95" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> = (31 − √481)/8 ≈ 1.133536</text>
