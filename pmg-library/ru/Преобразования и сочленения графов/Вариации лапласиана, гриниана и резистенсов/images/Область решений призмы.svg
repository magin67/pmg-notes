<line x1="659.9999999999984" y1="437" x2="659.9999999999984" y2="455" stroke="#647481" stroke-width="2"/>
<text xml:space="preserve" x="605.4999999999984" y="491" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">9/8 = 1.125</text>
