<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Две изменяемые связи треугольника</title>
  <desc id="desc">Слева все проводимости равны единице, остовной коэффициент равен 3. Справа связи 12 и 13 усилены до 2, связь 23 сохраняется, остовной коэффициент равен 8.</desc>
  <rect width="900" height="350" rx="18" fill="#f6f8fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#243348">
    <text x="220" y="36" font-size="23">Исходный граф</text>
    <text x="680" y="36" font-size="23">Две связи усилены</text>
    <g stroke-linecap="round">
      <path d="M110 245 L330 245" stroke="#c36a16" stroke-width="5"/>
      <path d="M110 245 L220 90" stroke="#2876ae" stroke-width="5"/>
      <path d="M220 90 L330 245" stroke="#657184" stroke-width="5"/>
      <path d="M570 245 L790 245" stroke="#c36a16" stroke-width="9"/>
      <path d="M570 245 L680 90" stroke="#2876ae" stroke-width="9"/>
      <path d="M680 90 L790 245" stroke="#657184" stroke-width="5"/>
      <path d="M411 175 L485 175 M472 162 L485 175 L472 188" stroke="#8592a3" stroke-width="3" fill="none"/>
    </g>
    <g font-size="27" font-weight="bold">
      <text x="220" y="230" fill="#a55209">1</text>
      <text x="145" y="162" fill="#20628f">1</text>
      <text x="297" y="162" fill="#526071">1</text>
      <text x="680" y="230" fill="#a55209">2</text>
      <text x="605" y="162" fill="#20628f">2</text>
      <text x="757" y="162" fill="#526071">1</text>
    </g>
    <g stroke="#34445a" stroke-width="2.5" fill="white">
      <circle cx="110" cy="245" r="21"/><circle cx="330" cy="245" r="21"/><circle cx="220" cy="90" r="21"/>
      <circle cx="570" cy="245" r="21"/><circle cx="790" cy="245" r="21"/><circle cx="680" cy="90" r="21"/>
    </g>
    <g font-size="23" dominant-baseline="central">
      <text x="110" y="245">1</text><text x="330" y="245">2</text><text x="220" y="90">3</text>
      <text x="570" y="245">1</text><text x="790" y="245">2</text><text x="680" y="90">3</text>
    </g>
    <g font-size="23">
      <text x="220" y="317">τ = 3</text><text x="680" y="317">τ′ = 8</text>
    </g>
  </g>
</svg>
