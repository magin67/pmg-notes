<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="665" viewBox="0 0 1120 665" role="img" aria-labelledby="title"><title id="title">Удаление связи и удаление моста</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="665" fill="white"/>
<text xml:space="preserve" x="560" y="44" font-size="29" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Удаление ребра: два разных исхода</text>
<text xml:space="preserve" x="265" y="100" font-size="25" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Треугольник: удаляем 12</text>
<line x1="155" y1="285" x2="375" y2="285" stroke="#a7b3bb" stroke-width="2" stroke-dasharray="7 6"/>
<text xml:space="preserve" x="265.0" y="320.0" font-size="22" fill="#24628a" style="fill:#24628a" font-weight="400" text-anchor="middle">0</text>
<line x1="166.73860948670617" y1="270.05995156237395" x2="253.26139051329383" y2="159.94004843762602" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="176.0" y="211.0" font-size="22" fill="#24628a" style="fill:#24628a" font-weight="400" text-anchor="middle">1</text>
<line x1="363.26139051329386" y1="270.05995156237395" x2="276.73860948670614" y2="159.94004843762602" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="354.0" y="211.0" font-size="22" fill="#24628a" style="fill:#24628a" font-weight="400" text-anchor="middle">1</text>
<circle cx="155" cy="285" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="155" y="292" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1</text>
<circle cx="375" cy="285" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="375" y="292" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">2</text>
<circle cx="265" cy="145" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="265" y="152" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">3</text>
<text xml:space="preserve" x="265" y="375" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">τ′ = 1</text>
<text xml:space="preserve" x="222.0" y="420" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">R′</text>
<text xml:space="preserve" x="245.0" y="425.5" font-size="18" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">12</text>
<text xml:space="preserve" x="265.0" y="420" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> = 2</text>
<text xml:space="preserve" x="265" y="465" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Граф остаётся связным</text>
<text xml:space="preserve" x="825" y="100" font-size="25" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Путь: удаляем 23</text>
<line x1="700" y1="240" x2="805" y2="240" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="752.5" y="218" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1</text>
<line x1="845" y1="240" x2="950" y2="240" stroke="#a7b3bb" stroke-width="3" stroke-dasharray="7 6"/>
<text xml:space="preserve" x="897.5" y="218" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">0</text>
<circle cx="680" cy="240" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="680" y="247" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1</text>
<circle cx="825" cy="240" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="825" y="247" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">2</text>
<circle cx="970" cy="240" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="970" y="247" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">3</text>
<text xml:space="preserve" x="825" y="375" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">τ′ = 0</text>
<text xml:space="preserve" x="735.5078125" y="420" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">R′</text>
<text xml:space="preserve" x="758.5078125" y="425.5" font-size="18" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">13</text>
<text xml:space="preserve" x="778.5078125" y="420" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> не конечен</text>
<text xml:space="preserve" x="825" y="465" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Вершина 3 отделена</text>
<line x1="550" y1="95" x2="550" y2="510" stroke="#a7b3bb" stroke-width="1"/>
<line x1="260" y1="570" x2="330" y2="570" stroke="#a7b3bb" stroke-width="3" stroke-dasharray="7 6"/>
<text xml:space="preserve" x="640" y="577" font-size="22" fill="#647481" style="fill:#647481" font-weight="400" text-anchor="middle">Удалённая связь; исходные проводимости равны 1</text>
<text xml:space="preserve" x="560" y="632" font-size="26" fill="#b56414" style="fill:#b56414" font-weight="600" text-anchor="middle">Нормировка на τ′ допустима только при τ′ ≠ 0</text>
</svg>
