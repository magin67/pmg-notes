<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title"><title id="title">Все пары и существующие рёбра</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="620" fill="white"/>
<text xml:space="preserve" x="560" y="45" font-size="29" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Парные координаты и существующие рёбра</text>
<line x1="140" y1="210" x2="300" y2="210" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="220.0" y="188" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1</text>
<line x1="340" y1="210" x2="500" y2="210" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="420.0" y="188" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1</text>
<circle cx="120" cy="210" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="120" y="217" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1</text>
<circle cx="320" cy="210" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="320" y="217" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">2</text>
<circle cx="520" cy="210" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="520" y="217" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">3</text>
<path d="M120 240 Q320 430 520 240" fill="none" stroke="#b56414" stroke-width="3"/>
<text xml:space="preserve" x="227.5" y="375" font-size="25" fill="#b56414" style="fill:#b56414" font-weight="400" text-anchor="start">R</text>
<text xml:space="preserve" x="245.5" y="380.5" font-size="18" fill="#b56414" style="fill:#b56414" font-weight="400" text-anchor="start">13</text>
<text xml:space="preserve" x="265.5" y="375" font-size="25" fill="#b56414" style="fill:#b56414" font-weight="400" text-anchor="start"> = 2;   c</text>
<text xml:space="preserve" x="349.5" y="380.5" font-size="18" fill="#b56414" style="fill:#b56414" font-weight="400" text-anchor="start">13</text>
<text xml:space="preserve" x="369.5" y="375" font-size="25" fill="#b56414" style="fill:#b56414" font-weight="400" text-anchor="start"> = 0</text>
<rect x="650" y="110" width="420" height="150" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="860" y="155" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Все пары: 12, 13, 23</text>
<text xml:space="preserve" x="860" y="210" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Полные матрицы 3 × 3</text>
<rect x="650" y="310" width="420" height="150" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="860" y="355" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Рёбра пути: 12, 23</text>
<text xml:space="preserve" x="860" y="410" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Подматрицы 2 × 2</text>
<text xml:space="preserve" x="560" y="514" font-size="23" fill="#647481" style="fill:#647481" font-weight="400" text-anchor="middle">Дуга 13 обозначает измеряемый резистенс, а не ребро</text>
<text xml:space="preserve" x="326.5078125" y="570" font-size="26" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start">При сохранении пути: R</text>
<text xml:space="preserve" x="637.4921875" y="575.72" font-size="18" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start">13</text>
<text xml:space="preserve" x="657.4921875" y="570" font-size="26" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start"> = R</text>
<text xml:space="preserve" x="705.4921875" y="575.72" font-size="18" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start">12</text>
<text xml:space="preserve" x="725.4921875" y="570" font-size="26" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start"> + R</text>
<text xml:space="preserve" x="773.4921875" y="575.72" font-size="18" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="start">23</text>
</svg>
