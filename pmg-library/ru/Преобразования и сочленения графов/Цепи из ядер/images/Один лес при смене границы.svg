<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
<title id="title">Один лес при смене границы</title><desc id="desc">В лесу квадрата выбрано только ребро ab. После снятия отметок a и b эта компонента остаётся внутренней; выходные вершины c и d разделены.</desc>
<rect width="1120" height="450" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="25" y="20" width="465" height="360" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="49.00" y="59.00" font-size="24" fill="#172b43" text-anchor="start" font-weight="bold">До снятия отметок</text>
<line x1="140.00" y1="130.00" x2="365.00" y2="130.00" stroke="#cad7e5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
<line x1="140.00" y1="260.00" x2="365.00" y2="260.00" stroke="#cad7e5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
<line x1="365.00" y1="130.00" x2="365.00" y2="260.00" stroke="#cad7e5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
<line x1="140.00" y1="130.00" x2="140.00" y2="260.00" stroke="#138570" stroke-width="6" stroke-linecap="round"/>
<circle cx="140.00" cy="130.00" r="11" fill="white" stroke="#196bb9" stroke-width="3"/>
<circle cx="140.00" cy="130.00" r="4" fill="#138570" stroke="none" stroke-width="2"/>
<text x="116.00" y="137.00" font-size="22" fill="#172b43" text-anchor="start" font-weight="normal">a</text>
<circle cx="140.00" cy="260.00" r="11" fill="white" stroke="#196bb9" stroke-width="3"/>
<circle cx="140.00" cy="260.00" r="4" fill="#138570" stroke="none" stroke-width="2"/>
<text x="116.00" y="267.00" font-size="22" fill="#172b43" text-anchor="start" font-weight="normal">b</text>
<circle cx="365.00" cy="130.00" r="11" fill="white" stroke="#196bb9" stroke-width="3"/>
<circle cx="365.00" cy="130.00" r="4" fill="#172b43" stroke="none" stroke-width="2"/>
<text x="385.00" y="137.00" font-size="22" fill="#172b43" text-anchor="start" font-weight="normal">c</text>
<circle cx="365.00" cy="260.00" r="11" fill="white" stroke="#196bb9" stroke-width="3"/>
<circle cx="365.00" cy="260.00" r="4" fill="#172b43" stroke="none" stroke-width="2"/>
<text x="385.00" y="267.00" font-size="22" fill="#172b43" text-anchor="start" font-weight="normal">d</text>
<text x="257.00" y="310.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="normal">D = {a, b, c, d}</text>
<text x="257.00" y="349.00" font-size="23" fill="#172b43" text-anchor="middle" font-weight="bold">{a, b} | {c} | {d}</text>
<rect x="625" y="20" width="465" height="360" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="649.00" y="59.00" font-size="24" fill="#172b43" text-anchor="start" font-weight="bold">После снятия отметок</text>
<line x1="740.00" y1="130.00" x2="965.00" y2="130.00" stroke="#cad7e5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
<line x1="740.00" y1="260.00" x2="965.00" y2="260.00" stroke="#cad7e5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
<line x1="965.00" y1="130.00" x2="965.00" y2="260.00" stroke="#cad7e5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/>
<line x1="740.00" y1="130.00" x2="740.00" y2="260.00" stroke="#138570" stroke-width="6" stroke-linecap="round"/>
<circle cx="740.00" cy="130.00" r="4" fill="#138570" stroke="none" stroke-width="2"/>
<text x="716.00" y="137.00" font-size="22" fill="#172b43" text-anchor="start" font-weight="normal">a</text>
<circle cx="740.00" cy="260.00" r="4" fill="#138570" stroke="none" stroke-width="2"/>
<text x="716.00" y="267.00" font-size="22" fill="#172b43" text-anchor="start" font-weight="normal">b</text>
<circle cx="965.00" cy="130.00" r="11" fill="white" stroke="#196bb9" stroke-width="3"/>
<circle cx="965.00" cy="130.00" r="4" fill="#172b43" stroke="none" stroke-width="2"/>
<text x="985.00" y="137.00" font-size="22" fill="#172b43" text-anchor="start" font-weight="normal">c</text>
<circle cx="965.00" cy="260.00" r="11" fill="white" stroke="#196bb9" stroke-width="3"/>
<circle cx="965.00" cy="260.00" r="4" fill="#172b43" stroke="none" stroke-width="2"/>
<text x="985.00" y="267.00" font-size="22" fill="#172b43" text-anchor="start" font-weight="normal">d</text>
<text x="857.00" y="310.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="normal">C = {c, d}</text>
<text x="857.00" y="349.00" font-size="23" fill="#172b43" text-anchor="middle" font-weight="bold">{c} | {d}</text>
<line x1="510.00" y1="198.00" x2="605.00" y2="198.00" stroke="#196bb9" stroke-width="4" stroke-linecap="round"/>
<polygon points="605.00,198.00 593.00,193.00 593.00,203.00" fill="#196bb9"/>
<text x="560.00" y="236.00" font-size="18" fill="#172b43" text-anchor="middle" font-weight="normal">вес t</text>
<text x="560.00" y="420.00" font-size="23" fill="#172b43" text-anchor="middle" font-weight="normal">Ребро ab остаётся. Исчезают только две граничные отметки.</text>
</g></svg>
