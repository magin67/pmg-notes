<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">От размеров компонент к двум и пяти координатам</title><desc id="desc">Полное граничное состояние хранит C_s и D_r,s с неограниченными размерами. Обычная оценка даёт две координаты, корневая оценка — пять определительных комбинаций.</desc>
<rect width="1120" height="640" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="275" y="20" width="570" height="160" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="560.00" y="65.00" font-size="25" fill="#172b43" text-anchor="middle" font-weight="bold">Размеры граничных компонент</text>
<text x="560.00" y="111.00" font-size="29" fill="#16816c" text-anchor="middle" font-weight="bold">Cₛ и Dᵣ,ₛ</text>
<text x="560.00" y="150.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="normal">Закрытые компоненты: множители zₛ</text>
<line x1="405.00" y1="180.00" x2="285.00" y2="280.00" stroke="#196bb9" stroke-width="3" stroke-linecap="round"/>
<polygon points="285.00,280.00 297.42,276.16 291.02,268.48" fill="#196bb9"/>
<line x1="715.00" y1="180.00" x2="835.00" y2="280.00" stroke="#8953af" stroke-width="3" stroke-linecap="round"/>
<polygon points="835.00,280.00 828.98,268.48 822.58,276.16" fill="#8953af"/>
<text x="315.00" y="227.00" font-size="23" fill="#196bb9" text-anchor="middle" font-weight="normal">zₛ = 1</text>
<text x="805.00" y="227.00" font-size="23" fill="#8953af" text-anchor="middle" font-weight="normal">zₛ = s</text>
<rect x="20" y="290" width="520" height="255" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<rect x="570" y="290" width="530" height="255" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="280.00" y="335.00" font-size="26" fill="#196bb9" text-anchor="middle" font-weight="bold">Обычные леса</text>
<text x="835.00" y="335.00" font-size="26" fill="#8953af" text-anchor="middle" font-weight="bold">Корневые леса</text>
<text x="280.00" y="389.00" font-size="22" fill="#172b43" text-anchor="middle" font-weight="normal">Контакты соединены / разделены</text>
<text x="835.00" y="389.00" font-size="22" fill="#172b43" text-anchor="middle" font-weight="normal">Свободные и закреплённые корни</text>
<text x="280.00" y="447.00" font-size="22" fill="#172b43" text-anchor="middle" font-weight="bold">Две полиномиальные координаты</text>
<text x="835.00" y="447.00" font-size="22" fill="#172b43" text-anchor="middle" font-weight="bold">Пять комбинаций A₊, B₊, C₊, D₊, E₊</text>
<text x="280.00" y="502.00" font-size="24" fill="#196bb9" text-anchor="middle" font-weight="normal">Сумма: F(t)</text>
<text x="835.00" y="502.00" font-size="24" fill="#8953af" text-anchor="middle" font-weight="normal">A₊ = P(t) = det(I + tL)</text>
<text x="560.00" y="595.00" font-size="22" fill="#52657a" text-anchor="middle" font-weight="normal">Обе оценки теряют часть распределения лесов по размерам компонент.</text>
</g></svg>
