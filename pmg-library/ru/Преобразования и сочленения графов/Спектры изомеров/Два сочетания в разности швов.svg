<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Два сочетания в разности швов</title><desc id="desc">Префикс p даёт пятикоординатный паспорт. Матрица Q выделяет A−ξB+ξE и C−B. Правое продолжение даёт два коэффициента eta. Их скалярное произведение равно разности характеристических полиномов.</desc>
<rect width="1200" height="560" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="600.00" y="44.00" font-size="28" fill="#172b43" text-anchor="middle" font-weight="bold">Окружение фиксировано · меняется одна буква S ↔ L</text>
<rect x="25" y="115" width="300" height="198" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="175.00" y="158.00" font-size="24" fill="#172b43" text-anchor="middle" font-weight="bold">Левый фрагмент p</text>
<text x="175.00" y="218.00" font-size="24" fill="#52657a" text-anchor="middle" font-weight="normal">sₚ = M(p)s₁</text>
<text x="175.00" y="267.00" font-size="24" fill="#52657a" text-anchor="middle" font-weight="normal">Aₚ, Bₚ, Cₚ, Dₚ, Eₚ</text>
<rect x="450" y="115" width="300" height="198" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="600.00" y="158.00" font-size="24" fill="#172b43" text-anchor="middle" font-weight="bold">Два сочетания</text>
<text x="600.00" y="218.00" font-size="24" fill="#196bb9" text-anchor="middle" font-weight="normal">Aₚ − ξBₚ + ξEₚ</text>
<text x="600.00" y="267.00" font-size="24" fill="#196bb9" text-anchor="middle" font-weight="normal">Cₚ − Bₚ</text>
<rect x="875" y="115" width="300" height="198" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="1025.00" y="158.00" font-size="24" fill="#172b43" text-anchor="middle" font-weight="bold">Правый фрагмент v</text>
<text x="1025.00" y="218.00" font-size="24" fill="#52657a" text-anchor="middle" font-weight="normal">ℓᵥ = r M(v)</text>
<text x="1025.00" y="267.00" font-size="24" fill="#52657a" text-anchor="middle" font-weight="normal">(η₁, η₂) = ℓᵥ P</text>
<line x1="340.00" y1="215.00" x2="432.00" y2="215.00" stroke="#172b43" stroke-width="3" stroke-linecap="round"/>
<polygon points="432.00,215.00 420.00,210.00 420.00,220.00" fill="#172b43"/>
<text x="384.00" y="192.00" font-size="28" fill="#196bb9" text-anchor="middle" font-weight="normal">Q</text>
<line x1="858.00" y1="215.00" x2="767.00" y2="215.00" stroke="#172b43" stroke-width="3" stroke-linecap="round"/>
<polygon points="767.00,215.00 779.00,220.00 779.00,210.00" fill="#172b43"/>
<text x="812.00" y="192.00" font-size="28" fill="#196bb9" text-anchor="middle" font-weight="normal">η</text>
<line x1="600.00" y1="332.00" x2="600.00" y2="391.00" stroke="#172b43" stroke-width="3" stroke-linecap="round"/>
<polygon points="600.00,391.00 605.00,379.00 595.00,379.00" fill="#172b43"/>
<rect x="120" y="413" width="960" height="105" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="600.00" y="456.00" font-size="25" fill="#172b43" text-anchor="middle" font-weight="bold">χ(SpSv) − χ(SpLv) = η₁(Aₚ − ξBₚ + ξEₚ) + η₂(Cₚ − Bₚ)</text>
<text x="600.00" y="493.00" font-size="21" fill="#52657a" text-anchor="middle" font-weight="normal">Два сочетания достаточны для этой разности; общий паспорт сохраняет пять координат</text>
</g></svg>
