<title id="title">Исключение крайних ядер</title><desc id="desc">Четыре внутренние вершины крайнего шестиугольника исключаются. На концах шва остаётся диагональ d и внедиагональный элемент w. Два положения второго шва задают разные сокращённые матрицы.</desc>
