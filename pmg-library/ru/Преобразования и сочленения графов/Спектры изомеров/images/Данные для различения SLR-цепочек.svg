<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">Данные для различения SLR-цепочек</title><desc id="desc">Полный отмеченный граничный вектор декодируется для любой длины. Различимость по полиному и по одному значению подтверждена до 18 ядер; общие утверждения остаются гипотезами.</desc>
<rect width="1200" height="550" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="20" y="20" width="360" height="385" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="200.00" y="65.00" font-size="24" fill="#172b43" text-anchor="middle" font-weight="bold">Пять граничных чисел</text>
<text x="200.00" y="127.00" font-size="26" fill="#15815b" text-anchor="middle" font-weight="normal">z = (a, b, c, d, e)</text>
<text x="200.00" y="187.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="normal">Ориентированное слово</text>
<text x="200.00" y="219.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="normal">с выбранной границей</text>
<line x1="45.00" y1="253.00" x2="355.00" y2="253.00" stroke="#dce4ed" stroke-width="2" stroke-linecap="round"/>
<text x="200.00" y="300.00" font-size="20" fill="#15815b" text-anchor="middle" font-weight="normal">Декодирование доказано</text>
<text x="200.00" y="335.00" font-size="20" fill="#15815b" text-anchor="middle" font-weight="normal">для любой длины</text>
<rect x="420" y="20" width="360" height="385" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="600.00" y="65.00" font-size="24" fill="#172b43" text-anchor="middle" font-weight="bold">Полный полином</text>
<text x="600.00" y="127.00" font-size="26" fill="#196bb9" text-anchor="middle" font-weight="normal">χ(ξ)</text>
<text x="600.00" y="187.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="normal">Класс графа</text>
<text x="600.00" y="219.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="normal">без граничных отметок</text>
<line x1="445.00" y1="253.00" x2="755.00" y2="253.00" stroke="#dce4ed" stroke-width="2" stroke-linecap="round"/>
<text x="600.00" y="300.00" font-size="20" fill="#196bb9" text-anchor="middle" font-weight="normal">Проверено до 18 ядер</text>
<text x="600.00" y="335.00" font-size="20" fill="#196bb9" text-anchor="middle" font-weight="normal">Общий случай: гипотеза 1</text>
<rect x="820" y="20" width="360" height="385" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<text x="1000.00" y="65.00" font-size="24" fill="#172b43" text-anchor="middle" font-weight="bold">Одно значение</text>
<text x="1000.00" y="127.00" font-size="26" fill="#196bb9" text-anchor="middle" font-weight="normal">P(1) = χ(−1)</text>
<text x="1000.00" y="187.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="normal">Класс графа</text>
<text x="1000.00" y="219.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="normal">при известном N</text>
<line x1="845.00" y1="253.00" x2="1155.00" y2="253.00" stroke="#dce4ed" stroke-width="2" stroke-linecap="round"/>
<text x="1000.00" y="300.00" font-size="20" fill="#196bb9" text-anchor="middle" font-weight="normal">Проверено до 18 ядер</text>
<text x="1000.00" y="335.00" font-size="20" fill="#196bb9" text-anchor="middle" font-weight="normal">Общий случай: гипотеза 2</text>
<text x="600.00" y="453.00" font-size="23" fill="#172b43" text-anchor="middle" font-weight="bold">Отмеченное слово и неотмеченный класс графа - разные задачи</text>
<text x="600.00" y="500.00" font-size="22" fill="#52657a" text-anchor="middle" font-weight="normal">Доказательство для пяти чисел не доказывает инъективности одного числа</text>
</g></svg>
