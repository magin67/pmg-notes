<svg xmlns="http://www.w3.org/2000/svg" width="960" height="804" viewBox="0 0 960 804" role="img" aria-labelledby="title desc">
<title id="title">Пятнадцать состояний четырёхточечной границы</title>
<desc id="desc">Все разбиения a,b,c,d в фиксированном циклическом порядке. Ранги распределены как 1,6,7,1. Единственное пересекающееся разбиение ac|bd выделено розовым. Цветные области являются блоками, а не рёбрами; в точке пересечения блоков вершины нет.</desc>
