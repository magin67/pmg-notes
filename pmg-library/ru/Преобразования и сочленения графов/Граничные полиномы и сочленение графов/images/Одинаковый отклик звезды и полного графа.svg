<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">Один отклик не восстанавливает каждую рощу</title><desc id="desc">Четырёхлучевая единичная звезда и полный граф на границе с проводимостями одна четверть имеют один электрический отклик, но разные веса рощи 12|34.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#53677a"/></marker></defs>
<rect width="1100" height="720" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="40" y="45" font-size="28" fill="#20354b" text-anchor="start" font-weight="bold">Один отклик не восстанавливает каждую рощу</text>
<text x="40" y="80" font-size="18" fill="#53677a" text-anchor="start" font-weight="normal">Золотые окружности: граница B = {1, 2, 3, 4}. Пересечение линий не создаёт вершину.</text>
<rect x="40" y="105" width="480" height="405" rx="14" fill="#f7f9fb" stroke="#ccd8e2"/>
<rect x="580" y="105" width="480" height="405" rx="14" fill="#f7f9fb" stroke="#ccd8e2"/>
<text x="280" y="140" font-size="20" fill="#20354b" text-anchor="middle" font-weight="bold">Звезда: каждое ребро имеет вес 1</text>
<text x="820" y="140" font-size="20" fill="#20354b" text-anchor="middle" font-weight="bold">Эффективный K₄: каждое ребро 1/4</text>
<line x1="155" y1="200" x2="280" y2="305" stroke="#2168a6" stroke-width="5"/>
<line x1="405" y1="200" x2="280" y2="305" stroke="#2168a6" stroke-width="5"/>
<line x1="405" y1="410" x2="280" y2="305" stroke="#17826b" stroke-width="5"/>
<line x1="155" y1="410" x2="280" y2="305" stroke="#17826b" stroke-width="5"/>
<circle cx="280" cy="305" r="18" fill="white" stroke="#20354b" stroke-width="4"/>
<text x="280" y="311" font-size="18" fill="#20354b" text-anchor="middle" font-weight="bold">h</text>
<line x1="695" y1="200" x2="945" y2="200" stroke="#2168a6" stroke-width="6"/>
<line x1="695" y1="200" x2="945" y2="410" stroke="#becbd6" stroke-width="2"/>
<line x1="695" y1="200" x2="695" y2="410" stroke="#becbd6" stroke-width="2"/>
<line x1="945" y1="200" x2="945" y2="410" stroke="#becbd6" stroke-width="2"/>
<line x1="945" y1="200" x2="695" y2="410" stroke="#becbd6" stroke-width="2"/>
<line x1="945" y1="410" x2="695" y2="410" stroke="#17826b" stroke-width="6"/>
<circle cx="155" cy="200" r="18" fill="white" stroke="#d69a20" stroke-width="4"/>
<text x="155" y="206" font-size="18" fill="#20354b" text-anchor="middle" font-weight="bold">1</text>
<circle cx="405" cy="200" r="18" fill="white" stroke="#d69a20" stroke-width="4"/>
<text x="405" y="206" font-size="18" fill="#20354b" text-anchor="middle" font-weight="bold">2</text>
<circle cx="405" cy="410" r="18" fill="white" stroke="#d69a20" stroke-width="4"/>
<text x="405" y="416" font-size="18" fill="#20354b" text-anchor="middle" font-weight="bold">3</text>
<circle cx="155" cy="410" r="18" fill="white" stroke="#d69a20" stroke-width="4"/>
<text x="155" y="416" font-size="18" fill="#20354b" text-anchor="middle" font-weight="bold">4</text>
<circle cx="695" cy="200" r="18" fill="white" stroke="#d69a20" stroke-width="4"/>
<text x="695" y="206" font-size="18" fill="#20354b" text-anchor="middle" font-weight="bold">1</text>
<circle cx="945" cy="200" r="18" fill="white" stroke="#d69a20" stroke-width="4"/>
<text x="945" y="206" font-size="18" fill="#20354b" text-anchor="middle" font-weight="bold">2</text>
<circle cx="945" cy="410" r="18" fill="white" stroke="#d69a20" stroke-width="4"/>
<text x="945" y="416" font-size="18" fill="#20354b" text-anchor="middle" font-weight="bold">3</text>
<circle cx="695" cy="410" r="18" fill="white" stroke="#d69a20" stroke-width="4"/>
<text x="695" y="416" font-size="18" fill="#20354b" text-anchor="middle" font-weight="bold">4</text>
<text x="280" y="465" font-size="19" fill="#20354b" text-anchor="middle" font-weight="normal">Две пары требуют общего центра h</text>
<text x="820" y="465" font-size="19" fill="#20354b" text-anchor="middle" font-weight="normal">Выбранные рёбра 12 и 34 не связаны</text>
<text x="280" y="495" font-size="23" fill="#20354b" text-anchor="middle" font-weight="bold">g<tspan baseline-shift="sub" font-size="75%">12|34</tspan> = 0,  δ<tspan baseline-shift="sub" font-size="75%">B</tspan> = 4</text>
<text x="820" y="495" font-size="23" fill="#20354b" text-anchor="middle" font-weight="bold">g<tspan baseline-shift="sub" font-size="75%">12|34</tspan> = (1/4)² = 1/16,  δ<tspan baseline-shift="sub" font-size="75%">B</tspan> = 1</text>
<rect x="40" y="536" width="1020" height="142" rx="14" fill="#fff7e6" stroke="#ccd8e2"/>
<text x="550" y="571" font-size="24" fill="#20354b" text-anchor="middle" font-weight="bold">Одинаковый электрический отклик: Λ = I₄ − (1/4) 11ᵀ</text>
<text x="280" y="612" font-size="20" fill="#20354b" text-anchor="middle" font-weight="normal">Нормированный вес: g<tspan baseline-shift="sub" font-size="75%">12|34</tspan> / δ<tspan baseline-shift="sub" font-size="75%">B</tspan> = 0</text>
<text x="820" y="612" font-size="20" fill="#20354b" text-anchor="middle" font-weight="normal">Нормированный вес: g<tspan baseline-shift="sub" font-size="75%">12|34</tspan> / δ<tspan baseline-shift="sub" font-size="75%">B</tspan> = 1/16</text>
<text x="550" y="650" font-size="20" fill="#20354b" text-anchor="middle" font-weight="normal">K₄ планарен, но не допускает все четыре вершины на одной внешней грани.</text>
</g></svg>
