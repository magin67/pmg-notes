<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-labelledby="title desc">
<title id="title">Треугольник коэффициентов пути P6</title>
<desc id="desc">Столбцы k от 1 до 5, строки r от 1 до 3. В первой строке коэффициенты 5,4,3,2,1; во второй коэффициенты 6,6,3 в столбцах 2,3,4; в третьей коэффициент 1 в столбце 3. Единичный член и нули не показаны.</desc>
<rect width="720" height="330" fill="white"/>
<style>text{font-family:Arial,"DejaVu Sans",sans-serif;text-anchor:middle;fill:#172b4d}.heading{font-size:23px;font-weight:600}.index{font-size:18px;fill:#6b7789}.value{font-size:29px;font-weight:600}</style>
<text x="360" y="36" class="heading">Треугольник коэффициентов P₆</text>
<text x="107" y="90" class="index">r \ k</text>
<path d="M175 106 H635 M160 118 V300" fill="none" stroke="#c9d2df" stroke-width="1"/>
<text x="220" y="90" class="index">1</text>
<text x="310" y="90" class="index">2</text>
<text x="400" y="90" class="index">3</text>
<text x="490" y="90" class="index">4</text>
<text x="580" y="90" class="index">5</text>
<text x="107" y="150" class="index">1</text>
<text x="220" y="150" class="value" data-k="1" data-r="1">5</text>
<text x="310" y="150" class="value" data-k="2" data-r="1">4</text>
<text x="400" y="150" class="value" data-k="3" data-r="1">3</text>
<text x="490" y="150" class="value" data-k="4" data-r="1">2</text>
<text x="580" y="150" class="value" data-k="5" data-r="1">1</text>
<text x="107" y="215" class="index">2</text>
<text x="310" y="215" class="value" data-k="2" data-r="2">6</text>
<text x="400" y="215" class="value" data-k="3" data-r="2">6</text>
<text x="490" y="215" class="value" data-k="4" data-r="2">3</text>
<text x="107" y="280" class="index">3</text>
<text x="400" y="280" class="value" data-k="3" data-r="3">1</text>
</svg>
