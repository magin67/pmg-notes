<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
<title id="title">Области индексов коэффициентных таблиц</title>
<desc id="desc">При n=6 допустимы ряды r=1: k=1..5, r=2: k=2..4, r=3: k=3. При n=7: r=1: k=1..6, r=2: k=2..5, r=3: k=3,4. Пунктирная вещественная вершина n=7 находится в точке (3.5,3.5), над трапецией целочисленных индексов. Ячейка (0,0) для пустого типа показана отдельно.</desc>
<rect width="1080" height="460" fill="#fff"/>
<style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#172b4d}.heading{font-size:21px;font-weight:600}.small{font-size:15px;fill:#46566c}.result{font-size:24px;font-weight:600}.node{font-size:20px;font-weight:600}.classes{font-size:19px}</style>
<text x="270" y="31" text-anchor="middle" class="heading">n = 6</text>
<text x="270" y="58" text-anchor="middle" class="small">Одна верхняя точка</text>
