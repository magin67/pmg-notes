<svg xmlns="http://www.w3.org/2000/svg" width="960" height="282" viewBox="0 0 960 282" role="img" aria-labelledby="title desc">
<title id="title">Граничные типы и деревья</title>
<desc id="desc">Тип (1) изображён одним ребром, (2) деревом из двух рёбер, (1²) двумя отдельными рёбрами, (2,1) двухрёберным деревом и отдельным ребром. Изолированные вершины опущены. Части считают грейды границ, равные числу рёбер дерева.</desc>
<rect width="960" height="282" fill="#fff"/>
<style>text{font-family:Arial,"DejaVu Sans",sans-serif;fill:#172b4d}.heading{font-size:21px;font-weight:600}.small{font-size:15px;fill:#46566c}.result{font-size:24px;font-weight:600}.node{font-size:20px;font-weight:600}.classes{font-size:19px}</style>
<text x="480" y="35" text-anchor="middle" class="heading">Части разбиения как грейды границ</text>
<text x="480" y="62" text-anchor="middle" class="small">Часть (k): граница на k+1 вершинах; дерево содержит k связей</text>
