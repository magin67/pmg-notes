<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Один матроид, разная вершинная геометрия</title>
<desc id="desc">Путь P4 и звезда K1,3 с тремя именованными рёбрами. Соответствие имён сохраняет все независимые наборы, но суммы попарных резистенсов равны 10 и 9.</desc>
