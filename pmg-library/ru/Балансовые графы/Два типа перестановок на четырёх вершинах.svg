<path class="edge" d="M135.00 242.00 L135.00 135.00"/>
<circle class="node" cx="135" cy="110" r="19"/><text class="letter" x="135" y="110">a</text>
<circle class="node" cx="345" cy="110" r="19"/><text class="letter" x="345" y="110">b</text>
<circle class="node" cx="345" cy="265" r="19"/><text class="letter" x="345" y="265">c</text>
<circle class="node" cx="135" cy="265" r="19"/><text class="letter" x="135" y="265">d</text>
