<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">Остовные деревья единичного 3-орцикла</title>
<desc id="desc">Три панели. Корень a: b в c, c в a. Корень b: c в a, a в b. Корень c: a в b, b в c. Корень выделен цветом. Каждое дерево имеет вес 1.</desc>
