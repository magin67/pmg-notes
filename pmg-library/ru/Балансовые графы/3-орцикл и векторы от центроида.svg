<svg xmlns="http://www.w3.org/2000/svg" width="900" height="395" viewBox="0 0 900 395" role="img" aria-labelledby="title desc">
<title id="title">3-орцикл и векторы от центроида</title>
<desc id="desc">Слева единичные дуги a в b, b в c, c в a. Справа та же тройка точек и центроид h. Векторы x_a, x_b, x_c идут от h к a, b, c; их сумма равна нулю. Справа показаны аффинные векторы, а не дуги графа.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="900" height="395" fill="white"/>
<defs>
<marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#285f87"/></marker>
<marker id="vec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a85d22"/></marker>
</defs>
<rect x="8" y="8" width="434" height="379" rx="12" fill="#fafbfc" stroke="#d0d5dd"/>
<rect x="458" y="8" width="434" height="379" rx="12" fill="#fafbfc" stroke="#d0d5dd"/>
<text x="225" y="40" font-size="23" fill="#1d2939" font-weight="600" text-anchor="middle">Дуги графа</text>
<text x="675" y="40" font-size="23" fill="#1d2939" font-weight="600" text-anchor="middle">Векторы от центроида</text>
<line x1="238.46" y1="111.87" x2="340.98" y2="263.30" stroke="#285f87" stroke-width="3" marker-end="url(#arc)"/>
<text x="313" y="180" font-size="19" fill="#285f87" font-weight="400" text-anchor="middle">1</text>
<line x1="331.00" y1="284.00" x2="120.00" y2="284.00" stroke="#285f87" stroke-width="3" marker-end="url(#arc)"/>
<text x="225" y="315" font-size="19" fill="#285f87" font-weight="400" text-anchor="middle">1</text>
<line x1="108.46" y1="264.13" x2="210.98" y2="112.70" stroke="#285f87" stroke-width="3" marker-end="url(#arc)"/>
<text x="137" y="180" font-size="19" fill="#285f87" font-weight="400" text-anchor="middle">1</text>
<line x1="675.00" y1="201.00" x2="675.00" y2="117.00" stroke="#a85d22" stroke-width="3" marker-end="url(#vec)"/>
<text x="697" y="157" font-size="22" fill="#a85d22" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="14">a</tspan></text>
<line x1="692.05" y1="228.39" x2="782.57" y2="272.96" stroke="#a85d22" stroke-width="3" marker-end="url(#vec)"/>
<text x="743" y="231" font-size="22" fill="#a85d22" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="14">b</tspan></text>
<line x1="657.95" y1="228.39" x2="567.43" y2="272.96" stroke="#a85d22" stroke-width="3" marker-end="url(#vec)"/>
<text x="607" y="231" font-size="22" fill="#a85d22" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="14">c</tspan></text>
<circle cx="225" cy="92" r="20" fill="white" stroke="#344054" stroke-width="2"/>
<text x="225" y="99" font-size="23" fill="#1d2939" font-weight="400" text-anchor="middle">a</text>
<circle cx="355" cy="284" r="20" fill="white" stroke="#344054" stroke-width="2"/>
<text x="355" y="291" font-size="23" fill="#1d2939" font-weight="400" text-anchor="middle">b</text>
<circle cx="95" cy="284" r="20" fill="white" stroke="#344054" stroke-width="2"/>
<text x="95" y="291" font-size="23" fill="#1d2939" font-weight="400" text-anchor="middle">c</text>
<circle cx="675" cy="92" r="20" fill="white" stroke="#344054" stroke-width="2"/>
<text x="675" y="99" font-size="23" fill="#1d2939" font-weight="400" text-anchor="middle">a</text>
<circle cx="805" cy="284" r="20" fill="white" stroke="#344054" stroke-width="2"/>
<text x="805" y="291" font-size="23" fill="#1d2939" font-weight="400" text-anchor="middle">b</text>
<circle cx="545" cy="284" r="20" fill="white" stroke="#344054" stroke-width="2"/>
<text x="545" y="291" font-size="23" fill="#1d2939" font-weight="400" text-anchor="middle">c</text>
<circle cx="675" cy="220" r="16" fill="#a85d22" stroke="#a85d22" stroke-width="2"/>
<text x="675" y="227" font-size="21" fill="white" font-weight="400" text-anchor="middle">h</text>
<text x="225" y="356" font-size="22" fill="#285f87" font-weight="400" text-anchor="middle">a → b → c → a</text>
<text x="675" y="345" font-size="20" fill="#1d2939" font-weight="400" text-anchor="middle">h = (a + b + c)/3</text>
<text x="675" y="375" font-size="20" fill="#a85d22" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="13">a</tspan> + x<tspan baseline-shift="sub" font-size="13">b</tspan> + x<tspan baseline-shift="sub" font-size="13">c</tspan> = 0</text>
</svg>

