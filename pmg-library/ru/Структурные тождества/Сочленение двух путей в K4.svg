<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="980" height="310" viewBox="0 0 980 310" role="img" aria-labelledby="title desc">
  <title id="title">Сочленение двух путей в полный граф K4</title>
  <desc id="desc">Путь G1 имеет рёбра ac, bc, bd, путь G2 имеет рёбра ab, ad, cd. После отождествления одноимённых вершин их объединение содержит все шесть рёбер полного графа на четырёх вершинах. Пересечения диагоналей не являются вершинами.</desc>
  <rect width="980" height="310" rx="12" fill="#ffffff"/>
  <defs>
    <g id="blue-path" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round">
      <path d="M 80 100 L 240 260 L 240 100 L 80 260"/>
    </g>
    <g id="orange-path" fill="none" stroke="#b45309" stroke-width="4.5" stroke-dasharray="9 7" stroke-linecap="round">
      <path d="M 240 100 L 80 100 L 80 260 L 240 260"/>
    </g>
    <g id="vertices">
      <g fill="#ffffff" stroke="#334155" stroke-width="2">
        <circle cx="80" cy="100" r="19"/>
        <circle cx="240" cy="100" r="19"/>
        <circle cx="240" cy="260" r="19"/>
        <circle cx="80" cy="260" r="19"/>
      </g>
      <g fill="#0f172a" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">
        <text x="80" y="108">a</text>
        <text x="240" y="108">b</text>
        <text x="240" y="268">c</text>
        <text x="80" y="268">d</text>
      </g>
    </g>
  </defs>
  <g font-family="Arial, sans-serif" font-size="28" text-anchor="middle">
    <text x="160" y="42" fill="#2563eb">G₁</text>
    <text x="490" y="42" fill="#b45309">G₂</text>
    <text x="820" y="42" fill="#0f172a">K₄</text>
    <text x="325" y="189" fill="#64748b">∪</text>
    <text x="655" y="189" fill="#64748b">=</text>
  </g>
  <g>
    <use xlink:href="#blue-path"/>
    <use xlink:href="#vertices"/>
  </g>
  <g transform="translate(330 0)">
    <use xlink:href="#orange-path"/>
    <use xlink:href="#vertices"/>
  </g>
  <g transform="translate(660 0)">
    <use xlink:href="#blue-path"/>
    <use xlink:href="#orange-path"/>
    <use xlink:href="#vertices"/>
  </g>
</svg>
