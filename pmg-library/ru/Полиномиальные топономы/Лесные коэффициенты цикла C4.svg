<title id="title">Лесные коэффициенты цикла C4</title>
<desc id="desc">Все пятнадцать остовных лесов цикла C4. Вклады групп в векторный полином равны 1,4,4,2,4; в вершинный полином 1,8,12,8,16. Полный цикл исключён.</desc>
