<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#333"/>
    </marker>
    <style>
      .title { font: 600 22px serif; fill: #222; }
      .subtitle { font: 600 18px serif; fill: #222; }
      .small { font: 15px serif; fill: #222; }
      .label { font: italic 20px serif; fill: #111; }
      .edge { stroke: #2f4f4f; stroke-width: 3; fill: none; }
      .base { stroke: #222; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .aux { stroke: #666; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; }
      .pt { fill: #222; }
      .panel { fill: #fafafa; stroke: #d0d0d0; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="500" y="34" text-anchor="middle" class="title">Два треугольника с общей стороной</text>

  <rect x="28" y="60" width="444" height="330" rx="10" class="panel"/>
  <rect x="528" y="60" width="444" height="330" rx="10" class="panel"/>

  <text x="250" y="92" text-anchor="middle" class="subtitle">Плоский случай</text>
  <text x="750" y="92" text-anchor="middle" class="subtitle">Пространственный ортогональный случай</text>

  <line x1="110" y1="250" x2="330" y2="250" class="base"/>
  <line x1="110" y1="250" x2="195" y2="135" class="edge"/>
  <line x1="330" y1="250" x2="195" y2="135" class="edge"/>
  <line x1="110" y1="250" x2="255" y2="328" class="edge"/>
  <line x1="330" y1="250" x2="255" y2="328" class="edge"/>

  <circle cx="110" cy="250" r="4.5" class="pt"/>
  <circle cx="330" cy="250" r="4.5" class="pt"/>
  <circle cx="195" cy="135" r="4.5" class="pt"/>
  <circle cx="255" cy="328" r="4.5" class="pt"/>

  <text x="98" y="274" class="label">a</text>
  <text x="336" y="274" class="label">b</text>
  <text x="184" y="126" class="label">c</text>
  <text x="262" y="346" class="label">d</text>

  <text x="250" y="360" text-anchor="middle" class="small">c и d по разные стороны от ab</text>
  <text x="250" y="382" text-anchor="middle" class="small">поэтому ⟨(abc),(abd)⟩ &lt; 0</text>

  <line x1="610" y1="262" x2="835" y2="262" class="base"/>
  <line x1="610" y1="262" x2="690" y2="135" class="edge"/>
  <line x1="835" y1="262" x2="690" y2="135" class="edge"/>
  <line x1="610" y1="262" x2="790" y2="160" class="edge"/>
  <line x1="835" y1="262" x2="790" y2="160" class="edge"/>
  <line x1="790" y1="160" x2="790" y2="262" class="aux"/>
  <line x1="690" y1="135" x2="690" y2="262" class="aux"/>
  <path d="M722 236 L748 236 L748 210" class="aux"/>

  <circle cx="610" cy="262" r="4.5" class="pt"/>
  <circle cx="835" cy="262" r="4.5" class="pt"/>
  <circle cx="690" cy="135" r="4.5" class="pt"/>
  <circle cx="790" cy="160" r="4.5" class="pt"/>

  <text x="598" y="286" class="label">a</text>
  <text x="841" y="286" class="label">b</text>
  <text x="680" y="126" class="label">c</text>
  <text x="797" y="178" class="label">d</text>

  <text x="750" y="360" text-anchor="middle" class="small">плоскости abc и abd взаимно ортогональны</text>
  <text x="750" y="382" text-anchor="middle" class="small">поэтому ⟨(abc),(abd)⟩ = 0</text>
</svg>
