<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" role="img" aria-labelledby="title desc">
  <title id="title">Вклад каждой начальной вершины в норму границы (abc)</title>
  <desc id="desc">Слева единичный орцикл a, b, c. Возле каждой вершины стоит 1/3. Справа орцикл a, b, c, d. Вклады для начал a, b и c равны 1/4, 1/4 и 1/2. Пунктир между a и c обозначает сторону измеряемого треугольника.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <path d="M0 0 10 4 0 8 2.5 4Z" fill="#263f50"/>
    </marker>
  </defs>
  <rect width="720" height="236" rx="10" fill="#fbfaf6"/>
  <g fill="#285858" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="169" y="27">3-орцикл</text>
    <text x="528" y="27">4-орцикл</text>
  </g>
  <g fill="#e2eeea">
    <path d="M66 72H270L168 181Z"/>
    <path d="M414 72H638V181Z"/>
  </g>
  <path d="M414 72 638 181" fill="none" stroke="#7b9d97" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="none" stroke="#263f50" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M88 72H246"/><path d="M254 89 185 163"/><path d="M153 165 82 89"/>
    <path d="M436 72H614"/><path d="M638 94V157"/><path d="M616 181H438"/><path d="M414 159V96"/>
  </g>
  <g fill="#fbfaf6" stroke="#285858" stroke-width="2">
    <circle cx="66" cy="72" r="17"/><circle cx="270" cy="72" r="17"/><circle cx="168" cy="181" r="17"/>
    <circle cx="414" cy="72" r="17"/><circle cx="638" cy="72" r="17"/><circle cx="638" cy="181" r="17"/>
    <circle cx="414" cy="181" r="17" stroke="#66717c"/>
  </g>
  <g text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#213844">
    <text x="66" y="79">a</text><text x="270" y="79">b</text><text x="168" y="188">c</text>
    <text x="414" y="79">a</text><text x="638" y="79">b</text><text x="638" y="188">c</text><text x="414" y="188">d</text>
  </g>
  <g text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#225f58">
    <text x="32" y="79">1/3</text><text x="305" y="79">1/3</text><text x="168" y="221">1/3</text>
    <text x="379" y="79">1/4</text><text x="674" y="79">1/4</text><text x="674" y="188">1/2</text>
  </g>
</svg>
