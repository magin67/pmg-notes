<text x="90.00" y="247.00" font-size="21" fill="#bc294b" text-anchor="middle" font-weight="normal">u</text>
<circle cx="260.00" cy="340.00" r="7" fill="white" stroke="#bc294b" stroke-width="3"/>
<text x="260.00" y="325.00" font-size="21" fill="#bc294b" text-anchor="middle" font-weight="normal">b</text>
