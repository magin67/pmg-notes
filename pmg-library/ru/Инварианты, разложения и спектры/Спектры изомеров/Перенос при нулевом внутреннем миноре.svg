<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="440" viewBox="0 0 1180 440" role="img" aria-labelledby="title desc">
<title id="title">Перенос при нулевом внутреннем миноре</title><desc id="desc">Путь a-u-b соединяется с путём a-c-d-b в цикл C5. Вход a,b не является ребром. При xi=2 старый внутренний минор нулевой, но оба полиномиальных паспорта определены.</desc>
