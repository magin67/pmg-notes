<text x="185.00" y="297.00" font-size="23" fill="#196bb9" text-anchor="middle" font-weight="bold">Матроидные данные</text>
<text x="185.00" y="334.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Обычные леса, остовное</text>
<text x="185.00" y="363.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">число и резистивный радиус</text>
<text x="185.00" y="392.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Общие при фиксированном N</text>
