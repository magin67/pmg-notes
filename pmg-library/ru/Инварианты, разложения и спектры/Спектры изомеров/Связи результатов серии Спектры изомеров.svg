<line x1="870.00" y1="520.00" x2="1160.00" y2="520.00" stroke="#15815b" stroke-width="4" stroke-linecap="round"/>
<text x="1015.00" y="557.00" font-size="23" fill="#15815b" text-anchor="middle" font-weight="bold">Сдвинутый отклик</text>
<text x="1015.00" y="594.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Три точных рациональных</text>
<text x="1015.00" y="623.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">элемента граничного блока</text>
<text x="1015.00" y="652.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">матрицы (I + L)⁻¹</text>
<line x1="775.00" y1="566.00" x2="840.00" y2="566.00" stroke="#172b43" stroke-width="3" stroke-linecap="round"/>
