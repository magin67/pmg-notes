<text x="600.00" y="334.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Пять полиномов по ξ</text>
<text x="600.00" y="363.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Перенос на новую пару</text>
<text x="600.00" y="392.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">сохраняет замкнутость</text>
