<text x="600.00" y="594.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Пять точных целых чисел</text>
<text x="600.00" y="623.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Сохраняются отметка конца</text>
<text x="600.00" y="652.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">и порядок двух контактов</text>
