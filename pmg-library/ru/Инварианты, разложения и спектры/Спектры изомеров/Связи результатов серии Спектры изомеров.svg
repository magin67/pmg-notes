<text x="1015.00" y="363.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Степень матрицы периода</text>
<text x="1015.00" y="392.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Скалярные рекурсии</text>
