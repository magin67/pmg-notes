<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">Связи результатов серии Спектры изомеров</title><desc id="desc">Конфигурация даёт матроидные и граничные данные. Граничный паспорт позволяет вычислять спектр, переносить границу и декодировать отмеченную цепочку. Полный целый вектор при ξ=-1 эквивалентен трём точным рациональным элементам сдвинутого отклика. Обратные задачи по одному полиному и одному числу остаются гипотезами для всех длин.</desc>
<rect width="1200" height="1040" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="345" y="20" width="510" height="126" rx="16" fill="#f7f9fc" stroke="#dce4ed"/>
<line x1="365.00" y1="40.00" x2="835.00" y2="40.00" stroke="#196bb9" stroke-width="4" stroke-linecap="round"/>
<text x="600.00" y="77.00" font-size="23" fill="#196bb9" text-anchor="middle" font-weight="bold">SLR-цепочка</text>
<text x="600.00" y="114.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Ядра, швы и упорядоченная конечная пара</text>
