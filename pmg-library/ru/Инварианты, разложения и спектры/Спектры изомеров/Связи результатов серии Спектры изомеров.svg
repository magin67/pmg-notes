<text x="807.50" y="854.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Ориентированное слово и число ядер восстанавливаются</text>
<text x="807.50" y="883.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">Доказано для любой длины в принятом классе</text>
<text x="807.50" y="912.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">При ошибках данных требуется анализ устойчивости</text>
