<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Динамический отклик исходной цепочки</title><desc id="desc">Одинаковые единичные теплоёмкости в вершинах и теплопроводности рёбер. Нет новых рёбер и внешнего теплообмена. На примере C6 показаны точные функции собственного и перекрёстного откликов; взвешенные интегралы равны 9/20 и 7/40.</desc>
