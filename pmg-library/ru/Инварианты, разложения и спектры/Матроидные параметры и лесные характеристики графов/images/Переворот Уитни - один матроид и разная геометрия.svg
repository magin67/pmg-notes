<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
<title id="title">Переворот Уитни: один матроид, разная геометрия</title>
<desc id="desc">Две части являются двухрёберными путями с листом при первом конце. При прямой склейке листья присоединены к одной вершине C4, при перевороте к противоположным. Имена рёбер сохраняются. Радиус 13/16 в обоих случаях, индекс Кирхгофа равен 20 и 21.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="context-stroke" stroke-width="1.8"/></marker></defs>
<rect width="960" height="590" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text id="text6" x="30" y="39" font-size="27" fill="#203444" text-anchor="start" font-weight="700">Переворот Уитни: один матроид, разная геометрия</text>
<text id="text7" x="30" y="72" font-size="18" fill="#566b7b" text-anchor="start" font-weight="400">Пары граничных вершин фиксированы; меняется только соответствие двух концов.</text>
