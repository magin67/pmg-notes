<text id="text46" x="480" y="510" font-size="25" fill="#203444" text-anchor="middle" font-weight="400">Rᵢⱼ = Grᵢᵢ + Grⱼⱼ − 2 Grᵢⱼ</text>
<text id="text47" x="480" y="550" font-size="22" fill="#203444" text-anchor="middle" font-weight="400">R<tspan baseline-shift="sub" font-size="70%">ab</tspan> = R<tspan baseline-shift="sub" font-size="70%">bc</tspan> = R<tspan baseline-shift="sub" font-size="70%">cd</tspan> = 1;    R<tspan baseline-shift="sub" font-size="70%">ad</tspan> = 3</text>
</g>
</svg>
