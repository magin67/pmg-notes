<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
<title id="title">Удаление и стягивание ребра треугольника</title><desc id="desc">Леса разбиты по наличию выделенного ребра; после его стягивания два ребра остаются отдельными.</desc>
<rect width="1080" height="570" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif"><text x="540" y="40" font-size="27" font-weight="600" fill="#1d2939" text-anchor="middle">Удаление и стягивание ребра треугольника</text><rect x="25" y="77" width="330" height="347" rx="15" fill="#f5f7fb" stroke="#d9e1ec"/><text x="190" y="112" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">Исходный граф G</text><rect x="375" y="77" width="330" height="347" rx="15" fill="#f5f7fb" stroke="#d9e1ec"/><text x="540" y="112" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">Удаление G ∖ ℓ</text><rect x="725" y="77" width="330" height="347" rx="15" fill="#f5f7fb" stroke="#d9e1ec"/><text x="890" y="112" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">Стягивание G / ℓ</text><path d="M90,285 Q190.00,285.00 290,285" fill="none" stroke="#8a43a3" stroke-width="4" stroke-linecap="round"/><path d="M90,285 Q140.00,224.00 190,163" fill="none" stroke="#2563a8" stroke-width="4" stroke-linecap="round"/><path d="M290,285 Q240.00,224.00 190,163" fill="none" stroke="#287a62" stroke-width="4" stroke-linecap="round"/><circle cx="90" cy="285" r="8" fill="white" stroke="#1d2939" stroke-width="2.5"/><text x="90" y="317" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">a</text><circle cx="290" cy="285" r="8" fill="white" stroke="#1d2939" stroke-width="2.5"/><text x="290" y="317" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">b</text><circle cx="190" cy="163" r="8" fill="white" stroke="#1d2939" stroke-width="2.5"/><text x="190" y="145" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">c</text><text x="190" y="276" font-size="21" font-weight="600" fill="#8a43a3" text-anchor="middle">ℓ = ab</text><text x="190" y="363" font-size="26" font-weight="600" fill="#1d2939" text-anchor="middle">1 + 3t + 3t²</text><text x="190" y="398" font-size="20" font-weight="400" fill="#1d2939" text-anchor="middle">7 лесов</text><path d="M440,285 Q490.00,224.00 540,163" fill="none" stroke="#2563a8" stroke-width="4" stroke-linecap="round"/><path d="M640,285 Q590.00,224.00 540,163" fill="none" stroke="#287a62" stroke-width="4" stroke-linecap="round"/><circle cx="440" cy="285" r="8" fill="white" stroke="#1d2939" stroke-width="2.5"/><text x="440" y="317" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">a</text><circle cx="640" cy="285" r="8" fill="white" stroke="#1d2939" stroke-width="2.5"/><text x="640" y="317" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">b</text><circle cx="540" cy="163" r="8" fill="white" stroke="#1d2939" stroke-width="2.5"/><text x="540" y="145" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">c</text><text x="540" y="363" font-size="26" font-weight="600" fill="#1d2939" text-anchor="middle">1 + 2t + t²</text><text x="540" y="398" font-size="20" font-weight="400" fill="#1d2939" text-anchor="middle">4 леса без ℓ</text><path d="M800,285 Q865.31,187.58 980,163" fill="none" stroke="#2563a8" stroke-width="4" stroke-linecap="round"/><path d="M800,285 Q914.69,260.42 980,163" fill="none" stroke="#287a62" stroke-width="4" stroke-linecap="round"/><circle cx="800" cy="285" r="8" fill="white" stroke="#1d2939" stroke-width="2.5"/><text x="800" y="317" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">a = b</text><circle cx="980" cy="163" r="8" fill="white" stroke="#1d2939" stroke-width="2.5"/><text x="980" y="145" font-size="23" font-weight="600" fill="#1d2939" text-anchor="middle">c</text><text x="890" y="363" font-size="26" font-weight="600" fill="#1d2939" text-anchor="middle">1 + 2t</text><text x="890" y="398" font-size="20" font-weight="400" fill="#1d2939" text-anchor="middle">3 леса после стягивания</text><text x="540" y="468" text-anchor="middle" font-size="27" font-weight="600" fill="#1d2939">F<tspan baseline-shift="sub" font-size="18">G</tspan><tspan baseline-shift="baseline">(t) = F</tspan><tspan baseline-shift="sub" font-size="18">G ∖ ℓ</tspan><tspan baseline-shift="baseline">(t) + t F</tspan><tspan baseline-shift="sub" font-size="18">G / ℓ</tspan><tspan baseline-shift="baseline">(t)</tspan></text><text x="540" y="510" font-size="22" font-weight="400" fill="#1d2939" text-anchor="middle">Выбрать оба параллельных ребра нельзя: получится цикл.</text><text x="540" y="544" font-size="20" font-weight="400" fill="#1d2939" text-anchor="middle">Все проводимости равны 1; множитель t возвращает выбранное ребро ℓ.</text></g>
</svg>
