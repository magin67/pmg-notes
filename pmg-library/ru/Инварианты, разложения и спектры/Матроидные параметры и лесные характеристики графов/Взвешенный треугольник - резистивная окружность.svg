<text id="text40" x="763.4387980744854" y="290.0786671095473" font-size="21" fill="#167f77" text-anchor="start" font-weight="400">h</text>
<text id="text41" x="246" y="512" font-size="21" fill="#203444" text-anchor="middle" font-weight="400">R<tspan baseline-shift="sub" font-size="70%">ab</tspan> = 5/11,   R<tspan baseline-shift="sub" font-size="70%">ac</tspan> = 4/11</text>
<text id="text42" x="246" y="548" font-size="21" fill="#203444" text-anchor="middle" font-weight="400">R<tspan baseline-shift="sub" font-size="70%">bc</tspan> = 3/11</text>
<text id="text43" x="714" y="512" font-size="25" fill="#203444" text-anchor="middle" font-weight="700">ρ = 15/121</text>
<text id="text44" x="714" y="548" font-size="21" fill="#203444" text-anchor="middle" font-weight="400">R<tspan baseline-shift="sub" font-size="70%">sph</tspan> = √15 / 11;   O ≠ h</text>
</g>
</svg>
