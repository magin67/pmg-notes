<text id="text16" x="246" y="164" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">a</text>
<circle cx="96" cy="376" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text18" x="79" y="401" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">b</text>
<circle cx="396" cy="376" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text20" x="413" y="401" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">c</text>
<text id="text21" x="151" y="270" font-size="21" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">c<tspan baseline-shift="sub" font-size="70%">ab</tspan> = 1</text>
<text id="text22" x="341" y="270" font-size="21" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">c<tspan baseline-shift="sub" font-size="70%">ac</tspan> = 2</text>
<text id="text23" x="246" y="365" font-size="21" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">c<tspan baseline-shift="sub" font-size="70%">bc</tspan> = 3</text>
