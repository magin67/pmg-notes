<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc">
<title id="title">От проводимостей к описанной окружности</title>
<desc id="desc">Слева сеть с проводимостями 1,2,3. Справа точная евклидова реализация: квадраты сторон 5/11,4/11,3/11, квадрат радиуса 15/121. Центр O отличается от центроида h.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="context-stroke" stroke-width="1.8"/></marker></defs>
<rect width="960" height="590" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text id="text6" x="30" y="39" font-size="27" fill="#203444" text-anchor="start" font-weight="700">От проводимостей к описанной окружности</text>
<text id="text7" x="30" y="72" font-size="18" fill="#566b7b" text-anchor="start" font-weight="400">Сеть показана схематически. Евклидова реализация справа сохраняет длины √R.</text>
<rect x="24" y="96" width="444" height="374" rx="12" fill="#f3f6f9" stroke="none"/>
<rect x="492" y="96" width="444" height="374" rx="12" fill="#f3f6f9" stroke="none"/>
