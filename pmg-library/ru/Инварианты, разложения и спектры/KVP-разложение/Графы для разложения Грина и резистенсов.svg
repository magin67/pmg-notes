<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="763" viewBox="0 0 1070 763" role="img" aria-labelledby="title desc">
<title id="title">Графы для разложения Грина и резистенсов</title>
<desc id="desc">Путь на четырёх вершинах, взвешенный граф с четырьмя единичными связями между долями ab и cd и связью cd веса 2, орцикл abc и тот же орцикл с двусторонним присоединением вершины d к a. Все неуказанные веса существующих связей равны 1.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#286b99"/></marker>
<marker id="back" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 10 0 L 0 5 L 10 10 Z" fill="#286b99"/></marker>
</defs>
<rect width="1070" height="763" fill="#f4f7fa"/><text x="25" y="33" font-family="Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="start" fill="#243b53">Матрица Грина и резистенсы: четыре разных эффекта</text><g transform="translate(20,58)"><rect width="505" height="332" rx="12" fill="white" stroke="#cbd5e1"/><text x="23" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#243b53">Путь P₄</text><path d="M 81.00 154.00 L 169.00 154.00" fill="none" stroke="#286b99" stroke-width="3"/><path d="M 207.00 154.00 L 295.00 154.00" fill="none" stroke="#286b99" stroke-width="3"/><path d="M 333.00 154.00 L 421.00 154.00" fill="none" stroke="#286b99" stroke-width="3"/><circle cx="62" cy="154" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="62" y="160" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">a</text><circle cx="188" cy="154" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="188" y="160" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">b</text><circle cx="314" cy="154" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="314" y="160" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">c</text><circle cx="440" cy="154" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="440" y="160" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">d</text><text x="252" y="282" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#243b53">r<tspan baseline-shift="sub" font-size="75%">ab</tspan> = 1/4; r<tspan baseline-shift="sub" font-size="75%">ba</tspan> = 3/4</text><text x="252" y="310" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#243b53">У r есть U, но нет O</text></g><g transform="translate(545,58)"><rect width="505" height="332" rx="12" fill="white" stroke="#cbd5e1"/><text x="23" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#243b53">Взвешенный ненаправленный граф</text><path d="M 129.00 101.00 L 361.00 101.00" fill="none" stroke="#286b99" stroke-width="3"/><path d="M 127.36 108.72 L 362.64 213.28" fill="none" stroke="#286b99" stroke-width="3"/><path d="M 127.36 213.28 L 362.64 108.72" fill="none" stroke="#286b99" stroke-width="3"/><path d="M 129.00 221.00 L 361.00 221.00" fill="none" stroke="#286b99" stroke-width="3"/><path d="M 380.00 120.00 L 380.00 202.00" fill="none" stroke="#286b99" stroke-width="3"/><rect x="392.0" y="145.0" width="24" height="25" fill="white" rx="4"/><text x="404.0" y="164.0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#243b53">2</text><circle cx="110" cy="101" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="110" y="107" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">a</text><circle cx="110" cy="221" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="110" y="227" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">b</text><circle cx="380" cy="101" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="380" y="107" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">c</text><circle cx="380" cy="221" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="380" y="227" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">d</text><text x="252" y="282" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#243b53">Связи аддитивны по концам пары</text><text x="252" y="310" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#243b53">C<tspan baseline-shift="sub" font-size="75%">P</tspan> = 0, но R<tspan baseline-shift="sub" font-size="75%">P</tspan> ≠ 0</text></g><g transform="translate(20,410)"><rect width="505" height="332" rx="12" fill="white" stroke="#cbd5e1"/><text x="23" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#243b53">Единичный 3-орцикл</text><path d="M 164.00 105.00 L 346.00 105.00" fill="none" stroke="#286b99" stroke-width="3" marker-end="url(#arrow)"/><path d="M 352.39 119.21 L 267.61 214.79" fill="none" stroke="#286b99" stroke-width="3" marker-end="url(#arrow)"/><path d="M 242.39 214.79 L 157.61 119.21" fill="none" stroke="#286b99" stroke-width="3" marker-end="url(#arrow)"/><circle cx="145" cy="105" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="145" y="111" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">a</text><circle cx="365" cy="105" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="365" y="111" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">b</text><circle cx="255" cy="229" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="255" y="235" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">c</text><text x="252" y="282" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#243b53">R<tspan baseline-shift="sub" font-size="75%">ab</tspan> = R<tspan baseline-shift="sub" font-size="75%">bc</tspan> = R<tspan baseline-shift="sub" font-size="75%">ca</tspan> = 1</text><text x="252" y="310" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#243b53">r: K + O; R: только K</text></g><g transform="translate(545,410)"><rect width="505" height="332" rx="12" fill="white" stroke="#cbd5e1"/><text x="23" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#243b53">Нерегулярный балграф</text><path d="M 143.84 120.38 L 76.16 213.62" fill="none" stroke="#286b99" stroke-width="3" marker-end="url(#arrow)"/><path d="M 84.00 229.00 L 226.00 229.00" fill="none" stroke="#286b99" stroke-width="3" marker-end="url(#arrow)"/><path d="M 233.84 213.62 L 166.16 120.38" fill="none" stroke="#286b99" stroke-width="3" marker-end="url(#arrow)"/><path d="M 174.00 105.00 L 381.00 105.00" fill="none" stroke="#286b99" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><circle cx="155" cy="105" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="155" y="111" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">a</text><circle cx="65" cy="229" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="65" y="235" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">b</text><circle cx="245" cy="229" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="245" y="235" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">c</text><circle cx="400" cy="105" r="18" fill="#fff" stroke="#286b99" stroke-width="2.3"/><text x="400" y="111" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#243b53">d</text><text x="252" y="282" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#243b53">Входящие и исходящие степени: (2, 1, 1, 1)</text><text x="252" y="310" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#243b53">r: K + V + P + O + U</text></g></svg>