<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="434" viewBox="0 0 1125 434" role="img" aria-labelledby="title desc"><title id="title">Электрометрический пример KVP</title><desc id="desc">Три схемы: единичный цикл, тот же цикл с четырьмя последовательными контактными сопротивлениями и цикл с проводимостью ab, увеличенной до 2. Контакты имеют сопротивления 1/4, 1/2, 3/4, 1.</desc><rect width="1125" height="434" fill="#f4f7fa"/><text x="20" y="32" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#243b53">Контактные поправки и изменение проводимости</text><g transform="translate(15,58)"><rect width="355" height="355" rx="12" fill="white" stroke="#cbd5e1"/><text x="178" y="33" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#243b53">Исходный цикл</text><path d="M 93.00 112.00 L 262.00 112.00" stroke="#286b99" stroke-width="3" fill="none"/><path d="M 280.00 130.00 L 280.00 249.00" stroke="#286b99" stroke-width="3" fill="none"/><path d="M 262.00 267.00 L 93.00 267.00" stroke="#286b99" stroke-width="3" fill="none"/><path d="M 75.00 249.00 L 75.00 130.00" stroke="#286b99" stroke-width="3" fill="none"/><circle cx="75" cy="112" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="75" y="118" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">a</text><circle cx="280" cy="112" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="280" y="118" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">b</text><circle cx="280" cy="267" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="280" y="273" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">c</text><circle cx="75" cy="267" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="75" y="273" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">d</text><text x="178" y="325" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#243b53">Проводимости связей равны 1</text></g><g transform="translate(385,58)"><rect width="355" height="355" rx="12" fill="white" stroke="#cbd5e1"/><text x="178" y="33" font-family="Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#243b53">Цикл с контактами</text><path d="M 143.00 130.00 L 212.00 130.00" stroke="#286b99" stroke-width="3" fill="none"/><path d="M 230.00 148.00 L 230.00 217.00" stroke="#286b99" stroke-width="3" fill="none"/><path d="M 212.00 235.00 L 143.00 235.00" stroke="#286b99" stroke-width="3" fill="none"/><path d="M 125.00 217.00 L 125.00 148.00" stroke="#286b99" stroke-width="3" fill="none"/><path d="M 109.99 120.06 L 60.01 86.94" stroke="#bb5b23" stroke-width="3" fill="none"/><path d="M 245.01 120.06 L 294.99 86.94" stroke="#bb5b23" stroke-width="3" fill="none"/><path d="M 245.26 244.54 L 294.74 275.46" stroke="#bb5b23" stroke-width="3" fill="none"/><path d="M 109.74 244.54 L 60.26 275.46" stroke="#bb5b23" stroke-width="3" fill="none"/><circle cx="125" cy="130" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="125" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">x<tspan baseline-shift="sub" font-size="75%">a</tspan></text><circle cx="230" cy="130" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="230" y="136" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">x<tspan baseline-shift="sub" font-size="75%">b</tspan></text><circle cx="230" cy="235" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="230" y="241" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">x<tspan baseline-shift="sub" font-size="75%">c</tspan></text><circle cx="125" cy="235" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="125" y="241" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">x<tspan baseline-shift="sub" font-size="75%">d</tspan></text><circle cx="45" cy="77" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="45" y="83" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">a</text><circle cx="310" cy="77" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="310" y="83" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">b</text><circle cx="310" cy="285" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="310" y="291" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">c</text><circle cx="45" cy="285" r="18" fill="white" stroke="#286b99" stroke-width="2"/><text x="45" y="291" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">d</text><rect x="47.0" y="115" width="36" height="25" rx="4" fill="white"/><text x="65" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#a14717">1/4</text><rect x="272.0" y="115" width="36" height="25" rx="4" fill="white"/><text x="290" y="134" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#a14717">1/2</text><rect x="272.0" y="220" width="36" height="25" rx="4" fill="white"/><text x="290" y="239" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#a14717">3/4</text><rect x="50.0" y="220" width="30" height="25" rx="4" fill="white"/><text x="65" y="239" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#a14717">1</text><text x="178" y="325" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle