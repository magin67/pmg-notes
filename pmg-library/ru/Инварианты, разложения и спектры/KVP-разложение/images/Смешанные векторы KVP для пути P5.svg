<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc">
<title id="title">Метрические вклады не ортогональны</title>
<desc id="desc">Математический смысл и точные данные приведены в подписи к рисунку.</desc>
<defs>
<marker id="ink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#20344a"/></marker>
<marker id="blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#28638c"/></marker>
<marker id="orange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#b45920"/></marker>
<marker id="green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#178071"/></marker>
<marker id="gray" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#9ba8b5"/></marker>
<marker id="purple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#7e549b"/></marker>
</defs>
<rect width="1120" height="530" rx="12" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif">
<text x="560.00" y="42.00" font-size="25" fill="#20344a" text-anchor="middle" font-weight="bold">Метрические вклады не ортогональны</text>
<rect x="20" y="80" width="690" height="390" rx="12" fill="#f7f9fc" stroke="#dce4ec"/>
<rect x="735" y="80" width="365" height="390" rx="12" fill="#f7f9fc" stroke="#dce4ec"/>
<path d="M100.00 260.00 L640.00 260.00" fill="none" stroke="#28638c" stroke-width="4" marker-end="url(#blue)"/>
<path d="M640.00 260.00 L568.00 224.00" fill="none" stroke="#b45920" stroke-width="4" marker-end="url(#orange)"/>
<path d="M568.00 224.00 L478.00 314.00" fill="none" stroke="#7e549b" stroke-width="4" marker-end="url(#purple)"/>
<path d="M100.00 260.00 L478.00 314.00" fill="none" stroke="#178071" stroke-width="3" marker-end="url(#green)" stroke-dasharray="8 6"/>
<circle cx="100.00" cy="260.00" r="5.00" fill="#20344a" stroke="#20344a" stroke-width="2"/>
<text x="80.00" y="242.00" font-size="23" fill="#20344a" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">h</text>
<circle cx="478.00" cy="314.00" r="5.00" fill="#178071" stroke="#178071" stroke-width="2"/>
<text x="498.00" y="342.00" font-size="23" fill="#178071" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">p</text>
<text x="340.00" y="239.00" font-size="25" fill="#28638c" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">z<tspan baseline-shift="sub" font-size="70%">K</tspan></text>
<text x="620.00" y="210.00" font-size="25" fill="#b45920" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">z<tspan baseline-shift="sub" font-size="70%">V</tspan></text>
<text x="551.00" y="304.00" font-size="25" fill="#7e549b" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">z<tspan baseline-shift="sub" font-size="70%">P</tspan></text>
<text x="285.00" y="322.00" font-size="24" fill="#178071" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">p − h</text>
<text x="365.00" y="399.00" font-size="25" fill="#20344a" text-anchor="middle" font-weight="bold">z<tspan baseline-shift="sub" font-size="70%">K</tspan> + z<tspan baseline-shift="sub" font-size="70%">V</tspan> + z<tspan baseline-shift="sub" font-size="70%">P</tspan> = p − h</text>
<text x="917.00" y="126.00" font-size="24" fill="#20344a" text-anchor="middle" font-weight="bold">Путь P₅</text>
<text x="917.00" y="191.00" font-size="22" fill="#20344a" text-anchor="middle">Σ z<tspan baseline-shift="sub" font-size="70%">X</tspan>² = 97/225</text>
<text x="917.00" y="250.00" font-size="22" fill="#20344a" text-anchor="middle">2Σ z<tspan baseline-shift="sub" font-size="70%">X</tspan>·z<tspan baseline-shift="sub" font-size="70%">Y</tspan> = −52/225</text>
<text x="917.00" y="321.00" font-size="22" fill="#20344a" text-anchor="middle">(p − h)² = 45/225</text>
<text x="917.00" y="361.00" font-size="22" fill="#20344a" text-anchor="middle">= 1/5</text>
<text x="917.00" y="423.00" font-size="18" fill="#20344a" text-anchor="middle">Во второй сумме X &lt; Y</text>
<text x="560.00" y="510.00" font-size="20" fill="#20344a" text-anchor="middle">Точная плоская реализация трёх векторов; см. координаты в подписи.</text>
</g></svg>
