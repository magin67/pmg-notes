<svg xmlns="http://www.w3.org/2000/svg" width="485" height="116" viewBox="0 0 485 116" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Rooted potentials of the unit directed path</title>
  <desc id="diagram-description">Unit arcs lead from a to b and from b to c. The rooted potentials of a, b and c are zero, zero and one.</desc>
  <rect width="485" height="116" fill="white" />
  <line x1="84.5" y1="44.0" x2="214.5" y2="44.0" stroke="#19354c" stroke-width="2.5" />
  <polygon points="223.50,44.00 213.50,39.70 213.50,48.30" fill="#19354c" />
  <text x="154.0" y="33" fill="#19354c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">1</text>
  <line x1="260.5" y1="44.0" x2="390.5" y2="44.0" stroke="#19354c" stroke-width="2.5" />
  <polygon points="399.50,44.00 389.50,39.70 389.50,48.30" fill="#19354c" />
  <text x="330.0" y="33" fill="#19354c" font-family="DejaVu Sans, sans-serif" font-size="18" text-anchor="middle">1</text>
  <circle cx="66" cy="44" r="17" fill="white" stroke="#19354c" stroke-width="1.7" />
  <text x="66" y="50" fill="#19354c" font-family="Georgia, DejaVu Serif, serif" font-size="20" text-anchor="middle" font-style="italic">a</text>
  <text x="66" y="94" fill="#19354c" font-family="Georgia, DejaVu Serif, serif" font-size="22" text-anchor="middle">τ<tspan dy="4" font-size="14" font-style="italic">a</tspan>
    <tspan dy="-4" font-size="22"> = 0</tspan>
  </text>
  <circle cx="242" cy="44" r="17" fill="white" stroke="#19354c" stroke-width="1.7" />
  <text x="242" y="50" fill="#19354c" font-family="Georgia, DejaVu Serif, serif" font-size="20" text-anchor="middle" font-style="italic">b</text>
  <text x="242" y="94" fill="#19354c" font-family="Georgia, DejaVu Serif, serif" font-size="22" text-anchor="middle">τ<tspan dy="4" font-size="14" font-style="italic">b</tspan>
    <tspan dy="-4" font-size="22"> = 0</tspan>
  </text>
  <circle cx="418" cy="44" r="17" fill="#19354c" stroke="#19354c" stroke-width="1.7" />
  <text x="418" y="50" fill="white" font-family="Georgia, DejaVu Serif, serif" font-size="20" text-anchor="middle" font-style="italic">c</text>
  <text x="418" y="94" fill="#19354c" font-family="Georgia, DejaVu Serif, serif" font-size="22" text-anchor="middle">τ<tspan dy="4" font-size="14" font-style="italic">c</tspan>
    <tspan dy="-4" font-size="22"> = 1</tspan>
  </text>
</svg>
