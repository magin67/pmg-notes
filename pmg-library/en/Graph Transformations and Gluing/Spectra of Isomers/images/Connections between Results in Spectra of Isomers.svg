<title id="title">Connections between results in Spectra of Isomers</title><desc id="desc">A configuration gives matroid and boundary data. The boundary passport supports spectral calculation, boundary transfer, and decoding of the marked chain. The full integer vector at ξ=-1 is equivalent to three exact rational entries of the shifted response. Inverse problems from one polynomial or one number remain conjectural for arbitrary length.</desc>
