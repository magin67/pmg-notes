<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Reading SLR backwards</title><desc id="desc">Full code SLR has four cores and operation word LRS. Decoding removes S, then R, then L, reaching the initial state. The final S specifies the terminal marking; the initial S in the full code is a marker.</desc>
