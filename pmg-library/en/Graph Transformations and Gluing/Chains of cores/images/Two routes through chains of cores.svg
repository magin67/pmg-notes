<text x="127.00" y="118.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="bold">Cores</text>
<text x="127.00" y="153.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">and seams</text>
