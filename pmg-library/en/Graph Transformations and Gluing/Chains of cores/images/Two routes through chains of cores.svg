<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="510" viewBox="0 0 1180 510" role="img" aria-labelledby="title desc">
<title id="title">Two routes through chains of cores</title><desc id="desc">Main track: cores, invariance, spanning-tree recurrence, limits, closure. Further track: weaving and the full toponome.</desc>
