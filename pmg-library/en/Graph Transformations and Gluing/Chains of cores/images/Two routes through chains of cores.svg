<text x="1047.00" y="118.00" font-size="21" fill="#172b43" text-anchor="middle" font-weight="bold">Closing</text>
<text x="1047.00" y="153.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">a chain</text>
