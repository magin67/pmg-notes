<text x="587.00" y="153.00" font-size="20" fill="#172b43" text-anchor="middle" font-weight="normal">determinant</text>
<line x1="691.00" y1="134.00" x2="714.00" y2="134.00" stroke="#196bb9" stroke-width="3" stroke-linecap="round" />
