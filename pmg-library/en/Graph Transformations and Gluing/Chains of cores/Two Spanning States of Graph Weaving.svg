<rect x="560" y="20" width="540" height="345" rx="16" fill="#f7f9fc" stroke="#dce4ed" />
<text x="42.00" y="60.00" font-size="25" fill="#172b43" text-anchor="start" font-weight="bold">Contacts joined</text>
<text x="582.00" y="60.00" font-size="25" fill="#172b43" text-anchor="start" font-weight="bold">Contacts separated</text>
