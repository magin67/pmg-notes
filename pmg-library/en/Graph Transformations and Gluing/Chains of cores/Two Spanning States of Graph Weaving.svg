<line x1="340.00" y1="260.00" x2="110.00" y2="260.00" stroke="#16816c" stroke-width="5" stroke-linecap="round" />
<circle cx="110.00" cy="130.00" r="5" fill="#172b43" stroke="none" stroke-width="2" />
