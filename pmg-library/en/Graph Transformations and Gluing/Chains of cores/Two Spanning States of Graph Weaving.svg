<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Two spanning states of graph weaving</title><desc id="desc">One coordinate sums trees; the other sums two-component forests separating the marked contacts. For the square the coordinates are 4 and 3.</desc>
<rect width="1120" height="640" fill="white" />
<g font-family="DejaVu Sans, Arial, sans-serif">
