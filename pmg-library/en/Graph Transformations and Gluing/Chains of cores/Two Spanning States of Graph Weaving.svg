<text x="42.00" y="330.00" font-size="21" fill="#172b43" text-anchor="start" font-weight="normal">τ = 4 trees; one is shown</text>
<text x="582.00" y="330.00" font-size="21" fill="#172b43" text-anchor="start" font-weight="normal">σ = 3 separating forests; one is shown</text>
<rect x="20" y="390" width="1080" height="230" rx="16" fill="#f7f9fc" stroke="#dce4ed" />
<text x="42.00" y="432.00" font-size="22.681" fill="#172b43" text-anchor="start" font-weight="bold">The path runner updates both numbers</text>
