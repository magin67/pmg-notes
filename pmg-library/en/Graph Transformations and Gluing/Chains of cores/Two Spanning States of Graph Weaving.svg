<text x="659.00" y="533.00" font-size="18" fill="#52657a" text-anchor="middle" font-weight="normal">two squares</text>
<line x1="724.00" y1="488.00" x2="849.00" y2="488.00" stroke="#196bb9" stroke-width="3" stroke-linecap="round" />
<polygon points="849.00,488.00 837.00,483.00 837.00,493.00" fill="#196bb9" />
<text x="931.00" y="498.00" font-size="29" fill="#172b43" text-anchor="middle" font-weight="bold">(56, 41)</text>
<text x="931.00" y="533.00" font-size="18" fill="#52657a" text-anchor="middle" font-weight="normal">three squares</text>
<text x="42.00" y="587.00" font-size="22" fill="#172b43" text-anchor="start" font-weight="normal">τ′ = 3τ + σ</text>
<text x="580.00" y="587.00" font-size="22" fill="#172b43" text-anchor="start" font-weight="normal">σ′ = 2τ + σ</text>
