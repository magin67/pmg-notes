<text x="115.00" y="533.00" font-size="18" fill="#52657a" text-anchor="middle" font-weight="normal">edge</text>
<line x1="180.00" y1="488.00" x2="305.00" y2="488.00" stroke="#196bb9" stroke-width="3" stroke-linecap="round" />
<polygon points="305.00,488.00 293.00,483.00 293.00,493.00" fill="#196bb9" />
