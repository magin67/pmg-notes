<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
<title id="title">Matchings and the spanning-tree polynomial of four cores</title><desc id="desc">The five matchings of the auxiliary path on four cores: empty, three single edges, and the first and third edges together. Each selected edge contributes minus the square of the shared-edge count; an uncovered vertex contributes the core size.</desc>
