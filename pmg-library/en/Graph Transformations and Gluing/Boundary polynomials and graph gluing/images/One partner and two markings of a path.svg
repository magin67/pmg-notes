<circle cx="534.0" cy="316" r="7" fill="white" stroke="#203444" stroke-width="2"/>
<text x="534.0" y="296" font-size="18" fill="#203444" text-anchor="middle" font-weight="400">x</text>
<circle cx="624.0" cy="316" r="7" fill="white" stroke="#203444" stroke-width="2"/>
<text x="624.0" y="296" font-size="18" fill="#203444" text-anchor="middle" font-weight="400">b</text>
