<text x="426.0" y="296" font-size="18" fill="#203444" text-anchor="middle" font-weight="400">z</text>
<text x="246" y="367" font-size="23" fill="#203444" text-anchor="middle" font-weight="400">F(t) = (1 + t)⁴</text>
<text x="246" y="415" font-size="19" fill="#2767ad" text-anchor="middle" font-weight="400">After attaching J</text>
<path d="M 66 485 Q 156.0 617 246 485" fill="none" stroke="#2767ad" stroke-width="4"/>
