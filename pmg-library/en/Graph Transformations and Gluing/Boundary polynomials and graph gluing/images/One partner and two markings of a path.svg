<text x="714" y="597" font-size="22" fill="#203444" text-anchor="middle" font-weight="700">Cycle C₅</text>
<text x="714" y="635" font-size="21" fill="#203444" text-anchor="middle" font-weight="400">1 + 5t + 10t² + 10t³ + 5t⁴</text>
<text x="714" y="672" font-size="22" fill="#167f77" text-anchor="middle" font-weight="400">τ = 5</text>
<text x="480" y="737" font-size="20" fill="#566b7b" text-anchor="middle" font-weight="400">Equal forest polynomials of the parts give different polynomials after gluing.</text>
