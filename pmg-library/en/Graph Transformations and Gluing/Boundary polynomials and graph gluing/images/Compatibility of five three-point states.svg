<svg xmlns="http://www.w3.org/2000/svg" width="960" height="622" viewBox="0 0 960 622" role="img" aria-labelledby="title desc">
<title id="title">Compatibility of five three-point states</title>
<desc id="desc">Matrix in the order x|y|z, xy|z, xz|y, x|yz, xyz. Rows: 11111, 10110, 11010, 11100, 10000. One means a forest; zero means a cycle. Distinct pair states are compatible; identical pair states create a cycle.</desc>
