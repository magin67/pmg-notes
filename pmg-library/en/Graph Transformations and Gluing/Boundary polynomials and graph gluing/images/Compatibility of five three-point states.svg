<text x="28" y="40" font-size="27" fill="#203444" text-anchor="start" font-weight="700">Compatibility of five three-point states</text>
<text x="28" y="73" font-size="17" fill="#566b7b" text-anchor="start" font-weight="400">B = {x, y, z}; rows and columns follow the passport coordinate order.</text>
<text x="348.0" y="142" font-size="22" fill="#203444" text-anchor="middle" font-weight="700">x|y|z</text>
