<text x="480" y="522" font-size="21" fill="#203444" text-anchor="middle" font-weight="400">1: the union remains a forest;  0: the union creates a cycle</text>
<text x="480" y="567" font-size="18" fill="#566b7b" text-anchor="middle" font-weight="400">Distinct pair connections give a boundary tree; a repeated connection gives a cycle.</text>
<text x="480" y="603" font-size="18" fill="#566b7b" text-anchor="middle" font-weight="400">The fully connected state xyz is compatible only with x|y|z.</text>
