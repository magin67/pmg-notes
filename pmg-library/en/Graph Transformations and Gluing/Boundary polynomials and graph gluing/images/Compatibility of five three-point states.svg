<text x="580.0" y="142" font-size="22" fill="#203444" text-anchor="middle" font-weight="700">xz|y</text>
<text x="696.0" y="142" font-size="22" fill="#203444" text-anchor="middle" font-weight="700">x|yz</text>
<text x="812.0" y="142" font-size="22" fill="#203444" text-anchor="middle" font-weight="700">xyz</text>
<text x="255" y="205" font-size="22" fill="#203444" text-anchor="end" font-weight="700">x|y|z</text>
