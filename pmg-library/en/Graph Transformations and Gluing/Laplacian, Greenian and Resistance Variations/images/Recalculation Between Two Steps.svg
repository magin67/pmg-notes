<text xml:space="preserve" x="560" y="510" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">3 × (1 + 2/3) = 5;    5 × (1 + 3/5) = 8</text>
<text xml:space="preserve" x="560" y="566" font-size="25" fill="#b56414" style="fill:#b56414" font-weight="600" text-anchor="middle">Reusing the old resistance in step two gives 25/3 ≠ 8</text>
