<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title"><title id="title">A Joint Step and a Singular Intermediate State</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="650" fill="white"/>
<text xml:space="preserve" x="560" y="45" font-size="27" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Two resistances: the joint step remains admissible</text>
<text xml:space="preserve" x="372.0" y="90" font-size="26" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">R</text>
<text xml:space="preserve" x="391.0" y="95.72" font-size="18" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">12</text>
<text xml:space="preserve" x="411.0" y="90" font-size="26" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> = R</text>
<text xml:space="preserve" x="459.0" y="95.72" font-size="18" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">13</text>
<text xml:space="preserve" x="479.0" y="90" font-size="26" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> = R</text>
<text xml:space="preserve" x="527.0" y="95.72" font-size="18" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">23</text>
<text xml:space="preserve" x="547.0" y="90" font-size="26" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> = 2/3;    α = β = 2</text>
<rect x="40" y="125" width="490" height="150" rx="14" fill="#fff6f1" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="285" y="167" font-size="24" fill="#b33e39" style="fill:#b33e39" font-weight="400" text-anchor="middle">Only α = 2</text>
<text xml:space="preserve" x="285" y="209" font-size="24" fill="#b33e39" style="fill:#b33e39" font-weight="400" text-anchor="middle">Φ = 0</text>
<text xml:space="preserve" x="285" y="251" font-size="24" fill="#b33e39" style="fill:#b33e39" font-weight="400" text-anchor="middle">The intermediate Gr is singular</text>
<rect x="590" y="125" width="490" height="150" rx="14" fill="#fff6f1" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="835" y="167" font-size="24" fill="#b33e39" style="fill:#b33e39" font-weight="400" text-anchor="middle">Only β = 2</text>
<text xml:space="preserve" x="835" y="209" font-size="24" fill="#b33e39" style="fill:#b33e39" font-weight="400" text-anchor="middle">Φ = 0</text>
<text xml:space="preserve" x="835" y="251" font-size="24" fill="#b33e39" style="fill:#b33e39" font-weight="400" text-anchor="middle">The intermediate Gr is singular</text>
<text xml:space="preserve" x="265" y="350" font-size="25" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Both increments together</text>
<line x1="196.0" y1="507.0" x2="334.0" y2="507.0" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="265.0" y="542.0" font-size="22" fill="#24628a" style="fill:#24628a" font-weight="400" text-anchor="middle">1/5</text>
<line x1="188.73860948670617" y1="492.05995156237395" x2="253.26139051329383" y2="409.94004843762605" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="187.0" y="447.0" font-size="22" fill="#24628a" style="fill:#24628a" font-weight="400" text-anchor="middle">1/5</text>
<line x1="341.26139051329386" y1="492.05995156237395" x2="276.73860948670614" y2="409.94004843762605" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="343.0" y="447.0" font-size="22" fill="#24628a" style="fill:#24628a" font-weight="400" text-anchor="middle">7/5</text>
<circle cx="177.0" cy="507.0" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="177.0" y="514.0" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1</text>
<circle cx="353.0" cy="507.0" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="353.0" y="514.0" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">2</text>
<circle cx="265" cy="395" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="265" y="402" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">3</text>
<rect x="610" y="345" width="460" height="220" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="840" y="390" font-size="24" fill="#30765e" style="fill:#30765e" font-weight="400" text-anchor="middle">Φ = 5;   τ′ = 3/5</text>
<text xml:space="preserve" x="755.5" y="436" font-size="24" fill="#30765e" style="fill:#30765e" font-weight="400" text-anchor="start">R′</text>
<text xml:space="preserve" x="777.5" y="441.28" font-size="17" fill="#30765e" style="fill:#30765e" font-weight="400" text-anchor="start">12</text>
<text xml:space="preserve" x="795.5" y="436" font-size="24" fill="#30765e" style="fill:#30765e" font-weight="400" text-anchor="start"> = R′</text>
<text xml:space="preserve" x="845.5" y="441.28" font-size="17" fill="#30765e" style="fill:#30765e" font-weight="400" text-anchor="start">13</text>
<text xml:space="preserve" x="863.5" y="436" font-size="24" fill="#30765e" style="fill:#30765e" font-weight="400" text-anchor="start"> = 8/3</text>
<text xml:space="preserve" x="789.5" y="482" font-size="24" fill="#30765e" style="fill:#30765e" font-weight="400" text-anchor="start">R′</text>
<text xml:space="preserve" x="811.5" y="487.28" font-size="17" fill="#30765e" style="fill:#30765e" font-weight="400" text-anchor="start">23</text>
<text xml:space="preserve" x="829.5" y="482" font-size="24" fill="#30765e" style="fill:#30765e" font-weight="400" text-anchor="start"> = 2/3</text>
<text xml:space="preserve" x="840" y="528" font-size="24" fill="#30765e" style="fill:#30765e" font-weight="400" text-anchor="middle">All conductances are positive</text>
<text xml:space="preserve" x="560" y="619" font-size="24" fill="#b56414" style="fill:#b56414" font-weight="600" text-anchor="middle">Do not split a joint change into inadmissible full steps</text>
</svg>
