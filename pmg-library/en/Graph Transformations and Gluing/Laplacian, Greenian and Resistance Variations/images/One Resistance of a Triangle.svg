<text xml:space="preserve" x="855" y="500" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">τ′ = 12/5</text>
<text xml:space="preserve" x="560" y="583" font-size="24" fill="#647481" style="fill:#647481" font-weight="400" text-anchor="middle">Edge labels are conductances, not resistances</text>
