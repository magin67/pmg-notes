<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title"><title id="title">Dependent Arguments and the Top Grade</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="560" fill="white"/>
<text xml:space="preserve" x="560" y="43" font-size="29" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">The number of factors is not the rank</text>
<rect x="25" y="95" width="505" height="390" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<rect x="590" y="95" width="505" height="390" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<line x1="380" y1="410" x2="480" y2="210" stroke="#647481" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="200" y1="210" x2="480" y2="210" stroke="#647481" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="100" y1="410" x2="380" y2="410" stroke="#24628a" stroke-width="4" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="395" y="418" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a</text>
<line x1="100" y1="410" x2="200" y2="210" stroke="#24628a" stroke-width="4" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="200" y="190" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">b</text>
<line x1="100" y1="410" x2="480" y2="210" stroke="#24628a" stroke-width="4" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="475" y="190" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a + b</text>
<text xml:space="preserve" x="90" y="443" font-size="24" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">0</text>
<text xml:space="preserve" x="840" y="155" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Three independent pairs</text>
<text xml:space="preserve" x="840" y="202" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">One dependent triple</text>
<text xml:space="preserve" x="840" y="285" font-size="28" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a b (a + b) = 0</text>
<text xml:space="preserve" x="840" y="360" font-size="26" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">S = [a]² + [b]² + [a + b]²</text>
<text xml:space="preserve" x="840" y="405" font-size="26" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">S² / 2! = 3[ab]²</text>
<text xml:space="preserve" x="840" y="450" font-size="26" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">S³ = 0</text>
<text xml:space="preserve" x="560" y="535" font-size="24" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Exterior arguments are shown in auxiliary coordinates</text>
</svg>
