<svg xmlns="http://www.w3.org/2000/svg" width="830" height="518" viewBox="0 0 830 518" role="img" aria-labelledby="title desc">
<title id="title">Sequential elimination of internal vertices along a path</title>
<desc id="desc">The path a-x-y-b has coupling coefficients 2,1,3. Eliminating x leaves the path a-y-b with coupling coefficients 2/3 and 3. Eliminating y then leaves a coupling a-b of coefficient 6/11. In each graph, the effective resistance between a and b is 11/6. Vertex positions are schematic.</desc>
<rect width="100%" height="100%" rx="12" fill="white" />
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="415" y="40" text-anchor="middle" font-size="23" fill="#24364b">Original path</text><path d="M100,105 L310,105" stroke="#60758b" stroke-width="3" fill="none" /><text x="205.0" y="86" text-anchor="middle" font-size="23" fill="#24364b">2</text><path d="M310,105 L520,105" stroke="#60758b" stroke-width="3" fill="none" /><text x="415.0" y="86" text-anchor="middle" font-size="23" fill="#24364b">1</text><path d="M520,105 L730,105" stroke="#60758b" stroke-width="3" fill="none" /><text x="625.0" y="86" text-anchor="middle" font-size="23" fill="#24364b">3</text><circle cx="100" cy="105" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5" /><text x="100" y="112" text-anchor="middle" font-size="23" fill="#2563a6">a</text><circle cx="310" cy="105" r="20" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5" /><text x="310" y="112" text-anchor="middle" font-size="23" fill="#ad4937">x</text><circle cx="520" cy="105" r="20" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5" /><text x="520" y="112" text-anchor="middle" font-size="23" fill="#ad4937">y</text><circle cx="730" cy="105" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5" /><text x="730" y="112" text-anchor="middle" font-size="23" fill="#2563a6">b</text><text x="415" y="195" text-anchor="middle" font-size="23" fill="#24364b">After eliminating x</text><path d="M100,260 L520,260" stroke="#2563a6" stroke-width="3" fill="none" /><text x="310.0" y="241" text-anchor="middle" font-size="23" fill="#2563a6">2/3</text><path d="M520,260 L730,260" stroke="#60758b" stroke-width="3" fill="none" /><text x="625.0" y="241" text-anchor="middle" font-size="23" fill="#24364b">3</text><circle cx="100" cy="260" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5" /><text x="100" y="267" text-anchor="middle" font-size="23" fill="#2563a6">a</text><circle cx="520" cy="260" r="20" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5" /><text x="520" y="267" text-anchor="middle" font-size="23" fill="#ad4937">y</text><circle cx="730" cy="260" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5" /><text x="730" y="267" text-anchor="middle" font-size="23" fill="#2563a6">b</text><text x="415" y="350" text-anchor="middle" font-size="23" fill="#24364b">After eliminating y</text><path d="M100,415 L730,415" stroke="#2563a6" stroke-width="3" fill="none" /><text x="415.0" y="396" text-anchor="middle" font-size="23" fill="#2563a6">6/11</text><circle cx="100" cy="415" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5" /><text x="100" y="422" text-anchor="middle" font-size="23" fill="#2563a6">a</text><circle cx="730" cy="415" r="20" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5" /><text x="730" y="422" text-anchor="middle" font-size="23" fill="#2563a6">b</text><text x="415" y="486" text-anchor="middle" font-size="21" fill="#24364b">Effective resistance between a and b at each step: 11/6</text></g>
</svg>