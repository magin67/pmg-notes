<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="510" viewBox="0 0 1150 510" role="img" aria-labelledby="title desc">
<title id="title">From Documents to Employee Couplings</title>
<desc id="desc">Left: a bipartite graph, with a coupled to x1,x2; b to x1,x2,x3; and c to x2,x3,x4. All eight coupling coefficients are 1. Right: the employee triangle, with coefficients 5/6 on ab and bc, and 1/3 on ac. The effective resistances of ab and bc are 14/15, and that of ac is 4/3. This is a coupling diagram, not a metric realization.</desc>
<rect width="100%" height="100%" rx="12" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="280" y="40" text-anchor="middle" font-size="24" fill="#24364b">Employees and documents</text><text x="905" y="40" text-anchor="middle" font-size="24" fill="#24364b">Employee graph</text><path d="M125,135 L445,105" stroke="#60758b" stroke-width="3" fill="none"/><path d="M125,135 L445,205" stroke="#60758b" stroke-width="3" fill="none"/><path d="M125,265 L445,105" stroke="#60758b" stroke-width="3" fill="none"/><path d="M125,265 L445,205" stroke="#60758b" stroke-width="3" fill="none"/><path d="M125,265 L445,305" stroke="#60758b" stroke-width="3" fill="none"/><path d="M125,395 L445,205" stroke="#60758b" stroke-width="3" fill="none"/><path d="M125,395 L445,305" stroke="#60758b" stroke-width="3" fill="none"/><path d="M125,395 L445,405" stroke="#60758b" stroke-width="3" fill="none"/><circle cx="125" cy="135" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="125" y="142" text-anchor="middle" font-size="22" fill="#2563a6">a</text><circle cx="125" cy="265" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="125" y="272" text-anchor="middle" font-size="22" fill="#2563a6">b</text><circle cx="125" cy="395" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="125" y="402" text-anchor="middle" font-size="22" fill="#2563a6">c</text><circle cx="445" cy="105" r="22" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="445" y="112" text-anchor="middle" font-size="22" fill="#ad4937">x₁</text><circle cx="445" cy="205" r="22" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="445" y="212" text-anchor="middle" font-size="22" fill="#ad4937">x₂</text><circle cx="445" cy="305" r="22" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="445" y="312" text-anchor="middle" font-size="22" fill="#ad4937">x₃</text><circle cx="445" cy="405" r="22" fill="#fff3ee" stroke="#ad4937" stroke-width="2.5"/><text x="445" y="412" text-anchor="middle" font-size="22" fill="#ad4937">x₄</text><text x="280" y="473" text-anchor="middle" font-size="20" fill="#24364b">All original coupling coefficients equal 1</text><path d="M525,260 L655,260" stroke="#60758b" stroke-width="3" fill="none"/><path d="M644.0,267.0 L655,260 L644.0,253.0" stroke="#60758b" stroke-width="3" fill="none"/><text x="590" y="229" text-anchor="middle" font-size="18" fill="#24364b">eliminate X</text><path d="M765,130 L1050,130" stroke="#2563a6" stroke-width="3" fill="none"/><path d="M765,130 L908,395" stroke="#2563a6" stroke-width="3" fill="none"/><path d="M1050,130 L908,395" stroke="#2563a6" stroke-width="3" fill="none"/><text x="907" y="108" text-anchor="middle" font-size="23" fill="#2563a6">5/6</text><text x="796" y="278" text-anchor="middle" font-size="23" fill="#2563a6">1/3</text><text x="1016" y="278" text-anchor="middle" font-size="23" fill="#2563a6">5/6</text><circle cx="765" cy="130" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="765" y="137" text-anchor="middle" font-size="22" fill="#2563a6">a</text><circle cx="1050" cy="130" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="1050" y="137" text-anchor="middle" font-size="22" fill="#2563a6">b</text><circle cx="908" cy="395" r="22" fill="#edf4fb" stroke="#2563a6" stroke-width="2.5"/><text x="908" y="402" text-anchor="middle" font-size="22" fill="#2563a6">c</text><text x="905" y="473" text-anchor="middle" font-size="20" fill="#24364b">R<tspan baseline-shift="sub" font-size="70%">ab</tspan> = R<tspan baseline-shift="sub" font-size="70%">bc</tspan> = 14/15;  R<tspan baseline-shift="sub" font-size="70%">ac</tspan> = 4/3</text></g>
</svg>