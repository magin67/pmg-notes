<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
<title id="title">A path on three vertices and its resistance geometry</title>
<desc id="desc">Left: the path a-b-c with unit coupling coefficients and selected vertices a and c. Right: its Euclidean realization, a right triangle a b c with unit legs and hypotenuse of length square root of two. Blue marks the affine line through a and c.</desc>
<rect width="1040" height="470" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif" fill="#202c3b">
<text x="250" y="42" text-anchor="middle" font-size="23">Graph: coupling coefficients</text>
<text x="777" y="42" text-anchor="middle" font-size="23">Resistance geometry</text>
<path d="M516 66V413" stroke="#dce1e7"/>
<g stroke="#657588" stroke-width="3" fill="none">
<path d="M85 238H250H415"/>
<path d="M650 350H870V130"/>
<path d="M852 350V332H870" stroke-width="1.7"/>
</g>
<g font-size="21" text-anchor="middle">
<text x="167.5" y="216">1</text><text x="332.5" y="216">1</text>
<text x="760" y="377">1</text><text x="889" y="247">1</text>
</g>
<path d="M618 382L650 350M870 130L902 98" stroke="#176ba4" stroke-width="2.5" stroke-dasharray="7 6"/>
<path d="M650 350L870 130" stroke="#176ba4" stroke-width="3"/>
<text x="760" y="222" font-size="22" fill="#176ba4" text-anchor="middle" transform="rotate(-45 760 222)">√2</text>
<g fill="#176ba4" stroke="white" stroke-width="2.5">
<circle cx="85" cy="238" r="9"/><circle cx="415" cy="238" r="9"/>
<circle cx="650" cy="350" r="9"/><circle cx="870" cy="130" r="9"/>
</g>
<g fill="#657588" stroke="white" stroke-width="2.5">
<circle cx="250" cy="238" r="9"/><circle cx="870" cy="350" r="9"/>
</g>
<g font-size="23" text-anchor="middle" font-style="italic">
<text x="85" y="275">a</text><text x="250" y="275">b</text><text x="415" y="275">c</text>
<text x="627" y="350">a</text><text x="889" y="367">b</text><text x="852" y="112">c</text>
</g>
<text x="250" y="426" text-anchor="middle" font-size="17" fill="#526172">Positions in the diagram are arbitrary</text>
<text x="777" y="426" text-anchor="middle" font-size="17" fill="#526172">Squared distances equal effective resistances</text>
</g></svg>