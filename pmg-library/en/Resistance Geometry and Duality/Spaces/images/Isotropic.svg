<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
<title id="title">A local line and linear combinations</title>
<desc id="desc">Left: the resistance plane of the path a-b-c, with the line through a and c and its midpoint m. Right: the coordinate plane of expressions (1-t)a+tc+ηz. Linear combinations have η=0; local points lie on the parabola η=t(1-t). At t=1/2 the correction is z/4.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#8a4d1c"/></marker><marker id="axis" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#7b8794"/></marker></defs>
