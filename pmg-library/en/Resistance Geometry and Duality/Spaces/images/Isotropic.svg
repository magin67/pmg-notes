<g font-family="Arial, DejaVu Sans, sans-serif" fill="#202c3b">
<text x="270" y="42" text-anchor="middle" font-size="22">Euclidean geometry of centers</text>
<text x="824" y="42" text-anchor="middle" font-size="22">Local points in the (t, η) plane</text>
<path d="M548 68V550" stroke="#dce1e7"/>
