 <metadata>
  <rdf:RDF>
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
    <dc:title>Two Flows and Signs on a Square</dc:title>
    <dc:date>2026-11-03T09:38:13.516689</dc:date>
    <dc:description>Flows a-c and b-d have magnitude 1/2 on every side. On ab and cd their directions are opposite, giving -1/4; on bc and ad they agree, giving +1/4. The sum is zero but the distribution is nonzero.</dc:description>
