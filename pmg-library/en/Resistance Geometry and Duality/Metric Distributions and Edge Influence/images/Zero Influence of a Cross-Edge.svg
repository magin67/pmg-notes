<text xml:space="preserve" x="560" y="490" font-size="23" fill="#647481" style="fill:#647481" font-weight="400" text-anchor="middle">Four sides: c = 1; side labels show m</text>
<text xml:space="preserve" x="560" y="545" font-size="28" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">R(ac) = 1;    Σ m = 4 × 1/4 + 0 = 1</text>
