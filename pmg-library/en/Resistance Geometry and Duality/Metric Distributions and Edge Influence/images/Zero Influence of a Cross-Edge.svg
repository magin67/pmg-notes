<text xml:space="preserve" x="533.0" y="318.0" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1/4</text>
<line x1="463.0" y1="430.0" x2="267.0" y2="430.0" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="365.0" y="463.0" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1/4</text>
<line x1="245.0" y1="212.0" x2="245.0" y2="408.0" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="197.0" y="318.0" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1/4</text>
<line x1="469.44365081389594" y1="205.55634918610406" x2="260.55634918610406" y2="414.44365081389594" stroke="#a7b3bb" stroke-width="3"/>
<circle cx="245.0" cy="190.0" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="245.0" y="197.0" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a</text>
<circle cx="485.0" cy="190.0" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="485.0" y="197.0" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">b</text>
