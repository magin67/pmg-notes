<circle cx="245.0" cy="430.0" r="18" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="245.0" y="437.0" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">d</text>
<rect x="650" y="205" width="410" height="210" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="855" y="251" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Coupling bd</text>
<text xml:space="preserve" x="855" y="311" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">c = 1</text>
<text xml:space="preserve" x="855" y="371" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">m = 0</text>
