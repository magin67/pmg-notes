<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title"><title id="title">Zero Influence of a Cross-Edge</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="580" fill="white"/>
<text xml:space="preserve" x="560" y="45" font-size="29" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">The cross-edge exists and contributes zero</text>
<text xml:space="preserve" x="560" y="94" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">f = [(ac)]²</text>
<line x1="267.0" y1="190.0" x2="463.0" y2="190.0" stroke="#24628a" stroke-width="3"/>
