<text xml:space="preserve" x="560" y="535" font-size="22" fill="#647481" style="fill:#647481" font-weight="400" text-anchor="middle">Edge labels are conductances; each probe starts with c = 1</text>
<text xml:space="preserve" x="560" y="582" font-size="25" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Adding separate effects: 1 − 1/7 − 1/7 = 5/7</text>
<text xml:space="preserve" x="560" y="625" font-size="27" fill="#b56414" style="fill:#b56414" font-weight="600" text-anchor="middle">Simultaneous result: 2/3 ≠ 5/7</text>
