<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title"><title id="title">One Pair and Two Edge Influences</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="570" fill="white"/>
<text xml:space="preserve" x="560" y="45" font-size="29" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">One pair gives two edge influences</text>
<text xml:space="preserve" x="560" y="94" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">f = [(abc)]²,   c = 1</text>
<line x1="193.0" y1="185.0" x2="537.0" y2="185.0" stroke="#24628a" stroke-width="3"/>
<line x1="583.0" y1="185.0" x2="927.0" y2="185.0" stroke="#24628a" stroke-width="3"/>
<circle cx="170" cy="185" r="20" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="170" y="192" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a</text>
<circle cx="560" cy="185" r="20" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="560" y="192" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">b</text>
<circle cx="950" cy="185" r="20" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="950" y="192" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">c</text>
<text xml:space="preserve" x="365" y="162" font-size="24" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1</text>
<text xml:space="preserve" x="755" y="162" font-size="24" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1</text>
<rect x="375" y="245" width="370" height="90" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="496.5" y="298" font-size="29" fill="#b56414" style="fill:#b56414" font-weight="600" text-anchor="start">m</text>
<text xml:space="preserve" x="522.5" y="304.67" font-size="20" fill="#b56414" style="fill:#b56414" font-weight="600" text-anchor="start">ab,bc</text>
<text xml:space="preserve" x="574.5" y="298" font-size="29" fill="#b56414" style="fill:#b56414" font-weight="600" text-anchor="start"> = 1</text>
<path d="M440 345 V365 H280 V395" fill="none" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M680 345 V365 H840 V395" fill="none" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="100" y="405" width="360" height="80" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<rect x="660" y="405" width="360" height="80" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="235.0" y="453" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">A</text>
<text xml:space="preserve" x="254.0" y="459.67" font-size="20" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">ab</text>
<text xml:space="preserve" x="276.0" y="453" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> = 1</text>
<text xml:space="preserve" x="795.5" y="453" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">A</text>
<text xml:space="preserve" x="814.5" y="459.67" font-size="20" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start">bc</text>
<text xml:space="preserve" x="835.5" y="453" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="start"> = 1</text>
<text xml:space="preserve" x="560" y="540" font-size="28" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">Σ m = N(f) = 1;    Σ A = 2N(f) = 2</text>
</svg>
