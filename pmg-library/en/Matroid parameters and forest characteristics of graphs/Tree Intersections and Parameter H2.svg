<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
<title id="title">Intersection of two independently sampled trees</title>
<desc id="desc">Nine ordered pairs of the triangle's three trees. Each cell shows common edges and the sum of their conductor resistances. The average weighted by products of tree probabilities is 84/121.</desc>
