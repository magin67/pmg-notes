<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
<title id="title">Why each 2-forest is counted exactly once</title>
<desc id="desc">A fixed 2-forest with components A={q,a} and B={b,c,d}. In B one can choose 3 vertices or delete 2 edges. After restoring weights, the difference of contributions is (3-2)w(F)=w(F).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="context-stroke" stroke-width="1.8"/></marker></defs>
