<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="title desc">
<title id="title">A shared edge: three different gluing laws</title>
<desc id="desc">Two unit-weight triangles are glued at vertices a,b. Both copies of edge ab are kept in parallel, identified as one unit-weight edge, or deleted. The corresponding spanning-tree counts are 12, 8, and 4.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="context-stroke" stroke-width="1.8"/></marker></defs>
<rect width="960" height="475" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text id="text6" x="30" y="39" font-size="27" fill="#203444" text-anchor="start" font-weight="700">A shared edge: three different gluing laws</text>
<text id="text7" x="30" y="72" font-size="18" fill="#566b7b" text-anchor="start" font-weight="400">Two unit-weight triangles; the rule for copies of edge ab is specified separately.</text>
<rect x="24" y="101" width="288" height="314" rx="12" fill="#f3f6f9" stroke="none"/>
<text id="text9" x="168" y="137" font-size="20" fill="#203444" text-anchor="middle" font-weight="700">Keep both copies</text>
<line x1="80" y1="261" x2="168" y2="182" stroke="#2767ad" stroke-width="4" stroke-linecap="round"/>
<line x1="168" y1="182" x2="256" y2="261" stroke="#2767ad" stroke-width="4" stroke-linecap="round"/>
<line x1="80" y1="261" x2="168" y2="342" stroke="#167f77" stroke-width="4" stroke-linecap="round"/>
<line x1="168" y1="342" x2="256" y2="261" stroke="#167f77" stroke-width="4" stroke-linecap="round"/>
<path d="M 80 261 Q 168 219 256 261" fill="none" stroke="#2767ad" stroke-width="4"/>
<text id="text15" x="168" y="236" font-size="19" fill="#2767ad" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">1</text>
<path d="M 80 261 Q 168 303 256 261" fill="none" stroke="#167f77" stroke-width="4"/>
<text id="text17" x="168" y="299" font-size="19" fill="#167f77" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">1</text>
<circle cx="80" cy="261" r="13" fill="white" stroke="#b97716" stroke-width="2.8"/>
<circle cx="80" cy="261" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text20" x="59" y="267" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">a</text>
<circle cx="256" cy="261" r="13" fill="white" stroke="#b97716" stroke-width="2.8"/>
<circle cx="256" cy="261" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text23" x="277" y="267" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">b</text>
<circle cx="168" cy="182" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text25" x="168" y="166" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">x</text>
<circle cx="168" cy="342" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text27" x="168" y="367" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">y</text>
<text id="text28" x="168" y="396" font-size="25" fill="#203444" text-anchor="middle" font-weight="700">τ = 12</text>
<rect x="336" y="101" width="288" height="314" rx="12" fill="#f3f6f9" stroke="none"/>
<text id="text30" x="480" y="137" font-size="20" fill="#203444" text-anchor="middle" font-weight="700">One edge, c = 1</text>
<line x1="392" y1="261" x2="480" y2="182" stroke="#2767ad" stroke-width="4" stroke-linecap="round"/>
<line x1="480" y1="182" x2="568" y2="261" stroke="#2767ad" stroke-width="4" stroke-linecap="round"/>
<line x1="392" y1="261" x2="480" y2="342" stroke="#167f77" stroke-width="4" stroke-linecap="round"/>
<line x1="480" y1="342" x2="568" y2="261" stroke="#167f77" stroke-width="4" stroke-linecap="round"/>
<line x1="392" y1="261" x2="568" y2="261" stroke="#b97716" stroke-width="4" stroke-linecap="round"/>
<text id="text36" x="480" y="249" font-size="19" fill="#b97716" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">1</text>
<circle cx="392" cy="261" r="13" fill="white" stroke="#b97716" stroke-width="2.8"/>
<circle cx="392" cy="261" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text39" x="371" y="267" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">a</text>
<circle cx="568" cy="261" r="13" fill="white" stroke="#b97716" stroke-width="2.8"/>
<circle cx="568" cy="261" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text42" x="589" y="267" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">b</text>
<circle cx="480" cy="182" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text44" x="480" y="166" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">x</text>
<circle cx="480" cy="342" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text46" x="480" y="367" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">y</text>
<text id="text47" x="480" y="396" font-size="25" fill="#203444" text-anchor="middle" font-weight="700">τ = 8</text>
<rect x="648" y="101" width="288" height="314" rx="12" fill="#f3f6f9" stroke="none"/>
<text id="text49" x="792" y="137" font-size="20" fill="#203444" text-anchor="middle" font-weight="700">Delete both copies</text>
<line x1="704" y1="261" x2="792" y2="182" stroke="#2767ad" stroke-width="4" stroke-linecap="round"/>
<line x1="792" y1="182" x2="880" y2="261" stroke="#2767ad" stroke-width="4" stroke-linecap="round"/>
<line x1="704" y1="261" x2="792" y2="342" stroke="#167f77" stroke-width="4" stroke-linecap="round"/>
<line x1="792" y1="342" x2="880" y2="261" stroke="#167f77" stroke-width="4" stroke-linecap="round"/>
<circle cx="704" cy="261" r="13" fill="white" stroke="#b97716" stroke-width="2.8"/>
<circle cx="704" cy="261" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text56" x="683" y="267" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">a</text>
<circle cx="880" cy="261" r="13" fill="white" stroke="#b97716" stroke-width="2.8"/>
<circle cx="880" cy="261" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text59" x="901" y="267" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">b</text>
<circle cx="792" cy="182" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text61" x="792" y="166" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">x</text>
<circle cx="792" cy="342" r="7" fill="white" stroke="#203444" stroke-width="2.5"/>
<text id="text63" x="792" y="367" font-size="19" fill="#203444" text-anchor="middle" font-weight="400" stroke="white" stroke-width="7" stroke-linejoin="round" paint-order="stroke fill">y</text>
<text id="text64" x="792" y="396" font-size="25" fill="#203444" text-anchor="middle" font-weight="700">τ = 4</text>
<text id="text65" x="480" y="452" font-size="20" fill="#566b7b" text-anchor="middle" font-weight="400">Two parallel copies can be replaced by one edge with c = 2.</text>
</g>
</svg>
