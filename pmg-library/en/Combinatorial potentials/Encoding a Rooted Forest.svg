<svg xmlns="http://www.w3.org/2000/svg" width="930" height="370" viewBox="0 0 930 370" role="img" aria-labelledby="title"><title id="title">Deleting ordinary leaves: rooted-forest code b, alpha, d, beta</title>
<style>text{font-family:DejaVu Sans,Arial,sans-serif}</style>
<rect width="930" height="370" fill="white"/>
<rect x="15" y="15" width="440" height="340" rx="12" fill="#fafbfc" stroke="#d0d5dd"/>
<rect x="475" y="15" width="440" height="340" rx="12" fill="#fafbfc" stroke="#d0d5dd"/>
<text x="235" y="49" font-size="22" fill="#243447" font-weight="600" text-anchor="middle">Forest with prescribed roots</text>
<line x1="70" y1="116" x2="231" y2="116" stroke="#386a90" stroke-width="3" stroke-linecap="round"/>
<line x1="231" y1="116" x2="395" y2="116" stroke="#386a90" stroke-width="3" stroke-linecap="round"/>
<line x1="70" y1="255" x2="231" y2="255" stroke="#386a90" stroke-width="3" stroke-linecap="round"/>
<line x1="231" y1="255" x2="395" y2="255" stroke="#386a90" stroke-width="3" stroke-linecap="round"/>
<circle cx="70" cy="116" r="16" fill="white" stroke="#243447" stroke-width="2"/>
<text x="70" y="122" font-size="18" fill="#243447" font-weight="400" text-anchor="middle">a</text>
<circle cx="231" cy="116" r="16" fill="white" stroke="#243447" stroke-width="2"/>
<text x="231" y="122" font-size="18" fill="#243447" font-weight="400" text-anchor="middle">b</text>
<circle cx="395" cy="116" r="16" fill="#fff1da" stroke="#ab6419" stroke-width="2"/>
<text x="395" y="122" font-size="18" fill="#ab6419" font-weight="400" text-anchor="middle">α</text>
<circle cx="70" cy="255" r="16" fill="white" stroke="#243447" stroke-width="2"/>
<text x="70" y="261" font-size="18" fill="#243447" font-weight="400" text-anchor="middle">c</text>
<circle cx="231" cy="255" r="16" fill="white" stroke="#243447" stroke-width="2"/>
<text x="231" y="261" font-size="18" fill="#243447" font-weight="400" text-anchor="middle">d</text>
<circle cx="395" cy="255" r="16" fill="#fff1da" stroke="#ab6419" stroke-width="2"/>
<text x="395" y="261" font-size="18" fill="#ab6419" font-weight="400" text-anchor="middle">β</text>
<text x="70" y="159" font-size="17" fill="#667085" font-weight="400" text-anchor="middle">1</text>
<text x="231" y="159" font-size="17" fill="#667085" font-weight="400" text-anchor="middle">2</text>
<text x="70" y="298" font-size="17" fill="#667085" font-weight="400" text-anchor="middle">3</text>
<text x="231" y="298" font-size="17" fill="#667085" font-weight="400" text-anchor="middle">4</text>
<text x="235" y="326" font-size="17" fill="#667085" font-weight="400" text-anchor="middle">Numbers 1–4: deletion order</text>
<text x="695" y="49" font-size="22" fill="#243447" font-weight="600" text-anchor="middle">Record the leaf's neighbour</text>
<text x="695" y="96" font-size="22" fill="#243447" font-weight="400" text-anchor="middle">a → b</text>
<text x="695" y="141" font-size="22" fill="#243447" font-weight="400" text-anchor="middle">b → α</text>
<text x="695" y="186" font-size="22" fill="#243447" font-weight="400" text-anchor="middle">c → d</text>
<text x="695" y="231" font-size="22" fill="#243447" font-weight="400" text-anchor="middle">d → β</text>
<text x="695" y="308" font-size="23" fill="#243447" font-weight="600" text-anchor="middle">Code: (b, α, d; β)</text>
</svg>
