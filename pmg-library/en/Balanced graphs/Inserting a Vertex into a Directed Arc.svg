<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Inserting a vertex into a directed arc</title><desc id="desc">An arc a to c of weight q is replaced by successive arcs a to b and b to c of weight q. Vertex b is new. The variation is -q[(ab),(bc)].</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2666a6"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b55a17"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#647586"/></marker>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#203244"/></marker>
</defs>
<rect width="1000" height="300" rx="14" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif" fill="#203244">
<rect x="16" y="16" width="440" height="220" rx="12" fill="#f6f8fb" stroke="#dde4ec"/>
<rect x="544" y="16" width="440" height="220" rx="12" fill="#f6f8fb" stroke="#dde4ec"/>
<text x="236" y="54" text-anchor="middle" font-size="23" fill="#203244" font-weight="bold" font-style="normal">An arc of weight q</text>
<text x="764" y="54" text-anchor="middle" font-size="23" fill="#203244" font-weight="bold" font-style="normal">Two arcs of weight q</text>
<line x1="97.00" y1="145.00" x2="375.00" y2="145.00" stroke="#2666a6" stroke-width="3" marker-end="url(#blue)"/>
<text x="236" y="126" text-anchor="middle" font-size="22" fill="#203244" font-weight="normal" font-style="italic">q</text>
<circle cx="80" cy="145" r="9" fill="white" stroke="#203244" stroke-width="2"/>
<text x="80" y="175" text-anchor="middle" font-size="23" fill="#203244" font-weight="normal" font-style="italic">a</text>
<circle cx="392" cy="145" r="9" fill="white" stroke="#203244" stroke-width="2"/>
<text x="392" y="175" text-anchor="middle" font-size="23" fill="#203244" font-weight="normal" font-style="italic">c</text>
<line x1="617.00" y1="145.00" x2="747.00" y2="145.00" stroke="#2666a6" stroke-width="3" marker-end="url(#blue)"/>
<line x1="781.00" y1="145.00" x2="911.00" y2="145.00" stroke="#2666a6" stroke-width="3" marker-end="url(#blue)"/>
<circle cx="600" cy="145" r="9" fill="white" stroke="#203244" stroke-width="2"/>
<text x="600" y="175" text-anchor="middle" font-size="23" fill="#203244" font-weight="normal" font-style="italic">a</text>
<circle cx="764" cy="145" r="9" fill="white" stroke="#b55a17" stroke-width="2"/>
<text x="764" y="175" text-anchor="middle" font-size="23" fill="#203244" font-weight="normal" font-style="italic">b</text>
<circle cx="928" cy="145" r="9" fill="white" stroke="#203244" stroke-width="2"/>
<text x="928" y="175" text-anchor="middle" font-size="23" fill="#203244" font-weight="normal" font-style="italic">c</text>
<text x="682" y="126" text-anchor="middle" font-size="22" fill="#203244" font-weight="normal" font-style="italic">q</text>
<text x="846" y="126" text-anchor="middle" font-size="22" fill="#203244" font-weight="normal" font-style="italic">q</text>
<line x1="471.00" y1="145.00" x2="529.00" y2="145.00" stroke="#203244" stroke-width="3" marker-end="url(#ink)"/>
<text x="500" y="279" text-anchor="middle" font-size="25" fill="#203244" font-weight="bold" font-style="normal">ΔL = −q[(ab),(bc)]</text>
</g></svg>
