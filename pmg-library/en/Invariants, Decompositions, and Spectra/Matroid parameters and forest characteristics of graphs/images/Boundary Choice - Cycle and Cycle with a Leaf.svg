<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">Changing the boundary changes the resulting matroid</title>
<desc id="desc">One path P4 with two boundary markings. Adding a two-edge path between its endpoints gives C5; adding it between vertices at distance two edges gives C4 with a leaf. Spanning-tree counts are 5 and 4, radii 2/5 and 9/16.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="context-stroke" stroke-width="1.8"/></marker></defs>
