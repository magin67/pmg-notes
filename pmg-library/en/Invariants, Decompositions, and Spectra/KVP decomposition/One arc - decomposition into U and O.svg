<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="438" viewBox="0 0 1020 438" role="img" aria-labelledby="title desc"><title id="title">One arc - decomposition into U and O</title><desc id="desc">The skew-symmetric part of one arc is the sum of a gradient table and a triangular circulation. Their entries cancel on the new pairs.</desc><defs><marker id="blue" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#245d91" /></marker><marker id="red" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3482b" /></marker></defs><rect width="100%" height="100%" fill="white" /><text x="25" y="30" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#182b40" text-anchor="start" dominant-baseline="middle" font-weight="bold">One arc a → b on three vertices: H = U + O</text><g transform="translate(20,64)"><rect width="300" height="285" rx="12" fill="white" stroke="#d7e0e8" /><text x="150" y="27" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">H: skew-symmetric part</text><path d="M 161.24 107.74 L 232.69 220.57" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><rect x="161.0" y="159.6" width="46" height="28" rx="5" fill="white" /><text x="183.98289479113234" y="173.56083329894952" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1/2</text><circle cx="150" cy="90" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="150" y="91" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">a</text><circle cx="245" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="245" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">b</text><circle cx="55" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="55" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">c</text></g><text x="340" y="211" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="normal">=</text><g transform="translate(360,64)"><rect width="300" height="285" rx="12" fill="white" stroke="#d7e0e8" /><text x="150" y="27" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">U: vertex differences</text><path d="M 161.24 107.74 L 232.69 220.57" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><rect x="161.0" y="159.6" width="46" height="28" rx="5" fill="white" /><text x="183.98289479113234" y="173.56083329894952" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1/3</text><path d="M 138.76 107.74 L 67.31 220.57" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><rect x="66.0" y="142.4" width="46" height="28" rx="5" fill="white" /><text x="88.98289479113234" y="156.43916670105048" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1/6</text><path d="M 76.00 240.00 L 222.00 240.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><rect x="127.0" y="242.0" width="46" height="28" rx="5" fill="white" /><text x="150.0" y="256.0" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1/6</text><circle cx="150" cy="90" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="150" y="91" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">a</text><circle cx="245" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="245" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">b</text><circle cx="55" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="55" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">c</text></g><text x="680" y="211" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="normal">+</text><g transform="translate(700,64)"><rect width="300" height="285" rx="12" fill="white" stroke="#d7e0e8" /><text x="150" y="27" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">O: circulation</text><path d="M 161.24 107.74 L 232.69 220.57" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><rect x="161.0" y="159.6" width="46" height="28" rx="5" fill="white" /><text x="183.98289479113234" y="173.56083329894952" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1/6</text><path d="M 224.00 240.00 L 78.00 240.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><rect x="127.0" y="210.0" width="46" height="28" rx="5" fill="white" /><text x="150.0" y="224.0" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1/6</text><path d="M 66.24 222.26 L 137.69 109.43" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><rect x="93.0" y="159.6" width="46" height="28" rx="5" fill="white" /><text x="116.01710520886766" y="173.56083329894952" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">1/6</text><circle cx="150" cy="90" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="150" y="91" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">a</text><circle cx="245" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="245" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">b</text><circle cx="55" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="55" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">c</text></g><text x="25" y="381" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40" text-anchor="start" dominant-baseline="middle" font-weight="normal">An arrow labeled t means coefficient +t along it and −t in reverse.</text><text x="25" y="410" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40" text-anchor="start" dominant-baseline="middle" font-weight="normal">On absent pairs ac and bc, the U- and O-contributions cancel.</text></svg>
