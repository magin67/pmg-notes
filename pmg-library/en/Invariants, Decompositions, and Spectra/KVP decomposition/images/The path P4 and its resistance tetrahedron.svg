<text x="780.00" y="500.00" font-size="20" fill="#20344a" text-anchor="middle">The three path steps are orthogonal in 3D</text>
<text x="560.00" y="585.00" font-size="25" fill="#20344a" text-anchor="middle">(ab)·(cd) = 0;   (ac)·(bd) = 1;   (ad)·(bc) = 1</text>
<text x="560.00" y="628.00" font-size="27" fill="#28638c" text-anchor="middle" font-weight="bold">H₄ = 1 + 4 + 3 − (0 + 1 + 1) = 6</text>
