<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="title desc">
<title id="title">Oriented boundary of a triangle</title>
<desc id="desc">The formal oriented sides run from a to b, b to c, and c to a. Their sum is [ab]+[bc]+[ca]=[bc]-[ac]+[ab]. Applying the boundary again gives zero.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
<rect width="720" height="370" rx="12" fill="#fff"/>
<path d="M120 265L600 265L360 70Z" fill="#eff6ff"/>
<g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)">
<path d="M140 265H578"/><path d="M584 252L377 84"/><path d="M344 83L137 251"/>
</g>
<g font-family="Arial, sans-serif" fill="#172b4d" text-anchor="middle">
<text x="360" y="30" font-size="21" font-weight="bold">Boundary: oriented sides</text>
<text x="360" y="303" font-size="23">[ab]</text>
<text x="526" y="153" font-size="23">[bc]</text>
<text x="161" y="153" font-size="23">[ca] = −[ac]</text>
<circle cx="120" cy="265" r="19" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="120" y="272" font-size="22">a</text><circle cx="600" cy="265" r="19" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="600" y="272" font-size="22">b</text><circle cx="360" cy="70" r="19" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="360" y="77" font-size="22">c</text>
<text x="360" y="348" font-size="21">∂[abc] = [ab] + [bc] + [ca]</text>
</g></svg>
