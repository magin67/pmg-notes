<svg xmlns="http://www.w3.org/2000/svg" width="940" height="370" viewBox="0 0 940 370" role="img" aria-labelledby="title desc">
<title id="title">A path and its resistance simplex</title><desc id="desc">Left: path 1-2-3 with coupling strengths 1 and 2. Right: a right triangle at vertex 2, with lengths 1, 1/sqrt(2), sqrt(3/2). The dashed side 1-3 is not an edge of the original graph.</desc>
<rect width="940" height="370" rx="12" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172b4d" text-anchor="middle">
<text x="220" y="35" font-size="21" font-weight="bold">Graph: coupling strengths</text>
<text x="705" y="35" font-size="21" font-weight="bold">Simplex: lengths</text>
<path d="M90 185H102 M188 185H200 M240 185H252 M338 185H350" stroke="#2563eb" stroke-width="3" fill="none"/>
<rect x="102" y="166" width="86" height="38" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5"/><rect x="252" y="166" width="86" height="38" fill="#f1f5f9" stroke="#2563eb" stroke-width="2.5"/>
<text x="145" y="192" font-size="18">c₁₂ = 1</text><text x="295" y="192" font-size="18">c₂₃ = 2</text>
<circle cx="70" cy="185" r="20" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="70" y="192" font-size="21">1</text><circle cx="220" cy="185" r="20" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="220" y="192" font-size="21">2</text><circle cx="370" cy="185" r="20" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="370" y="192" font-size="21">3</text>
<text x="220" y="256" font-size="18" fill="#475569">No direct edge between 1 and 3</text>
<path d="M600 90.294V260H840" stroke="#2563eb" stroke-width="4" fill="none"/>
<path d="M600 90.294L840 260" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
<path d="M600 241H619V260" stroke="#475569" stroke-width="2" fill="none"/>
<circle cx="600" cy="260" r="16" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="600" y="267" font-size="20">2</text><circle cx="840" cy="260" r="16" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="840" y="267" font-size="20">1</text><circle cx="600" cy="90.294" r="16" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><text x="600" y="97.294" font-size="20">3</text>
<text x="720" y="299" font-size="23">1</text><text x="548" y="182" font-size="23">1/√2</text>
<text x="763" y="148" font-size="23">√(3/2)</text>
<line x1="460" y1="55" x2="460" y2="310" stroke="#e2e8f0" stroke-width="2"/>
<text x="470" y="345" font-size="20">R₁₂ = 1,   R₂₃ = 1/2,   R₁₃ = 3/2</text>
</g></svg>
