    <circle cx="268" cy="135" r="12" fill="#fff" stroke="#183744" stroke-width="2"/>
    <text x="268" y="140" font-size="16" fill="#183744" font-weight="600">a</text>
    <circle cx="352" cy="135" r="12" fill="#fff" stroke="#183744" stroke-width="2"/>
    <text x="352" y="140" font-size="16" fill="#183744" font-weight="600">b</text>
    <circle cx="310" cy="85" r="12" fill="#fff" stroke="#183744" stroke-width="2"/>
