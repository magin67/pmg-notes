<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="490" viewBox="0 0 1160 490" role="img" aria-labelledby="title desc">
<title id="title">The path and star on four vertices</title>
<desc id="desc">The path has two adjacent edge pairs and one independent pair. The star has three adjacent pairs and no independent pairs.</desc>
<rect width="1160" height="490" fill="#fff"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#172638}.title{font-size:26px;font-weight:700}.label{font-size:22px}.small{font-size:19px}.accent{fill:#235e97;font-weight:700}.edge{stroke:#235e97;stroke-width:5;stroke-linecap:round}.node{fill:#fff;stroke:#235e97;stroke-width:3}</style>
<rect x="20" y="20" width="550" height="450" rx="16" fill="#f5f8fc" stroke="#d5dfe9"/>
<rect x="590" y="20" width="550" height="450" rx="16" fill="#f5f8fc" stroke="#d5dfe9"/>
<text x="295" y="66" text-anchor="middle" class="title">Path P₄</text>
<text x="865" y="66" text-anchor="middle" class="title">Star K₁,₃</text>
<line x1="100" y1="187" x2="230" y2="187" class="edge"/>
<line x1="230" y1="187" x2="360" y2="187" class="edge"/>
<line x1="360" y1="187" x2="490" y2="187" class="edge"/>
<circle cx="100" cy="187" r="10" class="node"/>
<text x="100" y="163" text-anchor="middle" class="label">a</text>
<circle cx="230" cy="187" r="10" class="node"/>
<text x="230" y="163" text-anchor="middle" class="label">b</text>
<circle cx="360" cy="187" r="10" class="node"/>
<text x="360" y="163" text-anchor="middle" class="label">c</text>
<circle cx="490" cy="187" r="10" class="node"/>
<text x="490" y="163" text-anchor="middle" class="label">d</text>
<line x1="865" y1="116" x2="865" y2="202" class="edge"/>
<line x1="865" y1="202" x2="750" y2="260" class="edge"/>
<line x1="865" y1="202" x2="980" y2="260" class="edge"/>
<circle cx="865" cy="116" r="10" class="node"/>
<text x="865" y="92" text-anchor="middle" class="label">a</text>
<circle cx="865" cy="202" r="10" class="node"/>
<text x="865" y="242" text-anchor="middle" class="label">b</text>
<circle cx="750" cy="260" r="10" class="node"/>
<text x="750" y="236" text-anchor="middle" class="label">c</text>
<circle cx="980" cy="260" r="10" class="node"/>
<text x="980" y="236" text-anchor="middle" class="label">d</text>
<text x="295" y="332" text-anchor="middle" class="label accent">Adjacent pairs: 2</text>
<text x="295" y="368" text-anchor="middle" class="label">Independent pairs: 1</text>
<text x="295" y="423" text-anchor="middle" class="small">Second column: 2 + 1 = 3</text>
<text x="865" y="332" text-anchor="middle" class="label accent">Adjacent pairs: 3</text>
<text x="865" y="368" text-anchor="middle" class="label">Independent pairs: 0</text>
<text x="865" y="423" text-anchor="middle" class="small">Second column: 3 + 0 = 3</text>
</svg>

