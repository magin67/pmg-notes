<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="title desc">
<title id="title">Projections onto the Line of Selected Vertices</title>
<desc id="desc">Two exact sections of the resistance tetrahedron a,x,y,b. On the left, x projects onto line ab with coefficient 3/11 and squared height 4/11. On the right, the coefficient for y is 9/11 and the squared height is 3/11. The squared length of ab is 11/6. Both sections use the same scale. Numbers beside the sides denote squared distances. The section planes are distinct.</desc>
<rect width="100%" height="100%" rx="12" fill="white"/>
<g font-family="Arial, DejaVu Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><path d="M480.000,20.000 L480.000,455.000" fill="none" stroke="#e2e8f0" stroke-width="1.5"/><text x="240.000" y="35.000" text-anchor="middle" font-size="22" fill="#24364b">Section through a, x, b</text><path d="M52.000,310 L151.704,147.184 L417.582,310 Z" fill="#f6f9fc"/><path d="M52.000,310.000 L151.704,147.184" fill="none" stroke="#60758b" stroke-width="2.5"/><path d="M151.704,147.184 L417.582,310.000" fill="none" stroke="#60758b" stroke-width="2.5"/><path d="M37.000,310.000 L432.582,310.000" fill="none" stroke="#2563a6" stroke-width="2.5"/><path d="M151.704,147.184 L151.704,310.000" fill="none" stroke="#ad4937" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M163.704,310 V298 H151.704" fill="none" stroke="#ad4937" stroke-width="1.5"/><circle cx="52.000" cy="310.000" r="6" stroke="#24364b" stroke-width="2.5" fill="white"/><text x="52.000" y="340.000" text-anchor="middle" font-size="22" fill="#24364b">a</text><circle cx="417.582" cy="310.000" r="6" stroke="#24364b" stroke-width="2.5" fill="white"/><text x="417.582" y="340.000" text-anchor="middle" font-size="22" fill="#24364b">b</text><circle cx="151.704" cy="147.184" r="6" stroke="#24364b" stroke-width="2.5" fill="white"/><text x="151.704" y="130.184" text-anchor="middle" font-size="22" fill="#24364b">x</text><circle cx="151.704" cy="310.000" r="5" stroke="#2563a6" stroke-width="2.5" fill="white"/><text x="151.704" y="341.000" text-anchor="middle" font-size="22" fill="#2563a6">q<tspan baseline-shift="sub" font-size="15.399999999999999">x</tspan></text><text x="216.704" y="228.592" text-anchor="middle" font-size="18" fill="#ad4937">r<tspan baseline-shift="sub" font-size="12.6">x</tspan><tspan baseline-shift="super" font-size="12.6">2</tspan> = 4/11</text><text x="72.852" y="228.592" text-anchor="middle" font-size="18" fill="#60758b">1/2</text><text x="312.643" y="228.592" text-anchor="middle" font-size="18" fill="#60758b">4/3</text><text x="240.000" y="386.000" text-anchor="middle" font-size="20" fill="#2563a6">(b − a)<tspan baseline-shift="super" font-size="14.0">2</tspan> = 11/6</text><text x="240.000" y="431.000" text-anchor="middle" font-size="22" fill="#24364b">q<tspan baseline-shift="sub" font-size="15.399999999999999">x</tspan> = (8a + 3b)/11</text><text x="720.000" y="35.000" text-anchor="middle" font-size="22" fill="#24364b">Section through a, y, b</text><path d="M532.000,310 L831.112,168.997 L897.582,310 Z" fill="#f6f9fc"/><path d="M532.000,310.000 L831.112,168.997" fill="none" stroke="#60758b" stroke-width="2.5"/><path d="M831.112,168.997 L897.582,310.000" fill="none" stroke="#60758b" stroke-width="2.5"/><path d="M517.000,310.000 L912.582,310.000" fill="none" stroke="#2563a6" stroke-width="2.5"/><path d="M831.112,168.997 L831.112,310.000" fill="none" stroke="#ad4937" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M843.112,310 V298 H831.112" fill="none" stroke="#ad4937" stroke-width="1.5"/><circle cx="532.000" cy="310.000" r="6" stroke="#24364b" stroke-width="2.5" fill="white"/><text x="532.000" y="340.000" text-anchor="middle" font-size="22" fill="#24364b">a</text><circle cx="897.582" cy="310.000" r="6" stroke="#24364b" stroke-width="2.5" fill="white"/><text x="897.582" y="340.000" text-anchor="middle" font-size="22" fill="#24364b">b</text><circle cx="831.112" cy="168.997" r="6" stroke="#24364b" stroke-width="2.5" fill="white"/><text x="831.112" y="151.997" text-anchor="middle" font-size="22" fill="#24364b">y</text><circle cx="831.112" cy="310.000" r="5" stroke="#2563a6" stroke-width="2.5" fill="white"/><text x="831.112" y="341.000" text-anchor="middle" font-size="22" fill="#2563a6">q<tspan baseline-shift="sub" font-size="15.399999999999999">y</tspan></text><text x="766.112" y="239.499" text-anchor="middle" font-size="18" fill="#ad4937">r<tspan baseline-shift="sub" font-size="12.6">y</tspan><tspan baseline-shift="super" font-size="12.6">2</tspan> = 3/11</text><text x="652.556" y="239.499" text-anchor="middle" font-size="18" fill="#60758b">3/2</text><text x="892.347" y="239.499" text-anchor="middle" font-size="18" fill="#60758b">1/3</text><text x="720.000" y="386.000" text-anchor="middle" font-size="20" fill="#2563a6">(b − a)<tspan baseline-shift="super" font-size="14.0">2</tspan> = 11/6</text><text x="720.000" y="431.000" text-anchor="middle" font-size="22" fill="#24364b">q<tspan baseline-shift="sub" font-size="15.399999999999999">y</tspan> = (2a + 9b)/11</text></g>
</svg>