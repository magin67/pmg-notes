<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">Attaching a core and transferring the active boundary</title><desc id="desc">The shared edge stays in the old fragment. Input marks are removed after assembly, while the output is retained. Inset: an isolated input vertex for a three-vertex seam.</desc>
