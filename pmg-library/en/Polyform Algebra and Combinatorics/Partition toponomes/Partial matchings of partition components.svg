<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
<title id="title">Seven matchings in the product (1²)*(1²)</title>
<desc id="desc">Each factor has two parts of weight one. The left column has one empty matching, of type (1⁴). The middle column has four single-pair matchings, each of type (2,1²). The right column has two bijections between the pairs of parts, each of type (2²). Blue circles belong to the first factor, orange circles to the second; lines indicate matchings only.</desc>
