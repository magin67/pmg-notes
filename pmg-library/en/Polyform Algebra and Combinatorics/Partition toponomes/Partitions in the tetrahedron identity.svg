<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">Partitions in the tetrahedron identity</title>
<desc id="desc">Top row: ab|cd, ac|bd, ad|bc. Bottom row: abc|d, abd|c, acd|b, bcd|a. Every diagram has four vertices. The upper partitions have type (1²), and the lower ones type (2). Triangles represent three-vertex blocks, not edge sets of spanning forests.</desc>
