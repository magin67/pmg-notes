<text x="480" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#172b3a">Seven partitions in the tetrahedron identity</text>
<text x="480" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#667785">In every diagram: n = 4, k = 2, m = 2</text>
<text x="480" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#245e91">Three partitions of type (1²)</text>
