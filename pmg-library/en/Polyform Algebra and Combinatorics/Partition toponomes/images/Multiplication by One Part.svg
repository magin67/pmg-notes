<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title"><title id="title">Multiplication by One Part</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="540" fill="white"/>
<text xml:space="preserve" x="560" y="40" font-size="32" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">(2,1) * (2)</text>
<rect x="20" y="75" width="340" height="380" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="190" y="120" font-size="21" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">No matching</text>
<circle cx="105" cy="195" r="25" fill="white" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="105" y="203" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">2</text>
<circle cx="105" cy="285" r="25" fill="white" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="105" y="293" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">1</text>
<circle cx="270" cy="240" r="25" fill="white" stroke="#aa5d12" stroke-width="3"/>
<text xml:space="preserve" x="270" y="248" font-size="24" fill="#aa5d12" style="fill:#aa5d12" font-weight="600" text-anchor="middle">2</text>
<line x1="190" y1="330" x2="190" y2="375" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="190" y="418" font-size="28" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">(2²,1)</text>
<rect x="390" y="75" width="340" height="380" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="560" y="120" font-size="21" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Match the part of weight 2</text>
<circle cx="475" cy="195" r="25" fill="white" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="475" y="203" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">2</text>
<circle cx="475" cy="285" r="25" fill="white" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="475" y="293" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">1</text>
<circle cx="640" cy="240" r="25" fill="white" stroke="#aa5d12" stroke-width="3"/>
<text xml:space="preserve" x="640" y="248" font-size="24" fill="#aa5d12" style="fill:#aa5d12" font-weight="600" text-anchor="middle">2</text>
<line x1="503" y1="195" x2="612" y2="240" stroke="#647481" stroke-width="3"/>
<line x1="560" y1="330" x2="560" y2="375" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="560" y="418" font-size="28" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">(4,1)</text>
<rect x="760" y="75" width="340" height="380" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text xml:space="preserve" x="930" y="120" font-size="21" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Match the part of weight 1</text>
<circle cx="845" cy="195" r="25" fill="white" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="845" y="203" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">2</text>
<circle cx="845" cy="285" r="25" fill="white" stroke="#24628a" stroke-width="3"/>
<text xml:space="preserve" x="845" y="293" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">1</text>
<circle cx="1010" cy="240" r="25" fill="white" stroke="#aa5d12" stroke-width="3"/>
<text xml:space="preserve" x="1010" y="248" font-size="24" fill="#aa5d12" style="fill:#aa5d12" font-weight="600" text-anchor="middle">2</text>
<line x1="873" y1="285" x2="982" y2="240" stroke="#647481" stroke-width="3"/>
<line x1="930" y1="330" x2="930" y2="375" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="930" y="418" font-size="28" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">(3,2)</text>
<text xml:space="preserve" x="560" y="505" font-size="27" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">(2,1) * (2) = (2²,1) + (4,1) + (3,2)</text>
</svg>
