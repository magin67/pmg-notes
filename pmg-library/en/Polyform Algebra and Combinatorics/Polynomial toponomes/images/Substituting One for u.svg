<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title"><title id="title">Substituting One for u</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#24628a"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="560" fill="white"/>
<text xml:space="preserve" x="560" y="40" font-size="28" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">One connected graph, different reducibility</text>
<line x1="416" y1="115" x2="544" y2="115" stroke="#24628a" stroke-width="4"/>
<line x1="576" y1="115" x2="704" y2="115" stroke="#24628a" stroke-width="4"/>
<circle cx="400" cy="115" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="400" y="122" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a</text>
<circle cx="560" cy="115" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="560" y="122" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">b</text>
<circle cx="720" cy="115" r="16" fill="white" stroke="#203344" stroke-width="2"/>
<text xml:space="preserve" x="720" y="122" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">c</text>
<text xml:space="preserve" x="300" y="200" font-size="25" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Two variables</text>
<text xml:space="preserve" x="890" y="200" font-size="25" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">One variable</text>
<text xml:space="preserve" x="50" y="290" font-size="32" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">F</text>
<text xml:space="preserve" x="315" y="290" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1 + 2tu + t²u</text>
<line x1="555" y1="280" x2="705" y2="280" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="630" y="256" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">u = 1</text>
<text xml:space="preserve" x="905" y="290" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">(1 + t)²</text>
<text xml:space="preserve" x="50" y="415" font-size="32" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">P</text>
<text xml:space="preserve" x="315" y="415" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">1 + 4tu + 3t²u</text>
<line x1="555" y1="405" x2="705" y2="405" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="630" y="381" font-size="23" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">u = 1</text>
<text xml:space="preserve" x="905" y="415" font-size="29" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">(1 + t)(1 + 3t)</text>
<text xml:space="preserve" x="315" y="510" font-size="25" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">Irreducible over C</text>
<text xml:space="preserve" x="905" y="510" font-size="25" fill="#aa5d12" style="fill:#aa5d12" font-weight="600" text-anchor="middle">New factors appear</text>
</svg>
