<text xml:space="preserve" x="180" y="110" font-size="24" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Individual types</text>
<text xml:space="preserve" x="560" y="110" font-size="24" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">One pair (k, r)</text>
<text xml:space="preserve" x="940" y="110" font-size="24" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">One grade k</text>
<text xml:space="preserve" x="180" y="210" font-size="24" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Without root choices</text>
<text xml:space="preserve" x="180" y="415" font-size="24" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">With root choices</text>
<text xml:space="preserve" x="145" y="253" font-size="28" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">T</text>
<text xml:space="preserve" x="170" y="240" font-size="17" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">vec</text>
<text xml:space="preserve" x="210" y="253" font-size="28" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">(x)</text>
<text xml:space="preserve" x="145" y="458" font-size="28" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">T</text>
<text xml:space="preserve" x="170" y="445" font-size="17" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">vert</text>
<text xml:space="preserve" x="210" y="458" font-size="28" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">(x)</text>
<text xml:space="preserve" x="560" y="215" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">F(t, u)</text>
<text xml:space="preserve" x="560" y="255" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">a(k, r)</text>
<text xml:space="preserve" x="560" y="420" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">P(t, u)</text>
<text xml:space="preserve" x="560" y="460" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">b(k, r)</text>
<text xml:space="preserve" x="940" y="215" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">F(t)</text>
<text xml:space="preserve" x="940" y="255" font-size="27" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">f(k)</text>
<text xml:space="preserve" x="940" y="413" font-size="26" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">P(t)</text>
<text xml:space="preserve" x="940" y="455" font-size="26" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">det(I + tL)</text>
<line x1="340" y1="232" x2="400" y2="232" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
