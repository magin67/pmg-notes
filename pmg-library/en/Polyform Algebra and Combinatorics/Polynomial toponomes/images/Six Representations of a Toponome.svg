<text xml:space="preserve" x="750" y="412" font-size="18" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">u = 1</text>
<line x1="180" y1="305" x2="180" y2="365" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<text xml:space="preserve" x="320" y="342" font-size="22" fill="#24628a" style="fill:#24628a" font-weight="400" text-anchor="middle">× h(λ)</text>
<text xml:space="preserve" x="560" y="555" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">Rightward: group coefficients and lose distinctions</text>
<text xml:space="preserve" x="560" y="590" font-size="21" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Keep n separately; the index of x is the component grade</text>
</svg>
