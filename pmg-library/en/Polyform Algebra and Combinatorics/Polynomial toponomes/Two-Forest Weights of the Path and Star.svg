<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="785" viewBox="0 0 1100 785" role="img" aria-labelledby="title desc">
<title id="title">Two-forest weights of the path and star</title>
<desc id="desc">Deleting each edge of the unit-weight path P4 gives component-size products 3,4,3; for the star K1,3 they are 3,3,3. The Kirchhoff indices are 10 and 9.</desc>
