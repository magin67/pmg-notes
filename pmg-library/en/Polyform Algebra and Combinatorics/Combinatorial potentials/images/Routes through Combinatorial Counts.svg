<text x="190" y="245" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Application to SPFs</text>
<text x="190" y="274" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Type → sum → forests</text>
