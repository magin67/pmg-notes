<path d="M560 125 V155 H560 V190" fill="none" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M560 125 V155 H930 V190" fill="none" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
