<style>text{font-family:Arial,sans-serif;fill:#203344}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1120" height="650" fill="white"/>
<rect x="290" y="25" width="540" height="100" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="560" y="65" font-size="24" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Partitions of a prescribed type</text>
<text x="560" y="94" font-size="24" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Second-kind potential</text>
