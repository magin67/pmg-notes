<text x="560" y="245" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Joining components</text>
<text x="560" y="274" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Cayley’s theorem</text>
<rect x="760" y="200" width="340" height="110" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="930" y="245" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">Cyclic partitions</text>
<text x="930" y="274" font-size="22" fill="#203344" style="fill:#203344" font-weight="600" text-anchor="middle">First-kind potential</text>
<line x1="190" y1="315" x2="190" y2="365" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="560" y1="315" x2="560" y2="365" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="930" y1="315" x2="930" y2="365" stroke="#24628a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="20" y="375" width="340" height="115" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="190" y="420" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Representation size</text>
<text x="190" y="449" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">and identity coefficient</text>
<rect x="390" y="375" width="340" height="115" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="560" y="420" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Rooted forests</text>
<text x="560" y="449" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Code → r-Stirling numbers</text>
<rect x="760" y="375" width="340" height="115" rx="14" fill="#f7fafc" stroke="#ccd7df" stroke-width="1.5"/>
<text x="930" y="420" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Paths and cycles</text>
<text x="930" y="449" font-size="22" fill="#203344" style="fill:#203344" font-weight="400" text-anchor="middle">Graphs → histories</text>
<text x="560" y="555" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">What is labelled? What is already fixed?</text>
<text x="560" y="584" font-size="24" fill="#24628a" style="fill:#24628a" font-weight="600" text-anchor="middle">Which written arrangements represent the same object?</text>
