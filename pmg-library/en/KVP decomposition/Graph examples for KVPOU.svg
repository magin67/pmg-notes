<svg xmlns="http://www.w3.org/2000/svg" width="735" height="850" viewBox="0 0 735 850" role="img" aria-labelledby="title desc"><title id="title">Graph examples for KVPOU</title><desc id="desc">Four directed graphs with increasing numbers of nonzero components: K and O; K, P, O; K, V, P, O; all five components.</desc><defs><marker id="blue" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#245d91" /></marker><marker id="red" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b3482b" /></marker></defs><rect width="100%" height="100%" fill="white" /><text x="26" y="31" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#182b40" text-anchor="start" dominant-baseline="middle" font-weight="bold">From a directed cycle to full KVPOU</text><g transform="translate(25,65)"><rect width="330" height="345" rx="12" fill="white" stroke="#d7e0e8" /><text x="165" y="29" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Unit directed 3-cycle</text><path d="M 161.24 107.74 L 232.69 220.57" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 224.00 240.00 L 78.00 240.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 66.24 222.26 L 137.69 109.43" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><circle cx="150" cy="90" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="150" y="91" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">a</text><circle cx="245" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="245" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">b</text><circle cx="55" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="55" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">c</text><text x="165" y="293" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">K + O</text><text x="165" y="324" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="normal">All degrees equal 1</text></g><g transform="translate(380,65)"><rect width="330" height="345" rx="12" fill="white" stroke="#d7e0e8" /><text x="165" y="29" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Unit directed 4-cycle</text><path d="M 86.00 100.00 L 222.00 100.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 245.00 121.00 L 245.00 217.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 224.00 240.00 L 88.00 240.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 65.00 219.00 L 65.00 123.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><circle cx="65" cy="100" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="65" y="101" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">a</text><circle cx="245" cy="100" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="245" y="101" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">b</text><circle cx="245" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="245" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">c</text><circle cx="65" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="65" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">d</text><text x="165" y="293" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">K + P + O</text><text x="165" y="324" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="normal">All degrees equal 1</text></g><g transform="translate(25,433)"><rect width="330" height="345" rx="12" fill="white" stroke="#d7e0e8" /><text x="165" y="29" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Balance without regularity</text><path d="M 86.00 100.00 L 222.00 100.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 245.00 121.00 L 245.00 217.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 228.42 227.11 L 83.16 114.12" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 58.00 121.00 L 58.00 217.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 72.00 219.00 L 72.00 123.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><circle cx="65" cy="100" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="65" y="101" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">a</text><circle cx="245" cy="100" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="245" y="101" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">b</text><circle cx="245" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="245" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">c</text><circle cx="65" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="65" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">d</text><text x="165" y="293" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">K + V + P + O</text><text x="165" y="324" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="normal">In = out: (2, 1, 1, 1)</text></g><g transform="translate(380,433)"><rect width="330" height="345" rx="12" fill="white" stroke="#d7e0e8" /><text x="165" y="29" font-family="DejaVu Sans, sans-serif" font-size="18.46" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">One weight increased to 2</text><path d="M 86.00 100.00 L 222.00 100.00" fill="none" stroke="#b3482b" stroke-width="3" marker-end="url(#red)" /><rect x="142.0" y="102.0" width="26" height="28" rx="5" fill="white" /><text x="155.0" y="116.0" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#b3482b" text-anchor="middle" dominant-baseline="middle" font-weight="bold">2</text><path d="M 245.00 121.00 L 245.00 217.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 228.42 227.11 L 83.16 114.12" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 58.00 121.00 L 58.00 217.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><path d="M 72.00 219.00 L 72.00 123.00" fill="none" stroke="#245d91" stroke-width="3" marker-end="url(#blue)" /><circle cx="65" cy="100" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="65" y="101" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">a</text><circle cx="245" cy="100" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="245" y="101" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">b</text><circle cx="245" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="245" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">c</text><circle cx="65" cy="240" r="18" fill="#f0f5f9" stroke="#253d53" stroke-width="2" /><text x="65" y="241" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="bold">d</text><text x="165" y="293" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#245d91" text-anchor="middle" dominant-baseline="middle" font-weight="bold">K + V + P + O + U</text><text x="165" y="324" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#182b40" text-anchor="middle" dominant-baseline="middle" font-weight="normal">Imbalance at a and b</text></g><text x="26" y="821" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182b40" text-anchor="start" dominant-baseline="middle" font-weight="normal">Unlabeled arcs have weight 1. The original graphs are shown.</text></svg>
