<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="434" viewBox="0 0 1125 434" role="img" aria-labelledby="title desc"><title id="title">Vertex and pair changes in KVP interactions</title><desc id="desc">Three increment graphs: 4 on each of ab, ac, ad; 6 on cd alone; and the P-projection of the second increment, with 2 on ab and cd and minus 1 on the other four pairs. Participant names are fictitious.</desc><rect width="1125" height="434" fill="#f4f7fa" /><text x="20" y="32" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="start" fill="#243b53">Interactions: observed change and its projection</text><text x="20" y="51" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#243b53">a: Anna; b: Boris; c: Vera; d: Gleb</text><g transform="translate(15,58)"><rect width="355" height="355" rx="12" fill="white" stroke="#cbd5e1" /><text x="178" y="33" font-family="Arial, sans-serif" font-size="18.85" font-weight="bold" text-anchor="middle" fill="#243b53">Increased activity of Anna</text><path d="M 93.00 110.00 L 262.00 110.00" stroke="#286b99" stroke-width="3" fill="none" /><path d="M 89.70 120.39 L 265.30 244.61" stroke="#286b99" stroke-width="3" fill="none" /><path d="M 75.00 128.00 L 75.00 237.00" stroke="#286b99" stroke-width="3" fill="none" /><circle cx="75" cy="110" r="18" fill="white" stroke="#286b99" stroke-width="2" /><text x="75" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">a</text><circle cx="280" cy="110" r="18" fill="white" stroke="#286b99" stroke-width="2" /><text x="280" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">b</text><circle cx="280" cy="255" r="18" fill="white" stroke="#286b99" stroke-width="2" /><text x="280" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#243b53">c</text><circle cx="75" cy="2