<text x="260" y="362" text-anchor="middle" font-size="20" fill="#2666a6" font-weight="normal" font-style="normal">V</text>
<text x="125" y="345" text-anchor="middle" font-size="20" fill="#2666a6" font-weight="normal" font-style="normal">−</text>
<text x="395" y="345" text-anchor="middle" font-size="20" fill="#2666a6" font-weight="normal" font-style="normal">+</text>
