<text x="427" y="321" text-anchor="middle" font-size="23" fill="#203244" font-weight="normal" font-style="italic">c</text>
<text x="266" y="404" text-anchor="middle" font-size="22" fill="#2666a6">β((ab), (ac)) = φ<tspan baseline-shift="sub" font-size="16">c</tspan><tspan> − φ</tspan><tspan baseline-shift="sub" font-size="16">a</tspan></text>
