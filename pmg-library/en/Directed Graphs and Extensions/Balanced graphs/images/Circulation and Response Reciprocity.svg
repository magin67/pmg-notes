<text x="673" y="90" text-anchor="middle" font-size="20" fill="#2666a6" font-weight="normal" font-style="normal">−</text>
<text x="943" y="90" text-anchor="middle" font-size="20" fill="#2666a6" font-weight="normal" font-style="normal">+</text>
<line x1="1025.00" y1="295.00" x2="971.00" y2="295.00" stroke="#b55a17" stroke-width="3" marker-end="url(#orange)"/>
