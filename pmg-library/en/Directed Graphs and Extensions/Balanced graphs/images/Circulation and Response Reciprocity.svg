<text x="642" y="275" text-anchor="middle" font-size="23" fill="#203244" font-weight="normal" font-style="italic">a</text>
<circle cx="958" cy="150" r="9" fill="white" stroke="#203244" stroke-width="2"/>
<text x="958" y="179" text-anchor="middle" font-size="23" fill="#203244" font-weight="normal" font-style="italic">b</text>
<circle cx="958" cy="295" r="9" fill="white" stroke="#203244" stroke-width="2"/>
<text x="975" y="321" text-anchor="middle" font-size="23" fill="#203244" font-weight="normal" font-style="italic">c</text>
<text x="814" y="404" text-anchor="middle" font-size="22" fill="#2666a6">β((ac), (ab)) = φ<tspan baseline-shift="sub" font-size="16">b</tspan><tspan> − φ</tspan><tspan baseline-shift="sub" font-size="16">a</tspan></text>
<text x="540" y="473" text-anchor="middle" font-size="25" font-weight="bold">χ<tspan baseline-shift="sub" font-size="18">abc</tspan><tspan> = β((ab), (ac)) − β((ac), (ab))</tspan></text>
</g></svg>
