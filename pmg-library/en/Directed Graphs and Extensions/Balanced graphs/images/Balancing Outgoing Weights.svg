<text x="560.00" y="620.00" font-size="21" fill="#20344a" text-anchor="middle" font-weight="bold">σ<tspan baseline-shift="sub" font-size="70%">a</tspan> = 15/16;    σ<tspan baseline-shift="sub" font-size="70%">b</tspan> = 12/16;    σ<tspan baseline-shift="sub" font-size="70%">c</tspan> = 21/16</text>
<text x="560.00" y="660.00" font-size="20" fill="#20344a" text-anchor="middle">Arc color identifies its source and common multiplier.</text>
