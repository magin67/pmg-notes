<title id="title">Resistance geometry of a unit directed 3-cycle</title><desc id="desc">The directed cycle a to b to c to a has unit weights. Its resistance geometry is an equilateral triangle of side 1. Mean forward and reverse sequential traversal times are 3 and 6; the circulation norm is minus 1.</desc>
